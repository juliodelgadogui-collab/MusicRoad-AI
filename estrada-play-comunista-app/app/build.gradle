plugins {
    id 'com.android.application'
}

def estradaPlayUrl = project.findProperty('ESTRADAPLAY_URL') ?: 'https://musicroad1.gestao2.store/'
def estradaPlayDevKey = file('../signing/estradaplay-dev.keystore')

android {
    namespace 'com.estradaplay.comunista'
    compileSdk 35

    defaultConfig {
        applicationId 'com.estradaplay.comunista'
        minSdk 24
        targetSdk 35
        versionCode 152
        versionName '1.5.2'
        buildConfigField 'String', 'SERVER_URL', '"' + estradaPlayUrl.replace('"', '\\"') + '"'
    }

    buildFeatures { buildConfig true }

    flavorDimensions += 'orientation'
    productFlavors {
        vertical {
            dimension 'orientation'
            applicationIdSuffix '.vertical'
            manifestPlaceholders = [
                appLabel: 'Estrada Play Comunista Vertical',
                appOrientation: 'sensorPortrait'
            ]
            buildConfigField 'String', 'FIXED_LAYOUT', '"vertical"'
        }
        horizontal {
            dimension 'orientation'
            applicationIdSuffix '.horizontal'
            manifestPlaceholders = [
                appLabel: 'Estrada Play Comunista Horizontal',
                appOrientation: 'sensorLandscape'
            ]
            buildConfigField 'String', 'FIXED_LAYOUT', '"horizontal"'
        }
    }

    signingConfigs {
        debug {
            storeFile estradaPlayDevKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'org.maplibre.gl:android-sdk:13.4.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
