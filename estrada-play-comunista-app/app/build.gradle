plugins {
    id 'com.android.application'
}

def estradaPlayUrl = project.findProperty('ESTRADAPLAY_URL') ?: 'https://musicroad1.gestao2.store/'
def estradaPlayDevKey = file('../signing/estradaplay-dev.keystore')
def releaseKeyPath = project.findProperty('ESTRADAPLAY_RELEASE_KEYSTORE') ?: System.getenv('ESTRADAPLAY_RELEASE_KEYSTORE')
def releaseStorePassword = project.findProperty('ESTRADAPLAY_RELEASE_STORE_PASSWORD') ?: System.getenv('ESTRADAPLAY_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('ESTRADAPLAY_RELEASE_KEY_ALIAS') ?: System.getenv('ESTRADAPLAY_RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('ESTRADAPLAY_RELEASE_KEY_PASSWORD') ?: System.getenv('ESTRADAPLAY_RELEASE_KEY_PASSWORD')
def releaseSigningReady = releaseKeyPath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseKeyPath).isFile()

// EPC_236_HORIZONTAL_STACKOVERFLOW_GUARD
// 2.3.5 originally selected the whole right dock as its own media child. That can
// create a cyclic ViewGroup and Android then overflows in resetResolvedLayoutDirection().
// Keep every Gradle build safe while the cockpit source remains compatible with
// older branches/workflows.
def horizontalCockpitSource = file('src/main/java/com/estradaplay/comunista/HorizontalCockpitV235.java')
if (horizontalCockpitSource.isFile()) {
    def sourceText = horizontalCockpitSource.getText('UTF-8')
    def unsafeLookup = 'LinearLayout media = findLinearWithText(dock, "MÚSICA OFFLINE");'
    def safeLookup = 'LinearLayout media = findDirectLinearWithText(dock, "MÚSICA OFFLINE");'
    if (sourceText.contains(unsafeLookup)) {
        horizontalCockpitSource.write(sourceText.replace(unsafeLookup, safeLookup), 'UTF-8')
    }
}

// EPC_CONVOY_PUBLIC_LINK_V238
// The internal API hostname stays private. Shared convoy invitations use the
// public domain, which redirects the user back into the installed Android app.
def convoyIntegrationSource = file('src/main/java/com/estradaplay/comunista/ConvoyIntegrationV237.java')
if (convoyIntegrationSource.isFile()) {
    def sourceText = convoyIntegrationSource.getText('UTF-8')
    def directInvite = 'return code.isEmpty() ? "" : "estradaplay://comboio/" + Uri.encode(code);'
    def publicInvite = 'return code.isEmpty() ? "" : "https://www.xn--gesto-dra.store/c/" + Uri.encode(code);'
    if (sourceText.contains(directInvite)) {
        convoyIntegrationSource.write(sourceText.replace(directInvite, publicInvite), 'UTF-8')
    }
}

android {
    namespace 'com.estradaplay.comunista'
    compileSdk 35

    defaultConfig {
        applicationId 'com.estradaplay.comunista'
        minSdk 24
        targetSdk 35
        versionCode 239
        versionName '2.3.8'
        buildConfigField 'String', 'SERVER_URL', '"' + estradaPlayUrl.replace('"', '\\"') + '"'
    }

    buildFeatures { buildConfig true }

    flavorDimensions += 'orientation'
    productFlavors {
        universal {
            dimension 'orientation'
            applicationIdSuffix '.universal'
            manifestPlaceholders = [
                appLabel: 'Estrada Play Comunista',
                appOrientation: 'fullSensor'
            ]
            buildConfigField 'String', 'FIXED_LAYOUT', '"universal"'
        }
        vertical {
            dimension 'orientation'
            applicationIdSuffix '.vertical'
            manifestPlaceholders = [
                appLabel: 'Estrada Play Comunista Vertical',
                appOrientation: 'sensorPortrait'
            ]
            buildConfigField 'String', 'FIXED_LAYOUT', '"vertical"'
        }
        horizontal {
            dimension 'orientation'
            applicationIdSuffix '.horizontal'
            manifestPlaceholders = [
                appLabel: 'Estrada Play Comunista Horizontal',
                appOrientation: 'sensorLandscape'
            ]
            buildConfigField 'String', 'FIXED_LAYOUT', '"horizontal"'
        }
    }

    signingConfigs {
        debug {
            storeFile estradaPlayDevKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeyPath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            if (releaseSigningReady) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'org.maplibre.gl:android-sdk:13.4.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'io.github.webrtc-sdk:android:144.7559.09'
    testImplementation 'junit:junit:4.13.2'
}
