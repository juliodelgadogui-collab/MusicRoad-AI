plugins {
    id 'com.android.application'
}

def estradaPlayUrl = project.findProperty('ESTRADAPLAY_URL') ?: 'https://musicroad1.gestao2.store/'
def convoyPublicUrl = project.findProperty('ESTRADAPLAY_CONVOY_PUBLIC_URL') ?: 'https://www.xn--gesto-dra.store/c/'
def estradaPlayDevKey = file('../signing/estradaplay-dev.keystore')
def releaseKeyPath = project.findProperty('ESTRADAPLAY_RELEASE_KEYSTORE') ?: System.getenv('ESTRADAPLAY_RELEASE_KEYSTORE')
def releaseStorePassword = project.findProperty('ESTRADAPLAY_RELEASE_STORE_PASSWORD') ?: System.getenv('ESTRADAPLAY_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('ESTRADAPLAY_RELEASE_KEY_ALIAS') ?: System.getenv('ESTRADAPLAY_RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('ESTRADAPLAY_RELEASE_KEY_PASSWORD') ?: System.getenv('ESTRADAPLAY_RELEASE_KEY_PASSWORD')
def releaseSigningReady = releaseKeyPath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseKeyPath).isFile()

android {
    namespace 'com.estradaplay.comunista'
    compileSdk 36

    defaultConfig {
        applicationId 'com.estradaplay.comunista'
        minSdk 24
        targetSdk 36
        versionCode 400
        versionName '4.0.0'
        buildConfigField 'String', 'SERVER_URL', '"' + estradaPlayUrl.replace('"', '\\"') + '"'
        buildConfigField 'String', 'CONVOY_PUBLIC_URL', '"' + convoyPublicUrl.replace('"', '\\"') + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig true }

    flavorDimensions += 'orientation'
    productFlavors {
        universal {
            dimension 'orientation'
            applicationIdSuffix '.universal'
            manifestPlaceholders = [appLabel: 'Estrada Play Comunista', appOrientation: 'fullSensor']
            buildConfigField 'String', 'FIXED_LAYOUT', '"universal"'
        }
        vertical {
            dimension 'orientation'
            applicationIdSuffix '.vertical'
            manifestPlaceholders = [appLabel: 'Estrada Play Comunista Vertical', appOrientation: 'sensorPortrait']
            buildConfigField 'String', 'FIXED_LAYOUT', '"vertical"'
        }
        horizontal {
            dimension 'orientation'
            applicationIdSuffix '.horizontal'
            manifestPlaceholders = [appLabel: 'Estrada Play Comunista Horizontal', appOrientation: 'sensorLandscape']
            buildConfigField 'String', 'FIXED_LAYOUT', '"horizontal"'
        }
    }

    signingConfigs {
        debug {
            storeFile estradaPlayDevKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeyPath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.teste'
            versionNameSuffix '-teste'
            manifestPlaceholders = [appLabel: 'Estrada Play Comunista Teste']
            signingConfig signingConfigs.debug
        }
        candidate {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            manifestPlaceholders = [appLabel: 'Estrada Play Comunista']
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            if (releaseSigningReady) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

gradle.taskGraph.whenReady { graph ->
    boolean wantsReleaseArtifact = graph.allTasks.any { task ->
        String n = task.name == null ? '' : task.name.toLowerCase(java.util.Locale.ROOT)
        (n.startsWith('assemble') || n.startsWith('bundle')) && n.contains('release')
    }
    if (wantsReleaseArtifact && !releaseSigningReady) {
        throw new GradleException('Release bloqueado: configure ESTRADAPLAY_RELEASE_KEYSTORE, ESTRADAPLAY_RELEASE_STORE_PASSWORD, ESTRADAPLAY_RELEASE_KEY_ALIAS e ESTRADAPLAY_RELEASE_KEY_PASSWORD com a chave permanente de produção.')
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.maplibre.gl:android-sdk:13.4.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'io.github.webrtc-sdk:android:144.7559.09'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
