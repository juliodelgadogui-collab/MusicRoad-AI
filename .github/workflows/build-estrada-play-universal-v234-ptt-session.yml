name: Estrada Play Universal 2.3.4 PTT Estavel Sessao Persistente
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/ApiClient.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/SecureDeviceCredential.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadRadioService.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadRadioActivity.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadRadioRtcPolicy.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/EstradaPlayApplication.java'
      - 'estrada-play-comunista-app/app/src/main/AndroidManifest.xml'
      - 'estrada-play-comunista-app/app/src/test/**'
      - 'estrada-play-comunista-app/app/build.gradle'
      - 'api/native_app.php'
      - 'api/native_auth.php'
      - 'tools/ci_build_epc_v234_ptt_session.sh'
      - '.github/workflows/build-estrada-play-comunista*.yml'
      - '.github/workflows/build-estrada-play-portable*.yml'
      - '.github/workflows/build-estrada-play-universal-v*.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v234-ptt-session
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Verify 2.3.4 PTT and session architecture
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          T="$APP/app/src/test/java/com/estradaplay/comunista"
          grep -q 'versionCode 234' "$APP/app/build.gradle"
          grep -q "versionName '2.3.4'" "$APP/app/build.gradle"
          grep -q 'SESSION_RECOVERY_V234' "$J/SecureDeviceCredential.java"
          grep -q 'access_token_recovery_v234' "$J/SecureDeviceCredential.java"
          grep -q 'refresh_token_recovery_v234' "$J/SecureDeviceCredential.java"
          grep -q 'PTT_STABILITY_V234' "$J/RoadRadioService.java"
          grep -q 'android:process=":radio"' "$APP/app/src/main/AndroidManifest.xml"
          grep -q 'if (isRadioProcess()) return' "$J/EstradaPlayApplication.java"
          grep -q 'if(!live.isEmpty() && ensureRtcReady())' "$J/RoadRadioService.java"
          test -f "$T/RoadRadioRtcPolicyTest.java"
          grep -q 'SESSION_HOST_COMPAT_V233' "$J/ApiClient.java"
          grep -q 'COMBOIO_AVANCADO_V230' "$J/ConvoyActivity.java"
          grep -q 'BASE_CONSOLIDADA_V210' "$J/RoadSafetyService.java"

          legacy_workflows="$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'build-estrada-play-comunista*.yml' -o -name 'build-estrada-play-portable*.yml' -o -name 'build-estrada-play-universal-v*.yml' \) \
            ! -name 'build-estrada-play-universal-v234-ptt-session.yml' -print)"
          if [ -n "$legacy_workflows" ]; then
            echo 'Obsolete EPC Android workflow detected:'
            printf '%s\n' "$legacy_workflows"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Production signing readiness
        env:
          KEYSTORE_B64: ${{ secrets.ESTRADAPLAY_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo 'SIGNING_STATUS=production-ready' >> "$GITHUB_ENV"
          else
            echo 'SIGNING_STATUS=development-test' >> "$GITHUB_ENV"
          fi

      - name: Unit tests, build and validate 2.3.4
        run: bash tools/ci_build_epc_v234_ptt_session.sh

      - name: Publish 2.3.4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-2.3.4-ptt-estavel-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Estrada Play Comunista Universal 2.3.4 - PTT Estavel e Sessao Persistente" \
            --notes "Hotfix para os dois problemas restantes observados no aparelho real. O Rádio entra na sala sem inicializar WebRTC/microfone quando não existe outro motorista; o motor nativo só inicia com peer real e é encerrado quando a sala volta a ficar vazia. RoadRadioService passa a rodar isolado em :radio, então uma falha nativa de áudio não derruba Central, navegação ou proteção. Access/refresh tokens agora também possuem recuperação privada limitada pela expiração para ROMs cujo Keystore falha depois de recriar o processo; gravações críticas de auth usam commit antes do processo do rádio. Compatibilidade de servidor 2.3.3, Comboio Avançado e Biblioteca permanecem preservados. Sem mudança de servidor, sem WebView. Signing: ${SIGNING_STATUS}." \
            Estrada-Play-Comunista-Universal-2.3.4-PTT-Estavel-Sessao-Persistente.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.3.4-PTT-Estavel-Sessao-Persistente
          path: Estrada-Play-Comunista-Universal-2.3.4-PTT-Estavel-Sessao-Persistente.apk
          retention-days: 3
          compression-level: 0
