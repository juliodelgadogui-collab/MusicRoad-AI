name: Estrada Play Universal 2.3.1 Reinstalacao Segura
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/GateActivity.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/ApiClient.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/ReinstallSessionPolicy.java'
      - 'estrada-play-comunista-app/app/src/test/**'
      - 'estrada-play-comunista-app/app/build.gradle'
      - 'tools/ci_build_epc_v231_reinstall_auth.sh'
      - '.github/workflows/build-estrada-play-comunista*.yml'
      - '.github/workflows/build-estrada-play-portable*.yml'
      - '.github/workflows/build-estrada-play-universal-v*.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v231-reinstall-auth
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Verify reinstall-safe direct-source architecture
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          T="$APP/app/src/test/java/com/estradaplay/comunista"
          grep -q 'versionCode 231' "$APP/app/build.gradle"
          grep -q "versionName '2.3.1'" "$APP/app/build.gradle"
          grep -q 'REINSTALL_AUTH_FIX_V231' "$J/GateActivity.java"
          grep -q 'REINSTALL_AUTH_FIX_V231' "$J/ApiClient.java"
          grep -q 'REINSTALL_AUTH_FIX_V231' "$J/ReinstallSessionPolicy.java"
          test -f "$T/ReinstallSessionPolicyTest.java"
          grep -q 'COMBOIO_AVANCADO_V230' "$J/ConvoyActivity.java"
          grep -q 'BASE_CONSOLIDADA_V210' "$J/RoadSafetyService.java"

          legacy_workflows="$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'build-estrada-play-comunista*.yml' -o -name 'build-estrada-play-portable*.yml' -o -name 'build-estrada-play-universal-v*.yml' \) \
            ! -name 'build-estrada-play-universal-v231-reinstall-auth.yml' -print)"
          if [ -n "$legacy_workflows" ]; then
            echo 'Obsolete EPC Android workflow detected:'
            printf '%s\n' "$legacy_workflows"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Production signing readiness
        env:
          KEYSTORE_B64: ${{ secrets.ESTRADAPLAY_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo 'SIGNING_STATUS=production-ready' >> "$GITHUB_ENV"
          else
            echo 'SIGNING_STATUS=development-test' >> "$GITHUB_ENV"
          fi

      - name: Unit tests, build and validate 2.3.1
        run: bash tools/ci_build_epc_v231_reinstall_auth.sh

      - name: Publish 2.3.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-2.3.1-reinstalacao-segura-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Estrada Play Comunista Universal 2.3.1 - Reinstalacao Segura" \
            --notes "Hotfix para reinstalação/limpeza de dados. Uma conta lembrada na interface não é mais tratada como sessão autenticada quando a credencial protegida pelo Android Keystore foi perdida. Se houver internet e o app detectar conta lembrada sem access/refresh seguro, remove apenas a sessão local inválida e encaminha para o fluxo normal de login. Após usuário e senha, o servidor 2.0.7+ substitui a credencial antiga pela nova credencial da instalação. Offline continua sem exigir login forçado. Comboio Avançado 2.3.0 e todos os marcos anteriores permanecem preservados. Sem mudança de servidor. Build nativo direto do fonte, sem WebView. Signing: ${SIGNING_STATUS}." \
            Estrada-Play-Comunista-Universal-2.3.1-Reinstalacao-Segura.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.3.1-Reinstalacao-Segura
          path: Estrada-Play-Comunista-Universal-2.3.1-Reinstalacao-Segura.apk
          retention-days: 3
          compression-level: 0
