name: Estrada Play Universal 2.0.5 Cockpit Horizontal
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_v205_horizontal_cockpit.py'
      - 'tools/ci_build_epc_v205_horizontal_cockpit.sh'
      - '.github/workflows/build-estrada-play-universal-v205-horizontal-cockpit.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v205-horizontal-cockpit
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Generate 2.0.5 horizontal cockpit source
        run: |
          python3 -m py_compile tools/patch_estrada_play_v205_horizontal_cockpit.py
          python3 tools/patch_estrada_play_v205_horizontal_cockpit.py

      - name: Verify 2.0.5 horizontal architecture
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          grep -q 'versionCode 205' "$APP/app/build.gradle"
          grep -q "versionName '2.0.5'" "$APP/app/build.gradle"
          grep -q 'HORIZONTAL_COCKPIT_V205' "$J/RoadMapActivity.java"
          grep -q 'buildLandscapeMapPaneV205' "$J/RoadMapActivity.java"
          grep -q 'buildLandscapeDockV205' "$J/RoadMapActivity.java"
          grep -q 'applyAutomotiveSystemUiV205' "$J/RoadMapActivity.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Persist generated 2.0.5 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app/app/build.gradle \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java
          git commit -m "Generate Universal 2.0.5 Cockpit Horizontal [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and validate APK
        run: bash tools/ci_build_epc_v205_horizontal_cockpit.sh

      - name: Publish 2.0.5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-2.0.5-cockpit-horizontal-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "Estrada Play Comunista Universal 2.0.5 - Cockpit Horizontal" \
            --notes "Refaz a navegação horizontal como central multimídia automotiva dedicada: mapa ocupa a maior parte da tela, barra EPC fica estreita porém com rótulos sem quebra, painel direito vira dock compacto, instrução de rota deixa de cobrir o mapa inteiro, velocímetro/limite ficam isolados, alerta e métricas ficam nas bordas e o modo horizontal usa interface imersiva. Mantém Biblioteca Corrigida 2.0.4, Recuperação Offline 2.0.3, Central Automotiva, Clima da Rota e voz completa. Sem WebView." \
            Estrada-Play-Comunista-Universal-2.0.5-Cockpit-Horizontal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.0.5-Cockpit-Horizontal
          path: Estrada-Play-Comunista-Universal-2.0.5-Cockpit-Horizontal.apk
          retention-days: 3
          compression-level: 0
