name: Estrada Play Universal 1.7.6 Unified Radio Panel
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_radio_panel_v176.py'
      - '.github/workflows/build-estrada-play-universal-v176-radio-panel.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Apply unified radio panel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_estrada_play_radio_panel_v176.py
          python3 tools/patch_estrada_play_radio_panel_v176.py

      - name: Verify exact UI fix
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          grep -q "versionName '1.7.6'" "$G"
          grep -q 'versionCode 176' "$G"
          grep -q 'PORTRAIT_NAV_FIT_V174' "$J/UnifiedAppShell.java"
          grep -q 'addNavChipFit(a,row,"CENTRAL"' "$J/UnifiedAppShell.java"
          grep -q 'UNIFIED_ROAD_PICKER_V176' "$J/RoadRadioActivity.java"
          grep -q 'for(String road:roads)' "$J/RoadRadioActivity.java"
          grep -q 'DIGITAR RODOVIA' "$J/RoadRadioActivity.java"
          grep -q 'autoRoadHint' "$J/RoadRadioService.java"
          ! grep -q 'new android.app.AlertDialog.Builder(this)' "$J/RoadRadioActivity.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app
          git commit -m "Generate Universal 1.7.6 unified radio panel [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore

      - name: Generate embedded safety voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          test "$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 77

      - name: Build Universal APK
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleUniversalDebug

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          A=estrada-play-comunista-app/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$A"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$A" | tee /tmp/v176.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='176' versionName='1.7.6'" /tmp/v176.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$A" >/tmp/v176-cert.txt
          cp "$A" Estrada-Play-Comunista-Universal-1.7.6-Correcao-Radio-Interface.apk
          sha256sum Estrada-Play-Comunista-Universal-1.7.6-Correcao-Radio-Interface.apk | tee /tmp/v176-sha.txt

      - name: Publish Universal 1.7.6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.7.6-radio-ui-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Estrada Play Comunista Universal 1.7.6 - Rádio Unificado" --notes "Correção direta dos problemas mostrados no teste. No vertical, Estrada/Música/Rádio/Viagem/Central ficam visíveis simultaneamente. O seletor de rodovia usa painel próprio do Estrada Play, mostra a lista real rolável e permite digitar uma rodovia sem abrir AlertDialog padrão do Android. Preserva o reconhecimento automático de rodovia da 1.7.5. Sem função nova, sem alteração no servidor e sem WebView." Estrada-Play-Comunista-Universal-1.7.6-Correcao-Radio-Interface.apk

      - name: Temporary artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Universal-1.7.6-Radio-UI
          path: Estrada-Play-Comunista-Universal-1.7.6-Correcao-Radio-Interface.apk
          retention-days: 1
          compression-level: 0
