name: Estrada Play Universal 2.0.4 Biblioteca Corrigida
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_v204_music_library.py'
      - 'tools/ci_build_epc_v204_music_library.sh'
      - '.github/workflows/build-estrada-play-universal-v204-biblioteca-corrigida.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v204-biblioteca
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Generate 2.0.4 music library fix
        run: |
          python3 -m py_compile tools/patch_estrada_play_v204_music_library.py
          python3 tools/patch_estrada_play_v204_music_library.py

      - name: Verify 2.0.4 navigation architecture
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          grep -q 'versionCode 204' "$APP/app/build.gradle"
          grep -q "versionName '2.0.4'" "$APP/app/build.gradle"
          grep -q 'MUSIC_LIBRARY_NAV_V204' "$J/MusicPlayerActivity.java"
          grep -q 'manage.setOnClickListener(v->showOfflineLibrary())' "$J/MusicPlayerActivity.java"
          grep -q 'private void openDownloads()' "$J/MusicPlayerActivity.java"
          grep -q 'ADICIONAR / BAIXAR MÚSICAS' "$J/MusicPlayerActivity.java"
          grep -q 'OFFLINE_DISCOVERY_V203' "$J/LibraryStore.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Persist generated 2.0.4 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app/app/build.gradle \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MusicPlayerActivity.java
          git commit -m "Generate Universal 2.0.4 Biblioteca Corrigida [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and validate APK
        run: bash tools/ci_build_epc_v204_music_library.sh

      - name: Publish 2.0.4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-2.0.4-biblioteca-corrigida-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "Estrada Play Comunista Universal 2.0.4 - Biblioteca Corrigida" \
            --notes "Corrige o botão Biblioteca da tela Música. Biblioteca agora leva diretamente à lista de músicas offline no próprio player, sem abrir o gerenciador de downloads. Adicionar/Baixar músicas continua separado e abre o gerenciador de downloads. Também reduz a altura do cartão do player no modo vertical para a biblioteca ficar mais acessível. Mantém a recuperação offline da 2.0.3, armazenamento privado, Central Automotiva, voz completa e sem WebView." \
            Estrada-Play-Comunista-Universal-2.0.4-Biblioteca-Corrigida.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.0.4-Biblioteca-Corrigida
          path: Estrada-Play-Comunista-Universal-2.0.4-Biblioteca-Corrigida.apk
          retention-days: 3
          compression-level: 0
