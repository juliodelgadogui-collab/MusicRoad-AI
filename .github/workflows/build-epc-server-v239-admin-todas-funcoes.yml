name: EPC Server 2.3.9 Admin Todas Funcoes
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'admin_central.php'
      - 'admin*.php'
      - 'diagnostico_estradaplay_209.php'
      - 'index.php'
      - 'login.php'
      - 'logout.php'
      - 'mapbox_config.php'
      - 'api/**'
      - 'assets/**'
      - 'importers/**'
      - 'cron/**'
      - 'database/**'
      - '.htaccess'
      - '.github/workflows/build-epc-server-v239-admin-todas-funcoes.yml'
  workflow_dispatch:

concurrency:
  group: epc-server-v239-admin-todas-funcoes
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Validate complete administration
        shell: bash
        run: |
          set -euo pipefail
          php -l admin_central.php
          for f in admin*.php; do php -l "$f"; done
          php -l diagnostico_estradaplay_209.php
          php -l index.php
          php -l login.php
          php -l logout.php
          find api importers cron -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q 'ADMIN_ALL_FUNCTIONS_V239' admin_central.php
          grep -q "'convoys'" admin_central.php
          grep -q "'traffic_weather'" admin_central.php
          grep -q "'fuel'" admin_central.php
          grep -q "'audit'" admin_central.php
          grep -q 'admin_official_data_cleanup.php' admin_central.php

      - name: Package complete server administration
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/epc-v239
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # Root server/control files. No Android source and no old ZIPs.
          cp .htaccess "$OUT/" 2>/dev/null || true
          cp index.php login.php logout.php mapbox_config.php diagnostico_estradaplay_209.php "$OUT/"
          cp admin*.php "$OUT/"

          # All dependencies used by the administration and server APIs.
          cp -a api "$OUT/api"
          cp -a assets "$OUT/assets"
          cp -a importers "$OUT/importers"
          cp -a cron "$OUT/cron"
          cp -a database "$OUT/database"

          # Never ship runtime credentials, databases, logs or media.
          rm -f "$OUT/config/config.php" 2>/dev/null || true
          rm -rf "$OUT/logs" "$OUT/storage" 2>/dev/null || true

          cat > "$OUT/LEIA-ME.txt" <<'EOF'
          Estrada Play Comunista - Servidor 2.3.9 - Administração com TODAS as funções

          Este pacote substitui os pacotes administrativos incrementais anteriores.
          Ele leva a central administrativa e TODAS as dependências de servidor necessárias
          para os módulos existentes, sem incluir credenciais, banco de dados, logs ou mídia.

          Menu administrativo:
          PRINCIPAL
          - Visão geral

          CONTAS E MÍDIA
          - Usuários
          - Clientes / Google Drive / músicas
          - Dispositivos

          ESTRADA
          - Estrada Viva
          - Relatos
          - Base comunitária
          - Trânsito e clima
          - Combustível
          - Radares
          - Comboios
          - Rádio PTT

          DADOS E MANUTENÇÃO
          - Base oficial / limpeza
          - Servidor
          - Operações / housekeeping
          - Auditoria / logs

          DIAGNÓSTICO
          - Autenticação
          - Diagnóstico legado 2.0.9

          IMPORTANTE:
          - Não altera nem inclui config/config.php.
          - Não inclui banco existente.
          - Não executa limpeza automaticamente.
          - Não altera o APK.
          - Não altera a implementação Android do PTT.
          - O módulo PTT continua apenas disponível para administração/diagnóstico.
          - A limpeza oficial continua exigindo login ADM + CSRF + confirmação textual.

          Instalação:
          1. Faça backup do banco e da pasta atual do servidor.
          2. Extraia este ZIP na raiz do servidor preservando as pastas.
          3. NÃO apague nem substitua config/config.php do servidor.
          4. Faça logout e login novamente como administrador.
          5. O login abrirá admin_central.php com todas as opções no menu lateral.
          EOF

          (cd "$OUT" && zip -r "$GITHUB_WORKSPACE/Estrada-Play-Comunista-SERVIDOR-2.3.9-ADMIN-TODAS-FUNCOES.zip" .)
          sha256sum Estrada-Play-Comunista-SERVIDOR-2.3.9-ADMIN-TODAS-FUNCOES.zip | tee /tmp/epc-v239-sha.txt

      - name: Publish complete administration package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-server-2.3.9-admin-todas-funcoes-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Estrada Play Comunista - Servidor 2.3.9 Admin Todas as Funções" \
            --notes "Pacote completo da administração do servidor. Expõe no menu todas as funções já existentes: usuários, Drive/músicas, dispositivos, Estrada Viva, relatos, base comunitária, trânsito/clima, combustível, radares, comboios, rádio PTT, base oficial/limpeza, servidor, housekeeping, auditoria e diagnósticos. Inclui todas as APIs/assets/importadores/cron necessários, sem config.php, banco, logs, mídia ou APK." \
            Estrada-Play-Comunista-SERVIDOR-2.3.9-ADMIN-TODAS-FUNCOES.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-SERVIDOR-2.3.9-ADMIN-TODAS-FUNCOES
          path: Estrada-Play-Comunista-SERVIDOR-2.3.9-ADMIN-TODAS-FUNCOES.zip
          retention-days: 7
