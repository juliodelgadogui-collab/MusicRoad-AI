name: Estrada Play Universal 2.3.3 Sessao Servidor Corrigida
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/ApiClient.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/SecureDeviceCredential.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/GateActivity.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/EstradaPlayApplication.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/UiVersionLabelFix.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/ProcessCrashGuard.java'
      - 'estrada-play-comunista-app/app/src/test/**'
      - 'estrada-play-comunista-app/app/build.gradle'
      - 'api/native_app.php'
      - 'api/native_auth.php'
      - 'tools/ci_build_epc_v233_auth_host_compat.sh'
      - '.github/workflows/build-estrada-play-comunista*.yml'
      - '.github/workflows/build-estrada-play-portable*.yml'
      - '.github/workflows/build-estrada-play-universal-v*.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v233-auth-host-compat
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Verify 2.3.3 direct-source auth compatibility
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          grep -q 'versionCode 233' "$APP/app/build.gradle"
          grep -q "versionName '2.3.3'" "$APP/app/build.gradle"
          grep -q 'SESSION_HOST_COMPAT_V233' "$J/ApiClient.java"
          grep -q 'c.setRequestProperty("Cookie", cookie.trim())' "$J/ApiClient.java"
          grep -q 'data.put("device_secret", credential.secret())' "$J/ApiClient.java"
          grep -q 'recoverDeviceSessionIfPossible' "$J/ApiClient.java"
          grep -q 'VERSION_VISIBLE_V233' "$J/UiVersionLabelFix.java"
          grep -q 'value.startsWith("EPC 2.")' "$J/UiVersionLabelFix.java"
          grep -q 'SESSION_PERSIST_V232' "$J/SecureDeviceCredential.java"
          grep -q 'COMBOIO_AVANCADO_V230' "$J/ConvoyActivity.java"
          grep -q 'BASE_CONSOLIDADA_V210' "$J/RoadSafetyService.java"

          legacy_workflows="$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'build-estrada-play-comunista*.yml' -o -name 'build-estrada-play-portable*.yml' -o -name 'build-estrada-play-universal-v*.yml' \) \
            ! -name 'build-estrada-play-universal-v233-auth-host-compat.yml' -print)"
          if [ -n "$legacy_workflows" ]; then
            echo 'Obsolete EPC Android workflow detected:'
            printf '%s\n' "$legacy_workflows"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Production signing readiness
        env:
          KEYSTORE_B64: ${{ secrets.ESTRADAPLAY_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo 'SIGNING_STATUS=production-ready' >> "$GITHUB_ENV"
          else
            echo 'SIGNING_STATUS=development-test' >> "$GITHUB_ENV"
          fi

      - name: Unit tests, build and validate 2.3.3
        run: bash tools/ci_build_epc_v233_auth_host_compat.sh

      - name: Publish 2.3.3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-2.3.3-sessao-servidor-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Estrada Play Comunista Universal 2.3.3 - Sessao Servidor Corrigida" \
            --notes "Hotfix de autenticação para hospedagem PHP compartilhada. Mantém Bearer/refresh da segurança 2.0.7+, mas envia também o cookie PHP same-origin sobre HTTPS porque Apache/FastCGI pode remover Authorization antes do PHP. Endpoints de login/device_login/refresh também recebem o segredo aleatório no corpo JSON como fallback aos cabeçalhos customizados. Em qualquer HTTP 401, o cliente tenta refresh e depois device_login silencioso antes de devolver erro. A versão visível usa BuildConfig.VERSION_NAME e corrige o antigo EPC 2.0. Sessão persistente 2.3.2, Comboio Avançado 2.3.0 e toda a base consolidada permanecem preservados. Sem WebView. Signing: ${SIGNING_STATUS}." \
            Estrada-Play-Comunista-Universal-2.3.3-Sessao-Servidor-Corrigida.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.3.3-Sessao-Servidor-Corrigida
          path: Estrada-Play-Comunista-Universal-2.3.3-Sessao-Servidor-Corrigida.apk
          retention-days: 3
          compression-level: 0
