name: Fix Copilot and Rain MM Once

on:
  push:
    branches:
      - agent/estrada-play-comunista

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0
      - name: Apply patch script
        run: python3 .github/patch_copilot_weather.py
      - name: Commit fixes
        run: |
          git config user.name "Estrada Play Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Copilot microphone and expose rain millimeters"
          git push origin HEAD:agent/estrada-play-comunista
