name: EstradaPlay Server Central 500 MB v4
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'api/road_collective.php'
      - 'admin_collective.php'
      - 'tools/patch_server_central_v4.py'
      - '.github/workflows/server-central-v4-release.yml'
  workflow_dispatch:
jobs:
  server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0
      - name: Integrate Server Central v4
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_server_central_v4.py
          python3 tools/patch_server_central_v4.py
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in api/bootstrap.php api/server_500mb.php api/server_intelligent.php api/native_auth.php api/native_library_sync.php api/native_app.php api/google_drive_public.php api/cron_drive_sync.php api/road_reports.php api/road_collective.php api/server_status.php api/radars.php api/radar_db.php api/road_pack.php api/road_corridor_pack.php api/road_state_pack.php api/offline_state.php api/road_safety_pack_helpers.php api/road_hazard_db.php admin.php admin_server.php admin_reports.php admin_collective.php; do php -l "$f"; done
      - name: Validate v4 architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SERVER_500MB_V4' api/server_500mb.php
          grep -q '500MB-v4' api/server_intelligent.php
          grep -q 'road_collective_events' api/road_collective.php
          grep -q 'radar_confirmation' api/road_collective.php
          grep -q 'road_surface' api/road_collective.php
          grep -q '180 DAY' api/server_500mb.php
          grep -q 'Inteligência Coletiva' admin_collective.php
          grep -q 'admin_collective.php' admin_server.php
          grep -q 'native_restore_user_from_request' api/offline_state.php
      - name: Commit integrated server source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/server_500mb.php api/server_intelligent.php admin_server.php
          git commit -m "Integrate Server Central 500 MB v4 collective intelligence [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Package server only
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/estradaplay-server-v4
          rm -rf "$OUT" && mkdir -p "$OUT/api"
          for f in bootstrap.php server_500mb.php server_intelligent.php native_auth.php native_library_sync.php native_app.php google_drive_public.php cron_drive_sync.php road_reports.php road_collective.php server_status.php radars.php radar_db.php road_pack.php road_corridor_pack.php road_state_pack.php offline_state.php road_safety_pack_helpers.php road_hazard_db.php; do cp "api/$f" "$OUT/api/$f"; done
          cp admin.php admin_server.php admin_reports.php admin_collective.php "$OUT/"
          cat > "$OUT/LEIA-PRIMEIRO.txt" <<'TXT'
          EstradaPlay - Central do Servidor 500 MB v4

          SOMENTE SERVIDOR. Nao contem APK, audio, video, mapas offline nem config.php.
          Extraia na RAIZ da instalacao atual e sobrescreva os arquivos incluidos.
          Nao apague config/config.php nem o banco existente.

          Novidades v4:
          - API de inteligencia coletiva da estrada
          - eventos leves de irregularidade/asfalto, sem upload de video
          - confirmacoes posteriores de radar
          - painel /admin_collective.php
          - retencao automatica de 180 dias para eventos coletivos
          - mantem reportes, pacotes offline RJ/MG/ES, Google Drive e Server Central v3
          TXT
          cd "$OUT" && zip -qr "$GITHUB_WORKSPACE/EstradaPlay-SERVIDOR-500MB-CENTRAL-v4.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -l EstradaPlay-SERVIDOR-500MB-CENTRAL-v4.zip | tee /tmp/server-files.txt
          if grep -Ei '\.(apk|mp3|wav|mp4|mkv|mbtiles|pmtiles)$|config\.php$' /tmp/server-files.txt; then echo 'Pacote contem arquivo proibido' >&2; exit 1; fi
          sha256sum EstradaPlay-SERVIDOR-500MB-CENTRAL-v4.zip | tee /tmp/server-sha.txt
      - name: Publish Server Central v4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estradaplay-server-central-v4-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "EstradaPlay - Central do Servidor 500 MB v4" --notes "Servidor para a Inteligência Coletiva 1.5.0. Continua metadata-only e adequado ao host de 500 MB. Recebe apenas pequenos eventos de via e confirmações de radar; nunca recebe vídeos da dashcam. Adiciona /admin_collective.php e retenção de 180 dias. Mantém reportes, música via Google Drive e pacotes offline RJ/MG/ES. Instale extraindo na raiz e sobrescrevendo os arquivos; config.php não é incluído." EstradaPlay-SERVIDOR-500MB-CENTRAL-v4.zip
      - name: Temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: EstradaPlay-SERVIDOR-500MB-CENTRAL-v4
          path: EstradaPlay-SERVIDOR-500MB-CENTRAL-v4.zip
          retention-days: 1
          compression-level: 0
