name: Temporary Full ZIP
on:
  push:
    branches:
      - "temp/package-full-20261008"
  pull_request:
    branches:
      - main
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: zip -r MusicRoad-AI-FULL-V4.zip . -x ".git/*"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MusicRoad-AI-FULL-V4
          path: MusicRoad-AI-FULL-V4.zip
