name: EPC Server 3.0 Web Alpha
permissions:
  contents: read
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'server-v3/**'
      - '.github/workflows/build-epc-server-v3-web-alpha.yml'
  workflow_dispatch:

concurrency:
  group: epc-server-v3-web-alpha
  cancel-in-progress: true

jobs:
  validate-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          find server-v3 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q 'EPC_SERVER_V3_ALPHA1' server-v3/bootstrap.php
          grep -q 'Versão web do aplicativo' server-v3/README.md
          grep -q "road_data_mode" server-v3/api/v8/radars.php

      - name: Validate web shell
        shell: bash
        run: |
          set -euo pipefail
          test -s server-v3/public/app/index.php
          test -s server-v3/public/assets/app.js
          test -s server-v3/public/assets/app.css
          test -s server-v3/public/manifest.webmanifest
          test -s server-v3/public/sw.js
          python3 -m json.tool server-v3/public/manifest.webmanifest >/dev/null

      - name: Package Server 3.0 alpha
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/epc-server-v3"
          mkdir -p "$OUT"
          cp -a server-v3 "$OUT/server-v3"
          cat > "$OUT/LEIA-ME.txt" <<'EOF'
          Estrada Play Server 3.0 - Web Alpha 1

          Extraia a pasta server-v3 na raiz do servidor atual.
          O servidor antigo permanece intacto nesta etapa.
          Acesse: https://SEU-DOMINIO/server-v3/

          Requisitos:
          - manter config/config.php e o banco atuais;
          - HTTPS para GPS no navegador;
          - não apagar a pasta api atual, pois Alpha 1 usa uma ponte de compatibilidade para leitura.

          Funções web: login, GPS, mapa, busca, rota, clima, radares oficiais, música e PWA.
          EOF
          (cd "$OUT" && zip -r "$GITHUB_WORKSPACE/Estrada-Play-Server-3.0-WEB-ALPHA1.zip" .)
          unzip -t Estrada-Play-Server-3.0-WEB-ALPHA1.zip
          sha256sum Estrada-Play-Server-3.0-WEB-ALPHA1.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Server-3.0-WEB-ALPHA1
          path: Estrada-Play-Server-3.0-WEB-ALPHA1.zip
          retention-days: 14
