name: EstradaPlay Admin EPC 1.0
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'admin_epc.php'
      - 'login.php'
      - 'api/admin_epc_snapshot.php'
      - 'assets/css/admin-epc.css'
      - 'assets/js/admin-epc.js'
      - 'docs/PAINEL-ADMIN-EPC-1.0.md'
      - '.github/workflows/build-admin-epc-v1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Validate EPC admin panel
        shell: bash
        run: |
          set -euo pipefail
          php -l admin_epc.php
          php -l login.php
          php -l api/admin_epc_snapshot.php
          grep -q 'require_admin' admin_epc.php
          grep -q 'require_csrf' admin_epc.php
          grep -q 'admin_epc.php' login.php
          grep -q 'road_live_events' admin_epc.php
          grep -q 'road_traffic_samples' admin_epc.php
          grep -q 'fuel_price_reports' admin_epc.php
          grep -q 'estrada_convoys' admin_epc.php
          grep -q 'audit_logs' admin_epc.php
          grep -q 'Mesmo banco de dados' docs/PAINEL-ADMIN-EPC-1.0.md
          test -s assets/css/admin-epc.css
          test -s assets/js/admin-epc.js

      - name: Build safe server package with EPC panel
        shell: bash
        run: |
          set -euo pipefail
          DEST=/tmp/estradaplay-admin-epc-v1
          rm -rf "$DEST" && mkdir -p "$DEST"
          find . -maxdepth 1 -type f \( -name '*.php' -o -name '.htaccess' \) -print0 | xargs -0 -I{} cp '{}' "$DEST/"
          for D in api assets database config docs; do cp -a "$D" "$DEST/$D"; done
          rm -f "$DEST/config/config.php"
          mkdir -p "$DEST/storage/db" "$DEST/storage/cache" "$DEST/logs"
          printf 'Deny from all\n' > "$DEST/storage/.htaccess"
          printf 'Deny from all\n' > "$DEST/logs/.htaccess"
          cat > "$DEST/LEIA-PRIMEIRO-PAINEL-EPC.txt" <<'TXT'
          ESTRADA PLAY COMUNISTA - PAINEL ADMINISTRATIVO EPC 1.0

          Este pacote usa o MESMO banco de dados da instalação atual.

          ATUALIZAÇÃO:
          1. Faça backup de config/config.php e do banco por precaução.
          2. Extraia o ZIP por cima do servidor atual.
          3. config/config.php e o banco NÃO estão dentro do ZIP e não serão substituídos.
          4. Entre normalmente em /login.php. Usuários com perfil admin são enviados para /admin_epc.php.
          5. O painel legado /admin.php continua disponível.

          O painel administra usuários, aparelhos, Estrada Viva, moderação, trânsito colaborativo,
          clima, combustível, radares, comboios, saúde do servidor e auditoria usando as tabelas existentes.

          O pacote não contém credenciais, banco, áudio, vídeo, APK nem cache.
          TXT
          while IFS= read -r -d '' F; do php -l "$F" >/dev/null; done < <(find "$DEST" -type f -name '*.php' -print0)
          test -f "$DEST/admin_epc.php"
          test -f "$DEST/api/admin_epc_snapshot.php"
          test -f "$DEST/assets/css/admin-epc.css"
          test -f "$DEST/assets/js/admin-epc.js"
          test ! -f "$DEST/config/config.php"
          ! find "$DEST" -type f | grep -E '\.(apk|mp3|wav|mp4|m4a|ogg|sqlite|db|zip)$'
          OUT="$GITHUB_WORKSPACE/EstradaPlay-SERVIDOR-v7.0-PAINEL-EPC-1.0.zip"
          (cd "$DEST" && zip -qr "$OUT" .)
          unzip -l "$OUT" | tee /tmp/epc-admin-list.txt
          ! grep -Eq 'config/config\.php|\.(apk|mp3|wav|mp4|m4a|ogg|sqlite|db)$' /tmp/epc-admin-list.txt
          sha256sum "$OUT" | tee /tmp/epc-admin-sha.txt

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: EstradaPlay-SERVIDOR-v7.0-PAINEL-EPC-1.0
          path: EstradaPlay-SERVIDOR-v7.0-PAINEL-EPC-1.0.zip
          retention-days: 7

      - name: Publish EPC admin panel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estradaplay-server-v7.0-admin-epc-1.0-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$(git rev-parse HEAD)" \
            --title "EstradaPlay Server 7.0 + Painel Administrativo EPC 1.0" \
            --notes "Painel administrativo nativo do servidor Estrada Play Comunista usando o mesmo banco da instalação existente. Dashboard, usuários, aparelhos, Estrada Viva, moderação, trânsito, clima, combustível, radares, comboios, servidor e auditoria. Pacote sem config.php, banco, mídia ou APK." \
            EstradaPlay-SERVIDOR-v7.0-PAINEL-EPC-1.0.zip
