name: One-shot 5.1.1 stability maintenance

on:
  push:
    branches:
      - agent/estrada-play-comunista
    paths:
      - .github/workflows/maintenance-511-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0
      - name: Apply 5.1.1 lifecycle hardening
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          echo "$PATCH_B64" | base64 -d | python3
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            estrada-play-comunista-app/app/build.gradle \
            estrada-play-comunista-app/app/src/main/AndroidManifest.xml \
            estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/PlayerService.java \
            estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java
          git commit -m 'fix: harden 5.1.1 road and player lifecycle'
          git push origin HEAD:agent/estrada-play-comunista
