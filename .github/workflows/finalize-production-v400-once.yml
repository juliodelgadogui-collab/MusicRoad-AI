name: Finalize Estrada Play 4.0 Production Once

on:
  push:
    branches:
      - agent/estrada-play-comunista
    paths:
      - '.github/workflows/finalize-production-v400-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Apply final production polish
        run: |
          python3 scripts/production_v401_polish.py
          python3 scripts/production_v402_map.py
          python3 scripts/production_v403_radio_national.py
          python3 scripts/production_v404_experience.py

      - name: Remove temporary scripts and commit
        run: |
          rm -f scripts/production_v401_polish.py scripts/production_v402_map.py scripts/production_v403_radio_national.py scripts/production_v404_experience.py
          rm -f .github/workflows/finalize-production-v400-once.yml
          git config user.name 'Estrada Play Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'release: finalize Estrada Play 4.0 production cockpit and services'
          git push origin HEAD:agent/estrada-play-comunista

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create candidate signing key
        run: |
          mkdir -p estrada-play-comunista-app/signing
          rm -f estrada-play-comunista-app/signing/estradaplay-dev.keystore
          keytool -genkeypair -v \
            -keystore estrada-play-comunista-app/signing/estradaplay-dev.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Estrada Play 4.0 Final Candidate,O=Estrada Play,C=BR'

      - name: PHP syntax and production scripts gate
        run: |
          find api server -name '*.php' -print0 | xargs -0 -n1 php -l
          bash -n server/install_coturn.sh
          bash -n server/install_osrm_brazil.sh
          bash -n server/install_tileserver.sh

      - name: Unit tests and strict lint
        working-directory: estrada-play-comunista-app
        run: |
          gradle --no-daemon --stacktrace testUniversalDebugUnitTest
          gradle --no-daemon --stacktrace lintUniversalDebug

      - name: Compile all candidates and instrumentation APK
        working-directory: estrada-play-comunista-app
        run: |
          gradle --no-daemon --stacktrace assembleUniversalCandidate assembleVerticalCandidate assembleHorizontalCandidate assembleUniversalDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Device smoke tests API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd estrada-play-comunista-app && gradle --no-daemon connectedUniversalDebugAndroidTest

      - name: Build server package
        run: |
          rm -rf dist && mkdir -p dist/Estrada-Play-Comunista-Servidor-4.0
          for p in api database importers server config install.php; do
            if [ -e "$p" ]; then cp -R "$p" dist/Estrada-Play-Comunista-Servidor-4.0/; fi
          done
          (cd dist && zip -qr Estrada-Play-Comunista-Servidor-4.0.zip Estrada-Play-Comunista-Servidor-4.0)

      - name: Upload APK candidates
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-4.0-FINAL-CANDIDATOS
          path: |
            estrada-play-comunista-app/app/build/outputs/apk/universal/candidate/*.apk
            estrada-play-comunista-app/app/build/outputs/apk/vertical/candidate/*.apk
            estrada-play-comunista-app/app/build/outputs/apk/horizontal/candidate/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-Servidor-4.0-FINAL
          path: dist/Estrada-Play-Comunista-Servidor-4.0.zip
          if-no-files-found: error
          retention-days: 7
