name: Estrada Play Comunista 1.5.0 Collective Intelligence
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_comunista_collective_core_v150.py'
      - 'tools/patch_estrada_play_comunista_collective_ui_v150.py'
      - 'tools/fix_estrada_play_comunista_v150_runtime.py'
      - 'api/road_collective.php'
      - '.github/workflows/build-estrada-play-comunista-v150.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0
      - name: Generate 1.5.0 collective editions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_estrada_play_comunista_collective_core_v150.py tools/patch_estrada_play_comunista_collective_ui_v150.py tools/fix_estrada_play_comunista_v150_runtime.py
          python3 tools/patch_estrada_play_comunista_collective_core_v150.py
          python3 tools/patch_estrada_play_comunista_collective_ui_v150.py
          python3 tools/fix_estrada_play_comunista_v150_runtime.py
      - name: Verify 1.5.0 architecture
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          M=estrada-play-comunista-app/app/src/main/AndroidManifest.xml
          grep -q "versionName '1.5.0'" "$G"
          grep -q 'versionCode 150' "$G"
          grep -q 'class RoadSurfaceMonitor' "$J/RoadSurfaceMonitor.java"
          grep -q 'class CollectiveRoadStore' "$J/CollectiveRoadStore.java"
          grep -q 'road_surface_event' "$J/RoadSafetyService.java"
          grep -q 'upcoming_text' "$J/RoadSafetyService.java"
          grep -q 'Pausa sugerida' "$J/RoadSafetyService.java"
          grep -q 'stateHazardCount' "$J/RoadPackStore.java"
          grep -q 'road_quality_score' "$J/TripRecorder.java"
          grep -q 'OfflineCenterActivity' "$M"
          grep -q 'CollectiveRoadActivity' "$M"
          grep -q 'VehicleCostActivity' "$M"
          grep -q 'RoadThoughts' "$J/RoadSafetyService.java"
          grep -q 'prefetchCoreStates' "$J/RoadPackStore.java"
          grep -q 'beginVoiceDucking' "$J/RoadSafetyService.java"
          grep -q 'CREATE TABLE IF NOT EXISTS road_collective_events' api/road_collective.php
          php -l api/road_collective.php
          grep -q "versionName '2.0.11'" estradaplay-app-v2/app/build.gradle
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi
      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app
          git commit -m "Generate Comunista 1.5.0 collective road intelligence [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore
      - name: Generate embedded safety voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          test "$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 71
      - name: Build both APKs
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleVerticalDebug assembleHorizontalDebug
      - name: Verify APK identities and signatures
        shell: bash
        run: |
          set -euo pipefail
          V=estrada-play-comunista-app/app/build/outputs/apk/vertical/debug/app-vertical-debug.apk
          H=estrada-play-comunista-app/app/build/outputs/apk/horizontal/debug/app-horizontal-debug.apk
          test -f "$V" && test -f "$H"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$V" | tee /tmp/v.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$H" | tee /tmp/h.txt
          grep -q "package: name='com.estradaplay.comunista.vertical' versionCode='150' versionName='1.5.0'" /tmp/v.txt
          grep -q "package: name='com.estradaplay.comunista.horizontal' versionCode='150' versionName='1.5.0'" /tmp/h.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$V" >/tmp/v-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$H" >/tmp/h-cert.txt
          cp "$V" Estrada-Play-Comunista-Vertical-1.5.0.apk
          cp "$H" Estrada-Play-Comunista-Horizontal-1.5.0.apk
          sha256sum Estrada-Play-Comunista-Vertical-1.5.0.apk Estrada-Play-Comunista-Horizontal-1.5.0.apk | tee /tmp/sha.txt
      - name: Publish 1.5.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.5.0-collective-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Estrada Play Comunista 1.5.0 - Inteligência Coletiva" --notes "Nova camada de inteligência coletiva da estrada. Detecta irregularidades por sensores do telefone somente em movimento, registra qualidade estimada da via e linha do tempo local, preserva o trecho da dashcam em impacto quando a câmera estiver aberta, mantém fila offline de eventos pequenos sem vídeo, adiciona confirmação posterior de radares, Central Offline RJ/MG/ES, faixa O que vem pela frente, lembrete discreto de pausa após cerca de 2h em movimento e perfil de consumo/preço para estimativa de combustível. Mantém Pensamentos da Estrada 1.4.2, voz offline prioritária, radares offline, câmera opcional, HUD e versões Vertical/Horizontal independentes. Sem WebView." Estrada-Play-Comunista-Vertical-1.5.0.apk Estrada-Play-Comunista-Horizontal-1.5.0.apk
      - name: Temporary artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-1.5.0
          path: |
            Estrada-Play-Comunista-Vertical-1.5.0.apk
            Estrada-Play-Comunista-Horizontal-1.5.0.apk
          retention-days: 1
          compression-level: 0
