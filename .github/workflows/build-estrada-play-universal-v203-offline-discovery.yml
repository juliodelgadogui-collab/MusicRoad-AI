name: Estrada Play Universal 2.0.3 Recuperacao Offline
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_v203_offline_discovery.py'
      - 'tools/ci_build_epc_v203_offline_discovery.sh'
      - '.github/workflows/build-estrada-play-universal-v203-offline-discovery.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v203-offline-discovery
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Generate 2.0.3 offline discovery source
        run: |
          python3 -m py_compile tools/patch_estrada_play_v203_offline_discovery.py
          python3 tools/patch_estrada_play_v203_offline_discovery.py

      - name: Verify 2.0.3 repair architecture
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          grep -q 'versionCode 203' "$APP/app/build.gradle"
          grep -q "versionName '2.0.3'" "$APP/app/build.gradle"
          grep -q 'OFFLINE_DISCOVERY_V203' "$J/LibraryStore.java"
          grep -q 'getNoBackupFilesDir' "$J/LibraryStore.java"
          grep -q 'syntheticLocalTrack' "$J/LibraryStore.java"
          grep -q 'PUBLIC_DISCOVERY_V203' "$J/MusicStorageActivity.java"
          grep -q 'LIBRARY_REPAIR_ENTRY_V203' "$J/MainActivity.java"
          grep -q 'PROCURAR / LIMPAR MÚSICAS DO CELULAR' "$J/MainActivity.java"
          grep -q 'PROCURAR MÚSICAS NO CELULAR' "$J/MusicPlayerActivity.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Persist generated 2.0.3 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app/app/build.gradle \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/LibraryStore.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MusicStorageActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MusicPlayerActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MainActivity.java
          git commit -m "Generate Universal 2.0.3 Recuperacao Offline [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and validate APK
        run: bash tools/ci_build_epc_v203_offline_discovery.sh

      - name: Publish 2.0.3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-2.0.3-recuperacao-offline-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "Estrada Play Comunista Universal 2.0.3 - Recuperação Offline" \
            --notes "Corrige o caso em que arquivos de música continuam fisicamente no aparelho, mas aparecem como 0 offline. A biblioteca agora varre recursivamente todos os espaços antigos do próprio EPC, relaciona arquivos por ID, título e pasta e mantém faixas locais mesmo quando o catálogo mudou. A busca de versões antigas via MediaStore passa a comparar o arquivo com o catálogo, sem exigir que a pasta se chame EstradaPlay. O Gerenciar downloads ganha acesso direto a Procurar/Limpar músicas. Novos downloads passam para armazenamento interno privado sem backup, removido junto com a desinstalação. Mantém Central Automotiva, voz completa e sem WebView." \
            Estrada-Play-Comunista-Universal-2.0.3-Recuperacao-Offline.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.0.3-Recuperacao-Offline
          path: Estrada-Play-Comunista-Universal-2.0.3-Recuperacao-Offline.apk
          retention-days: 3
          compression-level: 0
