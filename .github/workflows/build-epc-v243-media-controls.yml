name: EPC Android 2.4.3 Controles de Mídia

on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'estrada-play-comunista-app/app/build.gradle'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/PlayerService.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MusicPlayerActivity.java'
      - '.github/workflows/build-epc-v243-media-controls.yml'
  workflow_dispatch:

concurrency:
  group: epc-android-v243-media-controls
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Validate 2.4.3 native media controls
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          G="$APP/app/build.gradle"
          grep -q "versionCode 253" "$G"
          grep -q "versionName '2.4.3'" "$G"
          grep -q 'EPC_243_MEDIA_CONTROLS' "$G"
          grep -q 'PLAYER_MEDIA_SESSION_V243' "$J/PlayerService.java"
          grep -q 'new MediaSession' "$J/PlayerService.java"
          grep -q 'PlaybackState.ACTION_PLAY_PAUSE' "$J/PlayerService.java"
          grep -q 'Notification.MediaStyle' "$J/PlayerService.java"
          grep -q 'setShowActionsInCompactView(0, 1, 2)' "$J/PlayerService.java"
          grep -q 'OnAudioFocusChangeListener' "$J/PlayerService.java"
          grep -q 'AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK' "$J/PlayerService.java"
          grep -q 'ACTION_SKIP_TO_NEXT' "$J/PlayerService.java"
          grep -q 'PLAYER_SESSION_V242' "$J/PlayerService.java"
          grep -q 'PLAYER_LOCAL_INDEX_V2315' "$J/PlayerService.java"
          grep -q 'MUSIC_COMPACT_PLAYER_V2318' "$J/MusicPlayerActivity.java"
          grep -q 'MUSIC_DOWNLOAD_ENTRY_V240' "$J/MusicPlayerActivity.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$APP/app/src/main/java"; then echo 'WebView detected'; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare development signing key
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          base64 -d "$APP/signing/estradaplay-dev.keystore.b64" > "$APP/signing/estradaplay-dev.keystore"

      - name: Generate embedded Portuguese voice bank
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-v243-voice && mkdir -p /tmp/epc-v243-voice
          tar -xjf "$MODEL" -C /tmp/epc-v243-voice
          python3 "$APP/tools/generate_voice_bank.py" --model-root /tmp/epc-v243-voice --output "$APP/app/src/main/res/raw" --metadata-output "$APP/app/src/main/assets/estradaplay_voice"
          test "$(find "$APP/app/src/main/res/raw" -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 77

      - name: Unit tests and build universal plus horizontal APKs
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          (cd "$APP" && gradle --no-daemon testUniversalDebugUnitTest testHorizontalDebugUnitTest assembleUniversalDebug assembleHorizontalDebug)
          U="$APP/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          H="$APP/app/build/outputs/apk/horizontal/debug/app-horizontal-debug.apk"
          test -f "$U" && test -f "$H"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$U" | tee /tmp/u.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='253' versionName='2.4.3'" /tmp/u.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$H" | tee /tmp/h.txt
          grep -q "package: name='com.estradaplay.comunista.horizontal' versionCode='253' versionName='2.4.3'" /tmp/h.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$U"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$H"
          cp "$U" Estrada-Play-Comunista-Universal-2.4.3.apk
          cp "$H" Estrada-Play-Comunista-Horizontal-2.4.3.apk
          sha256sum Estrada-Play-Comunista-Universal-2.4.3.apk Estrada-Play-Comunista-Horizontal-2.4.3.apk
          git diff --exit-code

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.4.3-Controles-Midia
          path: |
            Estrada-Play-Comunista-Universal-2.4.3.apk
            Estrada-Play-Comunista-Horizontal-2.4.3.apk
          retention-days: 7
          compression-level: 0
