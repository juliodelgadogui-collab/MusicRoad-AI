name: Estrada Play Universal 2.0.7 Seguranca e Estabilidade
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'estrada-play-comunista-app/app/build.gradle'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/ApiClient.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/SecureDeviceCredential.java'
      - 'api/native_auth.php'
      - 'api/native_app.php'
      - 'admin_devices.php'
      - 'tools/ci_build_epc_v207_security.sh'
      - '.github/workflows/build-estrada-play-universal-v207-security.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v207-security
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Verify source scope
        shell: bash
        run: |
          set -euo pipefail
          test -f estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/SecureDeviceCredential.java
          grep -q 'versionCode 207' estrada-play-comunista-app/app/build.gradle
          grep -q "versionName '2.0.7'" estrada-play-comunista-app/app/build.gradle
          grep -q 'native_device_credentials' api/native_auth.php
          grep -q 'native_revoke_device' admin_devices.php
          if grep -R -q 'android.webkit.WebView\|new WebView' estrada-play-comunista-app/app/src/main/java; then exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Production signing readiness
        env:
          KEYSTORE_B64: ${{ secrets.ESTRADAPLAY_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo 'SIGNING_STATUS=production-ready' >> "$GITHUB_ENV"
          else
            echo 'SIGNING_STATUS=development-test' >> "$GITHUB_ENV"
            echo 'Production signing secrets are not configured; CI will publish the validated development-signed APK.'
          fi

      - name: Build, lint and package 2.0.7
        run: bash tools/ci_build_epc_v207_security.sh

      - name: Publish 2.0.7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          TAG="estrada-play-comunista-2.0.7-seguranca-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "Estrada Play Comunista Universal 2.0.7 - Segurança e Estabilidade" \
            --notes "Consolidação de segurança: ID do aparelho deixa de autenticar sozinho; segredo aleatório protegido por Android Keystore; access token de 30 minutos; refresh rotativo de 30 dias; credenciais nunca são enviadas a URLs externas; migração segura de sessões 2.0.6; painel admin_devices.php para revogar aparelhos; assinatura comercial preparada por secrets sem substituir o signer de testes quando não configurado. Biblioteca, proteção offline, mapa, rádio, Estrada Viva e comboio preservados. Sem WebView. Signing deste artefato: ${SIGNING_STATUS}." \
            Estrada-Play-Comunista-Universal-2.0.7-Seguranca-Estabilidade.apk \
            Estrada-Play-Comunista-2.0.7-SERVIDOR-SEGURANCA.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.0.7-Seguranca-Estabilidade
          path: |
            Estrada-Play-Comunista-Universal-2.0.7-Seguranca-Estabilidade.apk
            Estrada-Play-Comunista-2.0.7-SERVIDOR-SEGURANCA.zip
          retention-days: 3
          compression-level: 0
