name: EstradaPlay Server 7.0.1 Auth Persistente
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'api/native_auth.php'
      - 'api/native_auth_diagnostic.php'
      - 'admin_auth_diagnostics.php'
      - 'docs/SERVER-7.0.1-AUTH-PERSISTENTE.md'
      - '.github/workflows/build-epc-server-auth-persist-v701.yml'
  workflow_dispatch:

concurrency:
  group: epc-server-auth-persist-v701
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Validate PHP and auth hardening
        shell: bash
        run: |
          set -euo pipefail
          php -l api/bootstrap.php
          php -l api/native_auth.php
          php -l api/native_app.php
          php -l api/native_auth_diagnostic.php
          php -l admin_auth_diagnostics.php
          grep -q 'SERVER_AUTH_PERSIST_V235' api/native_auth.php
          grep -q 'native_auth_persist_setting_once' api/native_auth.php
          grep -q 'native-auth-salt-v207.php' api/native_auth.php
          grep -q 'SERVER_AUTH_DIAG_V235' api/native_auth_diagnostic.php
          grep -q 'secret_matches' api/native_auth_diagnostic.php
          grep -q 'target_fingerprint' api/native_auth_diagnostic.php
          ! grep -q "'access_token' =>" api/native_auth_diagnostic.php
          ! grep -q "'refresh_token' =>" api/native_auth_diagnostic.php

      - name: Stress salt create-once with SQLite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/epc-auth-ci
          mkdir -p /tmp/epc-auth-ci
          cp -a api database /tmp/epc-auth-ci/
          mkdir -p /tmp/epc-auth-ci/config /tmp/epc-auth-ci/data /tmp/epc-auth-ci/logs
          cat > /tmp/epc-auth-ci/config/config.php <<'PHP'
          <?php
          return [
            'env' => 'production',
            'db' => [
              'driver' => 'sqlite',
              'sqlite_path' => __DIR__ . '/../data/auth-ci.sqlite',
            ],
            'security' => ['session_name' => 'EPCAUTHCI'],
            'google' => ['api_key' => ''],
          ];
          PHP
          cat > /tmp/epc-auth-ci/read-salt.php <<'PHP'
          <?php
          require __DIR__ . '/api/native_auth.php';
          echo native_auth_salt(), "\n";
          PHP
          cd /tmp/epc-auth-ci
          seq 1 20 | xargs -P 10 -I{} php read-salt.php > salts.txt
          test "$(sort -u salts.txt | wc -l)" -eq 1
          SALT="$(head -n1 salts.txt)"
          test "${#SALT}" -eq 64
          test -f config/native-auth-salt-v207.php
          php -r '$c=require "config/config.php";$p=new PDO("sqlite:".$c["db"]["sqlite_path"]);$v=$p->query("SELECT value FROM app_settings WHERE key=\"native_auth_salt_v207\"")->fetchColumn(); if(!is_string($v)||strlen($v)!==64) exit(2); echo $v,PHP_EOL;' > db-salt.txt
          test "$(cat db-salt.txt)" = "$SALT"
          php read-salt.php > second.txt
          test "$(cat second.txt)" = "$SALT"

      - name: Build incremental server package
        shell: bash
        run: |
          set -euo pipefail
          DEST=/tmp/epc-server-auth-701
          OUT="$GITHUB_WORKSPACE/EstradaPlay-SERVIDOR-7.0.1-AUTH-PERSISTENTE.zip"
          rm -rf "$DEST" "$OUT"
          mkdir -p "$DEST/api" "$DEST/docs"
          cp api/native_auth.php api/native_auth_diagnostic.php "$DEST/api/"
          cp admin_auth_diagnostics.php "$DEST/"
          cp docs/SERVER-7.0.1-AUTH-PERSISTENTE.md "$DEST/docs/"
          cat > "$DEST/LEIA-PRIMEIRO.txt" <<'TXT'
          ESTRADA PLAY SERVER 7.0.1 - AUTENTICACAO PERSISTENTE

          PACOTE INCREMENTAL. NAO CONTEM BANCO NEM config/config.php.

          1. Faca backup do servidor e do banco.
          2. Extraia este ZIP por cima da raiz atual do Estrada Play.
          3. Mantenha o config/config.php existente.
          4. Abra o APK 2.3.4 e faca login uma vez.
          5. Feche completamente o app e abra novamente.
          6. Se ainda pedir senha, entre como admin e abra /admin_auth_diagnostics.php.

          A correcao estabiliza native_auth_salt_v207 no banco e em fallback PHP seguro.
          O diagnostico nao exibe senha, segredo bruto, access token, refresh token ou hashes completos.
          TXT
          while IFS= read -r -d '' F; do php -l "$F" >/dev/null; done < <(find "$DEST" -type f -name '*.php' -print0)
          test ! -e "$DEST/config/config.php"
          ! find "$DEST" -type f | grep -E '\.(apk|mp3|wav|mp4|m4a|ogg|sqlite|db)$'
          (cd "$DEST" && zip -qr "$OUT" .)
          unzip -l "$OUT" | tee /tmp/epc-server-auth-701-list.txt
          ! grep -Eq 'config/config\.php|\.(apk|mp3|wav|mp4|m4a|ogg|sqlite|db)$' /tmp/epc-server-auth-701-list.txt
          sha256sum "$OUT" | tee /tmp/epc-server-auth-701-sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EstradaPlay-SERVIDOR-7.0.1-AUTH-PERSISTENTE
          path: EstradaPlay-SERVIDOR-7.0.1-AUTH-PERSISTENTE.zip
          retention-days: 7
          compression-level: 0

      - name: Publish Server 7.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estradaplay-server-v7.0.1-auth-persistente-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "EstradaPlay Server 7.0.1 - Autenticacao Persistente" \
            --notes "Hotfix incremental para o caso em que o APK funciona apos login mas volta a pedir usuario/senha ao reabrir. native_auth_salt_v207 agora tem criacao atomica create-once, releitura canonica e fallback seguro em config/native-auth-salt-v207.php. Inclui endpoint sanitizado api/native_auth_diagnostic.php e preserva o painel administrativo de diagnostico. CI executa stress concorrente com SQLite para confirmar que 20 processos recebem exatamente o mesmo salt. Nao inclui config.php, banco, midia ou APK e nao faz deploy automatico." \
            EstradaPlay-SERVIDOR-7.0.1-AUTH-PERSISTENTE.zip
