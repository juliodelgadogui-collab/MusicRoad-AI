name: Estrada Play Universal 1.7.3 Route + Local Radio
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_route_radio_v173.py'
      - '.github/workflows/build-estrada-play-universal-v173-route-radio.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Apply route and radio fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_estrada_play_route_radio_v173.py
          python3 tools/patch_estrada_play_route_radio_v173.py

      - name: Verify 1.7.3 logic
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          grep -q "versionName '1.7.3'" "$G"
          grep -q 'versionCode 173' "$G"
          grep -q 'alternatives=true' "$J/RouteEngine.java"
          grep -q 'chooseRoute' "$J/RouteEngine.java"
          grep -q 'Rota incoerente' "$J/RouteEngine.java"
          grep -q 'BR-101' "$J/KnownRoadCatalog.java"
          grep -q 'CAMPOS_RJ' "$J/KnownRoadCatalog.java"
          grep -q 'VITORIA_ES' "$J/KnownRoadCatalog.java"
          grep -q 'road.replace("-","")+"|"+segment' "$J/RoadIdentityResolver.java"
          ! grep -q 'dirKey' "$J/RoadIdentityResolver.java"
          grep -q 'ACTION_SET_ROAD' "$J/RoadRadioService.java"
          grep -q 'KnownRoadCatalog.fromKnownRoad' "$J/RoadRadioService.java" && exit 1 || true
          grep -q 'RoadIdentityResolver.fromKnownRoad' "$J/RoadRadioService.java"
          grep -q 'ESCOLHER RODOVIA' "$J/RoadRadioActivity.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app
          git commit -m "Generate Universal 1.7.3 route and local radio [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore

      - name: Generate embedded safety voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          test "$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 77

      - name: Build Universal APK
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleUniversalDebug

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          A=estrada-play-comunista-app/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$A"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$A" | tee /tmp/v173.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='173' versionName='1.7.3'" /tmp/v173.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$A" >/tmp/v173-cert.txt
          cp "$A" Estrada-Play-Comunista-Universal-1.7.3-Rota-Radio-Local.apk
          sha256sum Estrada-Play-Comunista-Universal-1.7.3-Rota-Radio-Local.apk | tee /tmp/v173-sha.txt

      - name: Publish Universal 1.7.3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.7.3-route-radio-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Estrada Play Comunista Universal 1.7.3 - Rota e Rádio Local" --notes "Correção focada em dois problemas observados na 1.7.2. Rota: passa a pedir alternativas ao OSRM, valida encaixe de origem/destino, escolhe a alternativa mais coerente e deixa de desenhar detours absurdos em destinos próximos. Rádio: sala passa a ser rodovia + trecho geográfico local; direção/UF não unem motoristas distantes. BR-101 em Campos e BR-101 em Vitória ficam em salas diferentes. Inclui catálogo local de rodovias para seleção de apoio quando a identificação automática falhar; o GPS continua definindo o trecho. Mantém Universal vertical/horizontal, interface 1.7.2, player, radar, offline, voz, servidor atual e sem WebView." Estrada-Play-Comunista-Universal-1.7.3-Rota-Radio-Local.apk

      - name: Temporary artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Universal-1.7.3-Route-Radio
          path: Estrada-Play-Comunista-Universal-1.7.3-Rota-Radio-Local.apk
          retention-days: 1
          compression-level: 0
