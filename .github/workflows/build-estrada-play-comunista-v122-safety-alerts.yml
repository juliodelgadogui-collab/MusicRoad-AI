name: Estrada Play Comunista 1.2.2 Safety Alerts

permissions:
  contents: write

on:
  push:
    branches:
      - agent/estrada-play-comunista
    paths:
      - 'tools/create_estrada_play_comunista.py'
      - 'tools/fix_estrada_play_comunista_generated.py'
      - 'tools/patch_estrada_play_comunista_design_v110.py'
      - 'tools/fix_estrada_play_comunista_splash_v110.py'
      - 'tools/patch_estrada_play_comunista_design_v120.py'
      - 'tools/patch_estrada_play_comunista_orientation_split_v121.py'
      - 'tools/patch_estrada_play_comunista_safety_overlay_v122.py'
      - '.github/workflows/build-estrada-play-comunista-v122-safety-alerts.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Generate fixed editions with safety overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/create_estrada_play_comunista.py
          python3 tools/fix_estrada_play_comunista_generated.py
          python3 tools/patch_estrada_play_comunista_design_v110.py
          python3 tools/fix_estrada_play_comunista_splash_v110.py
          python3 tools/patch_estrada_play_comunista_design_v120.py
          python3 tools/patch_estrada_play_comunista_orientation_split_v121.py
          python3 tools/patch_estrada_play_comunista_safety_overlay_v122.py

      - name: Verify safety architecture
        shell: bash
        run: |
          set -euo pipefail
          GRADLE=estrada-play-comunista-app/app/build.gradle
          MANIFEST=estrada-play-comunista-app/app/src/main/AndroidManifest.xml
          JAVA=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          grep -q "versionName '1.2.2'" "$GRADLE"
          grep -q "applicationIdSuffix '.vertical'" "$GRADLE"
          grep -q "applicationIdSuffix '.horizontal'" "$GRADLE"
          grep -q "appOrientation: 'sensorPortrait'" "$GRADLE"
          grep -q "appOrientation: 'sensorLandscape'" "$GRADLE"
          grep -q 'android:resizeableActivity="false"' "$MANIFEST"
          grep -q 'class SafetyAlertOverlay' "$JAVA/SafetyAlertOverlay.java"
          grep -q 'LIMITE DO RADAR' "$JAVA/SafetyAlertOverlay.java"
          grep -q 'QUEBRA-MOLAS À FRENTE' "$JAVA/SafetyAlertOverlay.java"
          grep -q 'CÂMERA À FRENTE' "$JAVA/SafetyAlertOverlay.java"
          grep -q 'CAMERA_MONITORAMENTO' "$JAVA/RoadHazard.java"
          grep -q 'fetchOpenStreetMapTrafficCameras' "$JAVA/RoadPackStore.java"
          grep -q 'surveillance:zone' "$JAVA/RoadPackStore.java"
          grep -q 'if (!shouldAlert(h)) continue' "$JAVA/RoadSafetyService.java"
          grep -q 'SafetyAlertOverlay.show(MainActivity.this' "$JAVA/MainActivity.java"
          grep -q 'SafetyAlertOverlay.show(RoadMapActivity.this' "$JAVA/RoadMapActivity.java"
          grep -q 'SafetyAlertOverlay.show(AutomotiveActivity.this' "$JAVA/AutomotiveActivity.java"
          grep -q 'ep_camera_monitoramento' estrada-play-comunista-app/tools/generate_voice_bank.py
          grep -q "versionName '2.0.11'" estradaplay-app-v2/app/build.gradle
          if grep -R -q 'android.webkit.WebView\|new WebView' estrada-play-comunista-app/app/src/main/java; then exit 1; fi

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app
          git commit -m "Create Comunista 1.2.2 central safety alerts [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signer
        shell: bash
        run: |
          set -euo pipefail
          base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore

      - name: Generate embedded safety voice fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice
          mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          test "$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 71
          test -f estrada-play-comunista-app/app/src/main/res/raw/ep_camera_monitoramento.wav

      - name: Build both APKs
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleVerticalDebug assembleHorizontalDebug

      - name: Verify APK identities and signatures
        shell: bash
        run: |
          set -euo pipefail
          V=estrada-play-comunista-app/app/build/outputs/apk/vertical/debug/app-vertical-debug.apk
          H=estrada-play-comunista-app/app/build/outputs/apk/horizontal/debug/app-horizontal-debug.apk
          test -f "$V"
          test -f "$H"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$V" | tee /tmp/vertical.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$H" | tee /tmp/horizontal.txt
          grep -q "package: name='com.estradaplay.comunista.vertical' versionCode='122' versionName='1.2.2'" /tmp/vertical.txt
          grep -q "package: name='com.estradaplay.comunista.horizontal' versionCode='122' versionName='1.2.2'" /tmp/horizontal.txt
          grep -q "application-label:'Estrada Play Comunista Vertical'" /tmp/vertical.txt
          grep -q "application-label:'Estrada Play Comunista Horizontal'" /tmp/horizontal.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$V" >/tmp/vertical-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$H" >/tmp/horizontal-cert.txt
          cp "$V" Estrada-Play-Comunista-Vertical-1.2.2.apk
          cp "$H" Estrada-Play-Comunista-Horizontal-1.2.2.apk
          sha256sum Estrada-Play-Comunista-Vertical-1.2.2.apk Estrada-Play-Comunista-Horizontal-1.2.2.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.2.2-safety-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "Estrada Play Comunista 1.2.2 - Alertas Centrais" \
            --notes "Vertical e Horizontal continuam independentes. Radar agora abre alerta grande no centro do app com limite do radar quando informado. Quebra-molas tem alerta central e janela de emergência para pontos carregados muito perto do carro. Câmeras públicas marcadas especificamente como monitoramento de tráfego passam a integrar a proteção, sem importar CCTV privado genérico. Corrigido também o encadeamento para um ponto já avisado não bloquear o próximo alerta. Voz online/local e fallback offline conhecem câmera de monitoramento. Nenhuma imagem nova. EstradaPlay 2.0.11 não alterado." \
            Estrada-Play-Comunista-Vertical-1.2.2.apk \
            Estrada-Play-Comunista-Horizontal-1.2.2.apk

      - name: Temporary artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-1.2.2-Vertical-Horizontal
          path: |
            Estrada-Play-Comunista-Vertical-1.2.2.apk
            Estrada-Play-Comunista-Horizontal-1.2.2.apk
          retention-days: 1
          compression-level: 0
