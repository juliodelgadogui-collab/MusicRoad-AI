name: EPC Android 2.4.6 Reprodução Exata

on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'estrada-play-comunista-app/app/build.gradle'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/PlayerService.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MusicPlayerActivity.java'
      - '.github/workflows/build-epc-v246-exact-selected-playback.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epc-android-v246-exact-selected-playback
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Validate 2.4.6 exact selected playback
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          G="$APP/app/build.gradle"
          grep -q "versionCode 256" "$G"
          grep -q "versionName '2.4.6'" "$G"
          grep -q 'EPC_246_EXACT_SELECTED_PLAYBACK' "$G"
          grep -q 'MUSIC_EXACT_SELECTED_SOURCE_V246' "$J/MusicPlayerActivity.java"
          grep -q 't.toStored().toString()' "$J/MusicPlayerActivity.java"
          grep -q 'EXTRA_TRACK_JSON' "$J/MusicPlayerActivity.java"
          grep -q 'PLAYER_EXACT_SELECTED_SOURCE_V246' "$J/PlayerService.java"
          grep -q 'exact_track_json_v246' "$J/PlayerService.java"
          grep -q 'exactTrackFromIntent' "$J/PlayerService.java"
          grep -q 'alignExactSelected' "$J/PlayerService.java"
          grep -q 'findIndex(key, exactSelected' "$J/PlayerService.java"
          grep -q 'PLAYER_EXACT_QUEUE_V245' "$J/PlayerService.java"
          grep -q 'PLAYER_MEDIA_SESSION_V243' "$J/PlayerService.java"
          grep -q 'MUSIC_DOWNLOAD_ENTRY_V240' "$J/MusicPlayerActivity.java"
          grep -q 'MUSIC_COMPACT_PLAYER_V2318' "$J/MusicPlayerActivity.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$APP/app/src/main/java"; then echo 'WebView detected'; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare development signing key
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          base64 -d "$APP/signing/estradaplay-dev.keystore.b64" > "$APP/signing/estradaplay-dev.keystore"

      - name: Generate embedded Portuguese voice bank
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-v246-voice && mkdir -p /tmp/epc-v246-voice
          tar -xjf "$MODEL" -C /tmp/epc-v246-voice
          python3 "$APP/tools/generate_voice_bank.py" --model-root /tmp/epc-v246-voice --output "$APP/app/src/main/res/raw" --metadata-output "$APP/app/src/main/assets/estradaplay_voice"
          test "$(find "$APP/app/src/main/res/raw" -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 77

      - name: Unit tests and build universal plus horizontal APKs
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          (cd "$APP" && gradle --no-daemon testUniversalDebugUnitTest testHorizontalDebugUnitTest assembleUniversalDebug assembleHorizontalDebug)
          U="$APP/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          H="$APP/app/build/outputs/apk/horizontal/debug/app-horizontal-debug.apk"
          test -f "$U" && test -f "$H"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$U" | tee /tmp/u.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='256' versionName='2.4.6'" /tmp/u.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$H" | tee /tmp/h.txt
          grep -q "package: name='com.estradaplay.comunista.horizontal' versionCode='256' versionName='2.4.6'" /tmp/h.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$U"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$H"
          cp "$U" Estrada-Play-Comunista-Universal-2.4.6.apk
          cp "$H" Estrada-Play-Comunista-Horizontal-2.4.6.apk
          sha256sum Estrada-Play-Comunista-Universal-2.4.6.apk Estrada-Play-Comunista-Horizontal-2.4.6.apk
          git diff --exit-code

      - name: Publish 2.4.6 APKs as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-2.4.6-reproducao-exata"
          U="Estrada-Play-Comunista-Universal-2.4.6.apk"
          H="Estrada-Play-Comunista-Horizontal-2.4.6.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$U" "$H" --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Estrada Play Comunista 2.4.6 - Reprodução Exata" \
              --notes "Corrige o caso em que a tela mostrava a música escolhida, mas o serviço podia resolver outra fonte local para reprodução. Agora o toque envia ao PlayerService o Track exato selecionado, preservando a fila inteligente da 2.4.5. Sem mudança de design." \
              "$U" "$H"
          fi

