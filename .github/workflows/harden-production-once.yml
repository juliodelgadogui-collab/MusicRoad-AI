name: Harden Estrada Play Production Once

on:
  push:
    branches:
      - agent/estrada-play-comunista
    paths:
      - 'tools/production_hardening_v302.py'
      - '.github/workflows/harden-production-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply production hardening
        run: python3 tools/production_hardening_v302.py

      - name: Create temporary candidate signing key
        run: |
          mkdir -p estrada-play-comunista-app/signing
          rm -f estrada-play-comunista-app/signing/estradaplay-dev.keystore
          keytool -genkeypair -v \
            -keystore estrada-play-comunista-app/signing/estradaplay-dev.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Estrada Play Candidate,O=Estrada Play,C=BR"

      - name: Run unit tests
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon --stacktrace testUniversalDebugUnitTest

      - name: Run strict Android lint
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon --stacktrace lintUniversalDebug

      - name: Compile candidate without .teste
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon --stacktrace assembleUniversalCandidate assembleVerticalCandidate assembleHorizontalCandidate

      - name: Remove one-shot automation files
        run: |
          rm -f tools/production_hardening_v302.py
          rm -f .github/workflows/harden-production-once.yml

      - name: Commit validated production hardening
        run: |
          git config user.name "Estrada Play Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add estrada-play-comunista-app/app/src estrada-play-comunista-app/app/build.gradle
          git add -u tools/production_hardening_v302.py .github/workflows/harden-production-once.yml
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "production: harden runtime permissions and internal broadcasts"
            git push origin HEAD:agent/estrada-play-comunista
          fi

      - name: Upload production candidate APKs
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-3.0.1-CANDIDATO-SEM-TESTE
          path: |
            estrada-play-comunista-app/app/build/outputs/apk/universal/candidate/*.apk
            estrada-play-comunista-app/app/build/outputs/apk/vertical/candidate/*.apk
            estrada-play-comunista-app/app/build/outputs/apk/horizontal/candidate/*.apk
          if-no-files-found: error
          retention-days: 3
