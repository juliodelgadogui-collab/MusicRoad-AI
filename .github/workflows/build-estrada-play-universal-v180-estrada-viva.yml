name: Estrada Play Universal 1.8.0 Estrada Viva
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_v180_estrada_viva.py'
      - '.github/workflows/build-estrada-play-universal-v180-estrada-viva.yml'
      - 'api/road_live.php'
      - 'api/convoy.php'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/EstradaVivaStore.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/EstradaVivaActivity.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/ConvoyStore.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/ConvoyActivity.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/TripOfflinePreparer.java'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v180
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Generate 1.8.0 Estrada Viva source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_estrada_play_v180_estrada_viva.py
          python3 tools/patch_estrada_play_v180_estrada_viva.py

      - name: Verify 1.8.0 architecture
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          M=estrada-play-comunista-app/app/src/main/AndroidManifest.xml
          grep -q "versionName '1.8.0'" "$G"
          grep -q 'versionCode 180' "$G"
          grep -q 'EstradaVivaActivity' "$M"
          grep -q 'ConvoyActivity' "$M"
          grep -q 'ESTRADA_VIVA_MAP_V180' "$J/RoadMapView.java"
          grep -q 'CONVOY_MAP_V180' "$J/RoadMapView.java"
          grep -q 'ROUTE_OFFLINE_PREP_V180' "$J/TripPlannerActivity.java"
          grep -q 'ESTRADA VIVA' "$J/DriveToolsActivity.java"
          grep -q 'COMBOIO' "$J/DriveToolsActivity.java"
          grep -q 'PREPARAR OFFLINE' "$J/TripPlannerActivity.java"
          grep -q 'api/road_live.php' "$J/EstradaVivaStore.java"
          grep -q 'api/convoy.php' "$J/ConvoyStore.java"
          php -l api/road_live.php
          php -l api/convoy.php
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Commit generated 1.8.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app/app/build.gradle \
                  estrada-play-comunista-app/app/src/main/AndroidManifest.xml \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/DriveToolsActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/TripPlannerActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapView.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java
          git commit -m "Generate Universal 1.8.0 Estrada Viva [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore

      - name: Generate embedded safety voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          test "$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 77

      - name: Build Universal APK
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleUniversalDebug

      - name: Verify APK and package server update
        shell: bash
        run: |
          set -euo pipefail
          A=estrada-play-comunista-app/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$A"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$A" | tee /tmp/v180.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='180' versionName='1.8.0'" /tmp/v180.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$A" >/tmp/v180-cert.txt
          cp "$A" Estrada-Play-Comunista-Universal-1.8.0-Estrada-Viva.apk
          sha256sum Estrada-Play-Comunista-Universal-1.8.0-Estrada-Viva.apk | tee /tmp/v180-sha.txt
          rm -rf /tmp/epc180-server && mkdir -p /tmp/epc180-server/api
          cp api/road_live.php api/convoy.php /tmp/epc180-server/api/
          cat > /tmp/epc180-server/LEIA-PRIMEIRO.txt <<'TXT'
          Estrada Play Comunista Universal 1.8.0 - Estrada Viva
          Envie os arquivos da pasta api/ para a pasta api/ do servidor atual.
          road_live.php: alertas comunitarios temporarios e confirmacoes.
          convoy.php: criacao, entrada e posicao ao vivo do Comboio Virtual.
          Os dois endpoints criam suas tabelas MariaDB automaticamente no primeiro uso.
          O APK continua local-first: alertas feitos offline ficam em fila ate a conexao voltar.
          TXT
          (cd /tmp/epc180-server && zip -qr "$GITHUB_WORKSPACE/Estrada-Play-Comunista-1.8.0-SERVIDOR.zip" .)

      - name: Publish Universal 1.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.8.0-estrada-viva-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "Estrada Play Comunista Universal 1.8.0 - Estrada Viva" \
            --notes "Estrada Viva com alertas comunitarios locais e sincronizados, marcadores no mapa, Comboio Virtual com codigo e posicoes ao vivo, e preparacao offline automatica da rota calculada. Sem WebView. Inclui pacote pequeno de servidor para road_live.php e convoy.php." \
            Estrada-Play-Comunista-Universal-1.8.0-Estrada-Viva.apk Estrada-Play-Comunista-1.8.0-SERVIDOR.zip

      - name: Temporary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-1.8.0-Estrada-Viva
          path: |
            Estrada-Play-Comunista-Universal-1.8.0-Estrada-Viva.apk
            Estrada-Play-Comunista-1.8.0-SERVIDOR.zip
          retention-days: 2
          compression-level: 0
