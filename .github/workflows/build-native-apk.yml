# MusicRoad 1.5 native Mapbox build
name: Build MusicRoad Native APK

on:
  push:
    branches:
      - agent/native-apk-build
    paths:
      - 'android-app/**'
      - '.github/workflows/build-native-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: musicroad-stable-debug-signing-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MusicRoad Stable Debug,O=MusicRoad,C=BR"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:|Valid from:" || true

      - name: Apply MusicRoad v4.6 source patch
        run: python android-app/tools/apply_v460.py

      - name: Apply MusicRoad v4.6.1 GPS precision patch
        run: python android-app/tools/apply_v461_precision.py

      - name: Apply MusicRoad v4.6.2 radar speed voice patch
        run: python android-app/tools/apply_v462_radar_speed_voice.py

      - name: Apply MusicRoad v4.6.3 route cleanup patch
        run: python android-app/tools/apply_v463_route_ui.py

      - name: Apply MusicRoad v4.6.4 bump sequence patch
        run: python android-app/tools/apply_v464_bump_sequence.py

      - name: Apply MusicRoad v4.6.5 trial device identity patch
        run: python android-app/tools/apply_v465_trial_device.py

      - name: Apply MusicRoad v4.6.6 DriveOS landscape patch
        run: python android-app/tools/apply_v466_driveos_landscape.py

      - name: Apply MusicRoad 1.0 public release patch
        run: python android-app/tools/apply_v100_release.py

      - name: Apply MusicRoad 1.1 offline core and device binding
        run: python android-app/tools/apply_v110_offline_core.py

      - name: Keep MusicRoad device token compatible
        run: python android-app/tools/apply_v110_token_compat.py

      - name: Apply MusicRoad 1.3 fully native core
        shell: bash
        run: |
          cp android-app/native-v130/MainActivity.java android-app/app/src/main/java/com/musicroad/ai/MainActivity.java
          cp android-app/native-v130/NativeApiClient.java android-app/app/src/main/java/com/musicroad/ai/NativeApiClient.java
          cp android-app/native-v130/NativeMapView.java android-app/app/src/main/java/com/musicroad/ai/NativeMapView.java
          cp android-app/native-v130/NativeBridge.java android-app/app/src/main/java/com/musicroad/ai/NativeBridge.java
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('android-app/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+','versionCode 27',s,count=1)
          s=re.sub(r"versionName\s+'[^']+'","versionName '1.3.0'",s,count=1)
          p.write_text(s)
          for rel in ['android-app/app/src/main/res/values/styles.xml','android-app/app/src/main/res/values-v35/styles.xml']:
              q=Path(rel)
              if q.exists():
                  x=q.read_text().replace('#25D7A1','#FF7A1A').replace('#08111F','#070B10')
                  q.write_text(x)
          PY

      - name: Apply MusicRoad 1.3.1 login black screen fix
        run: python android-app/tools/apply_v131_login_black_screen_fix.py

      - name: Fix MusicRoad 1.4 generator escaping
        run: python android-app/tools/fix_v140_generator_escape.py

      - name: Apply MusicRoad 1.4 native full design
        run: python android-app/tools/apply_v140_native_full_design.py

      - name: Apply MusicRoad 1.5 Mapbox native map
        run: python android-app/tools/apply_v150_mapbox_native.py

      - name: Verify MusicRoad 1.5 native Mapbox app
        shell: bash
        run: |
          grep -q 'Para onde você vai?' android-app/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'private void radio()' android-app/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'return NativeApiClient.normalizeBase(BuildConfig.MUSICROAD_URL)' android-app/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q "versionName '1.5.0'" android-app/app/build.gradle
          grep -q 'versionCode 30' android-app/app/build.gradle
          grep -q 'com.mapbox.maps:android-ndk27:11.28.3' android-app/app/build.gradle
          grep -q 'class NativeMapView extends FrameLayout' android-app/app/src/main/java/com/musicroad/ai/NativeMapView.java
          grep -q 'MapboxOptions' android-app/app/src/main/java/com/musicroad/ai/NativeMapView.java
          if grep -R -q 'android.webkit.WebView\|new WebView' android-app/app/src/main/java/com/musicroad/ai/MainActivity.java; then
            echo 'WebView found in MainActivity'; exit 1
          fi

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicRoad-AI-native-1.5.0-mapbox-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
