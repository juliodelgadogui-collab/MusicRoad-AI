# MusicRoad 1.7.0 -> 2.0 clean source migration
name: Build MusicRoad Native APK

permissions:
  contents: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - 'android-app/**'
      - 'api/route.php'
      - 'api/route_fast.php'
      - 'api/route_hazards.php'
      - '.github/workflows/build-native-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'api/route.php'
      - 'api/route_fast.php'
      - 'api/route_hazards.php'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: musicroad-stable-debug-signing-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MusicRoad Stable Debug,O=MusicRoad,C=BR"
          fi

      - name: Materialize final 1.7 source once
        shell: bash
        run: |
          set -e
          python android-app/tools/apply_v460.py
          python android-app/tools/apply_v461_precision.py
          python android-app/tools/apply_v462_radar_speed_voice.py
          python android-app/tools/apply_v463_route_ui.py
          python android-app/tools/apply_v464_bump_sequence.py
          python android-app/tools/apply_v465_trial_device.py
          python android-app/tools/apply_v466_driveos_landscape.py
          python android-app/tools/apply_v100_release.py
          python android-app/tools/apply_v110_offline_core.py
          python android-app/tools/apply_v110_token_compat.py
          cp android-app/native-v130/MainActivity.java android-app/app/src/main/java/com/musicroad/ai/MainActivity.java
          cp android-app/native-v130/NativeApiClient.java android-app/app/src/main/java/com/musicroad/ai/NativeApiClient.java
          cp android-app/native-v130/NativeMapView.java android-app/app/src/main/java/com/musicroad/ai/NativeMapView.java
          cp android-app/native-v130/NativeBridge.java android-app/app/src/main/java/com/musicroad/ai/NativeBridge.java
          python android-app/tools/apply_v131_login_black_screen_fix.py
          python android-app/tools/fix_v140_generator_escape.py
          python android-app/tools/apply_v140_native_full_design.py
          python android-app/tools/apply_v150_mapbox_native.py
          python android-app/tools/apply_v156_mapbox_server_geocode.py
          python android-app/tools/apply_v157_mapbox_runtime_fix.py
          python android-app/tools/apply_v158_mapbox_device_compat.py
          python android-app/tools/apply_v159_mapbox_lifecycle_owner.py
          python android-app/tools/apply_v160a_mapbox_directions.py
          python android-app/tools/apply_v161_unified_mapbox_route.py
          python android-app/tools/apply_v162_fast_route_native_layer.py
          python android-app/tools/apply_v170_driveos_landscape.py

      - name: Create clean 2.0 project
        shell: bash
        run: |
          set -e
          rm -rf android-app-v2
          mkdir -p android-app-v2
          cp -a android-app/app android-app-v2/app
          cp android-app/build.gradle android-app-v2/build.gradle
          cp android-app/settings.gradle android-app-v2/settings.gradle
          cp android-app/gradle.properties android-app-v2/gradle.properties
          sed -i "s/versionCode 39/versionCode 40/" android-app-v2/app/build.gradle
          sed -i "s/versionName '1.7.0'/versionName '2.0.0'/" android-app-v2/app/build.gradle
          sed -i "s/rootProject.name = 'MusicRoadAI'/rootProject.name = 'MusicRoadAI2'/" android-app-v2/settings.gradle
          rm -f android-app-v2/app/src/main/java/com/musicroad/ai/MapboxDirectionsEngine.java
          rm -f android-app-v2/app/src/main/java/com/musicroad/ai/ServerMapboxRouteEngine.java
          cat > android-app-v2/README-ARCHITECTURE.md <<'EOF'
          # MusicRoad Android 2.0 — Clean Base

          This directory is the authoritative Android source for MusicRoad 2.x.

          - Native Android only; no WebView.
          - Builds directly from source; no legacy patch scripts.
          - Same applicationId (`com.musicroad.ai`) for upgrade compatibility.
          - Portrait and DriveOS landscape have different presentations and share the same core services.
          - Mapbox Maps SDK renders the map.
          - FastMapboxRouteEngine uses the server fast Mapbox route endpoint and loads hazards asynchronously.
          - NavigationService owns MusicRoad route progress, radar/quebra-mola alerts and voice.
          - PlaybackService owns background music and online radio playback.
          - NativeMusicRepository reads device audio with MediaStore.
          - OfflineStore persists state packs and the last route.
          EOF
          cat > android-app-v2/FUNCTIONS-PRESERVED.md <<'EOF'
          # MusicRoad 2.0 — preserved functions

          - Native login and registration
          - Device identity, binding and recovery
          - Account/entitlement state
          - Local Android MediaStore music library
          - Online/server/Drive library through server APIs
          - Favorites and player state
          - Background playback and notification
          - FM launcher and saved online radio streams
          - GPS, speed and trip mode
          - Native Mapbox map
          - Fast Mapbox route via api/route_fast.php
          - Async route hazards via api/route_hazards.php
          - Route persistence and reroute support
          - Navigation foreground service
          - Radar, portable, video, signal and speed-bump alerts
          - Voice/system/vibration alert preferences
          - Community hazard reporting
          - Offline map/radar state packs
          - Portrait mobile interface
          - Separate DriveOS landscape home/navigation/media/radio/offline/settings interface
          - Native in-app APK update flow
          EOF

      - name: Verify clean 2.0 source
        shell: bash
        run: |
          set -e
          grep -q "versionName '2.0.0'" android-app-v2/app/build.gradle
          grep -q 'versionCode 40' android-app-v2/app/build.gradle
          grep -q 'extends ComponentActivity' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'FastMapboxRouteEngine' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'showLandscapeShell' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'landscapeMap' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'setDrivingMode' android-app-v2/app/src/main/java/com/musicroad/ai/NativeMapView.java
          grep -q 'api/route_fast.php' android-app-v2/app/src/main/java/com/musicroad/ai/FastMapboxRouteEngine.java
          grep -q 'api/route_hazards.php' android-app-v2/app/src/main/java/com/musicroad/ai/FastMapboxRouteEngine.java
          grep -q 'NavigationService.routeChangedIntent' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          test ! -f android-app-v2/app/src/main/java/com/musicroad/ai/MapboxDirectionsEngine.java
          test ! -f android-app-v2/app/src/main/java/com/musicroad/ai/ServerMapboxRouteEngine.java
          if grep -R -q 'android.webkit.WebView\|new WebView' android-app-v2/app/src/main/java; then
            echo 'WebView found in 2.0 source'; exit 1
          fi

      - name: Commit clean 2.0 source
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/native-apk-build'
        shell: bash
        run: |
          set -e
          git config user.name "MusicRoad Build"
          git config user.email "actions@users.noreply.github.com"
          git add android-app-v2
          if git diff --cached --quiet; then
            echo "No clean-source changes to commit"
          else
            git commit -m "feat: add MusicRoad 2.0 clean Android source"
            git push origin HEAD:agent/native-apk-build
          fi

      - name: Build clean 2.0 APK
        working-directory: android-app-v2
        run: gradle --no-daemon clean assembleDebug

      - name: Upload clean 2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicRoad-AI-native-2.0.0-clean-apk
          path: android-app-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
