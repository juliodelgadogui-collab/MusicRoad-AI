# Temporary one-shot source migration. The migration rewrites this file back to the
# final direct android-app-v2 build before committing the MusicRoad 2.2 source.
name: Build MusicRoad Native APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-app-v2/**'
      - 'api/route_fast.php'
      - 'api/route_hazards.php'
      - '.github/workflows/build-native-apk.yml'
      - '.driveos-2.2-migrate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-apk-build
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: musicroad-stable-debug-signing-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MusicRoad Stable Debug,O=MusicRoad,C=BR"
          fi

      - name: Apply MusicRoad 2.2 DriveOS source migration
        shell: bash
        run: |
          set -e
          sed -i 's/stop.setEnabled(currentRouteCoords.length()>1);/stop.setEnabled(true);/' .driveos-2.2-migrate.py
          python3 .driveos-2.2-migrate.py
          git diff --check
          grep -q "versionName '2.2.0'" android-app-v2/app/build.gradle
          grep -q 'versionCode 42' android-app-v2/app/build.gradle
          grep -q 'DriveGuidance' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'annotations.*maxspeed' api/route_fast.php
          test ! -f .driveos-2.2-migrate.py
          test ! -f .driveos-2.2-migrate
          test ! -f .github/workflows/driveos-2.2-source-migration.yml
          if grep -R -q 'android.webkit.WebView\|new WebView' android-app-v2/app/src/main/java; then
            echo 'WebView found in MusicRoad 2.2 source'; exit 1
          fi

      - name: Build migrated MusicRoad 2.2 source
        working-directory: android-app-v2
        run: gradle --no-daemon clean assembleDebug

      - name: Upload migration validation APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicRoad-AI-native-2.2.0-DriveOS-Cockpit-migration-apk
          path: android-app-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit clean MusicRoad 2.2 source
        shell: bash
        run: |
          set -e
          git config user.name "MusicRoad Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build MusicRoad 2.2 DriveOS cockpit"
          git push origin HEAD:agent/native-apk-build
