# MusicRoad 1.6.1 unified Mapbox route + navigation layout fix
name: Build MusicRoad Native APK

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - 'android-app/**'
      - 'api/route.php'
      - '.github/workflows/build-native-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'api/route.php'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: musicroad-stable-debug-signing-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MusicRoad Stable Debug,O=MusicRoad,C=BR"
          fi

      - name: Apply MusicRoad native patches
        shell: bash
        run: |
          set -e
          python android-app/tools/apply_v460.py
          python android-app/tools/apply_v461_precision.py
          python android-app/tools/apply_v462_radar_speed_voice.py
          python android-app/tools/apply_v463_route_ui.py
          python android-app/tools/apply_v464_bump_sequence.py
          python android-app/tools/apply_v465_trial_device.py
          python android-app/tools/apply_v466_driveos_landscape.py
          python android-app/tools/apply_v100_release.py
          python android-app/tools/apply_v110_offline_core.py
          python android-app/tools/apply_v110_token_compat.py
          cp android-app/native-v130/MainActivity.java android-app/app/src/main/java/com/musicroad/ai/MainActivity.java
          cp android-app/native-v130/NativeApiClient.java android-app/app/src/main/java/com/musicroad/ai/NativeApiClient.java
          cp android-app/native-v130/NativeMapView.java android-app/app/src/main/java/com/musicroad/ai/NativeMapView.java
          cp android-app/native-v130/NativeBridge.java android-app/app/src/main/java/com/musicroad/ai/NativeBridge.java
          python android-app/tools/apply_v131_login_black_screen_fix.py
          python android-app/tools/fix_v140_generator_escape.py
          python android-app/tools/apply_v140_native_full_design.py
          python android-app/tools/apply_v150_mapbox_native.py
          python android-app/tools/apply_v156_mapbox_server_geocode.py
          python android-app/tools/apply_v157_mapbox_runtime_fix.py
          python android-app/tools/apply_v158_mapbox_device_compat.py
          python android-app/tools/apply_v159_mapbox_lifecycle_owner.py
          python android-app/tools/apply_v160a_mapbox_directions.py
          python android-app/tools/apply_v161_unified_mapbox_route.py

      - name: Verify MusicRoad 1.6.1
        shell: bash
        run: |
          grep -q "versionName '1.6.1'" android-app/app/build.gradle
          grep -q 'versionCode 37' android-app/app/build.gradle
          grep -q 'extends ComponentActivity' android-app/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'ServerMapboxRouteEngine' android-app/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'api/route.php?origin=' android-app/app/src/main/java/com/musicroad/ai/ServerMapboxRouteEngine.java
          grep -q 'router.startsWith("mapbox-directions")' android-app/app/src/main/java/com/musicroad/ai/ServerMapboxRouteEngine.java
          grep -q 'api.mapbox.com/directions/v5/mapbox/driving/' api/route.php
          grep -q "'router' => 'mapbox-directions-v5'" api/route.php
          grep -q 'NavigationService.routeChangedIntent' android-app/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'if(screen!=MAP)main.addView(top()' android-app/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'mapLp.bottomMargin=dp(118)' android-app/app/src/main/java/com/musicroad/ai/MainActivity.java
          if grep -q 'mapboxDirections.requestRoute' android-app/app/src/main/java/com/musicroad/ai/MainActivity.java; then
            echo 'Old direct Mapbox Directions call still active in MainActivity'; exit 1
          fi
          if grep -R -q 'android.webkit.WebView\|new WebView' android-app/app/src/main/java/com/musicroad/ai/MainActivity.java; then
            echo 'WebView found in MainActivity'; exit 1
          fi

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicRoad-AI-native-1.6.1-unified-mapbox-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
