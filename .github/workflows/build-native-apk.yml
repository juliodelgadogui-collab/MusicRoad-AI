# MusicRoad 2.1 DriveOS Automotive migration/build
name: Build MusicRoad Native APK

permissions:
  contents: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - 'android-app-v2/**'
      - 'api/route_fast.php'
      - 'api/route_hazards.php'
      - '.github/workflows/build-native-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-app-v2/**'
      - 'api/route_fast.php'
      - 'api/route_hazards.php'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: musicroad-stable-debug-signing-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MusicRoad Stable Debug,O=MusicRoad,C=BR"
          fi

      - name: Materialize DriveOS Automotive 2.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/native-apk-build'
        shell: bash
        run: |
          set -e
          if grep -q "versionName '2.1.0'" android-app-v2/app/build.gradle; then
            echo "DriveOS 2.1 already materialized"
          else
            python - <<'PY'
          import base64, gzip, pathlib, subprocess
          payload = pathlib.Path('android-app-v2/tools/v210_driveos.patch.gz.b64').read_text().strip()
          patch = gzip.decompress(base64.b64decode(payload))
          pathlib.Path('/tmp/v210_driveos.patch').write_bytes(patch)
          subprocess.check_call(['git','apply','/tmp/v210_driveos.patch'])
          PY
            git config user.name "MusicRoad Build"
            git config user.email "actions@users.noreply.github.com"
            git add android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java android-app-v2/app/build.gradle
            git commit -m "feat: DriveOS 2.1 automotive multimedia UI"
            git push origin HEAD:agent/native-apk-build
          fi

      - name: Verify MusicRoad 2.1 automotive architecture
        shell: bash
        run: |
          set -e
          grep -q "versionName '2.1.0'" android-app-v2/app/build.gradle
          grep -q 'versionCode 41' android-app-v2/app/build.gradle
          grep -q "applicationId 'com.musicroad.ai'" android-app-v2/app/build.gradle
          grep -q 'extends ComponentActivity' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'setAutomotiveImmersive' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'driveStatusBar' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'autoSpeedGauge' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'autoLimitGauge' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'landscapeMap' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'landscapeMusic' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'FastMapboxRouteEngine' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'api/route_fast.php' android-app-v2/app/src/main/java/com/musicroad/ai/FastMapboxRouteEngine.java
          grep -q 'api/route_hazards.php' android-app-v2/app/src/main/java/com/musicroad/ai/FastMapboxRouteEngine.java
          grep -q 'setDrivingMode' android-app-v2/app/src/main/java/com/musicroad/ai/NativeMapView.java
          grep -q 'musicroad-route-source' android-app-v2/app/src/main/java/com/musicroad/ai/NativeMapView.java
          grep -q 'MediaStore' android-app-v2/app/src/main/java/com/musicroad/ai/NativeMusicRepository.java
          grep -q 'ACTION_PREVIOUS' android-app-v2/app/src/main/java/com/musicroad/ai/PlaybackService.java
          grep -q 'ACTION_NEXT' android-app-v2/app/src/main/java/com/musicroad/ai/PlaybackService.java
          grep -q 'BUMP_SEQUENCE_MILESTONES' android-app-v2/app/src/main/java/com/musicroad/ai/NavigationService.java
          grep -q 'routeChangedIntent' android-app-v2/app/src/main/java/com/musicroad/ai/NavigationService.java
          test ! -f android-app-v2/app/src/main/java/com/musicroad/ai/MapboxDirectionsEngine.java
          test ! -f android-app-v2/app/src/main/java/com/musicroad/ai/ServerMapboxRouteEngine.java
          if grep -R -q 'android.webkit.WebView\|new WebView' android-app-v2/app/src/main/java; then
            echo 'WebView found in MusicRoad 2.1 source'; exit 1
          fi

      - name: Build MusicRoad 2.1 APK
        working-directory: android-app-v2
        run: gradle --no-daemon clean assembleDebug

      - name: Upload MusicRoad 2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicRoad-AI-native-2.1.0-DriveOS-Automotive-apk
          path: android-app-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
