# EstradaPlay 1.7.1 — touch-safe automotive UI + resilient ES alerts
name: Build EstradaPlay Native APK

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - 'estradaplay-app/**'
      - 'admin_radares.php'
      - 'api/radar_db.php'
      - 'api/road_hazard_db.php'
      - 'api/road_state_pack.php'
      - 'api/road_corridor_pack.php'
      - 'api/road_safety_pack_helpers.php'
      - '.github/workflows/build-native-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'estradaplay-app/**'
      - 'admin_radares.php'
      - 'api/radar_db.php'
      - 'api/road_hazard_db.php'
      - 'api/road_state_pack.php'
      - 'api/road_corridor_pack.php'
      - 'api/road_safety_pack_helpers.php'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install fixed EstradaPlay development signer
        shell: bash
        run: |
          set -e
          base64 -d estradaplay-app/signing/estradaplay-dev.keystore.b64 > estradaplay-app/signing/estradaplay-dev.keystore
          keytool -list -v -keystore estradaplay-app/signing/estradaplay-dev.keystore -storepass android -alias androiddebugkey | tee /tmp/keytool.txt
          grep -q 'C2:D8:8A:15:B1:34:F4:35:DE:9F:B5:32:69:9E:93:FC:D4:6B:C3:59:00:A0:86:57:5F:CB:2B:F7:F2:F6:6F:DB' /tmp/keytool.txt

      - name: Apply EstradaPlay visual compatibility
        run: python3 estradaplay-app/tools/apply_151.py

      - name: Apply EstradaPlay cache and ES compatibility
        run: python3 estradaplay-app/tools/apply_152_alert_fix.py

      - name: Apply 1.6 permission behavior
        run: python3 estradaplay-app/tools/apply_160_automotive.py

      - name: Apply 1.6.1 startup stability
        run: python3 estradaplay-app/tools/apply_161_stability.py

      - name: Apply 1.7 responsive UI from scratch
        run: python3 estradaplay-app/tools/apply_170_responsive_ui.py

      - name: Apply 1.7.1 touch-safe input
        run: python3 .github/scripts/apply_171_touch_fix.py

      - name: Verify EstradaPlay 1.7.1 touch architecture
        shell: bash
        run: |
          set -e
          grep -q "versionName '1.7.1'" estradaplay-app/app/build.gradle
          grep -q 'versionCode 13' estradaplay-app/app/build.gradle
          grep -q "applicationId 'com.estradaplay.app'" estradaplay-app/app/build.gradle
          grep -q 'android:screenOrientation="sensorLandscape"' estradaplay-app/app/src/main/AndroidManifest.xml
          grep -q 'ADAPTIVE_COCKPIT_V170' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'TOUCH_INPUT_V171' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'dispatchTouchEvent(android.view.MotionEvent event)' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'registerTouchTarget' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'setImportantForAccessibility(View.IMPORTANT_FOR_ACCESSIBILITY_NO)' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapView.java
          grep -q 'TOUCH_INPUT_V171' estradaplay-app/app/src/main/java/com/estradaplay/app/MainActivity.java
          if grep -q '^[[:space:]]*requestNotifications();' estradaplay-app/app/src/main/java/com/estradaplay/app/MainActivity.java; then
            echo 'Notification permission must not be requested automatically on boot'; exit 1
          fi
          grep -q 'showLocationPermissionGate' estradaplay-app/app/src/main/java/com/estradaplay/app/MainActivity.java
          grep -q 'MapLibre.getInstance' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapView.java
          grep -q 'RESERVE_DISTANCE_M = 250000' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadPackStore.java
          grep -q 'case "PEDAGIO"' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'case "PASSAGEM_NIVEL"' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'overpass.private.coffee' api/road_hazard_db.php
          grep -q 'road_hazard_sync_es_chunks' api/road_hazard_db.php
          if grep -R -q 'android.webkit.WebView\|new WebView' estradaplay-app/app/src/main/java; then exit 1; fi

      - name: PHP lint alert server files
        run: |
          php -l admin_radares.php
          php -l api/radar_db.php
          php -l api/road_hazard_db.php
          php -l api/road_safety_pack_helpers.php
          php -l api/road_state_pack.php
          php -l api/road_corridor_pack.php

      - name: Build EstradaPlay 1.7.1 APK
        working-directory: estradaplay-app
        run: gradle --no-daemon clean assembleDebug

      - name: Verify fixed APK signing certificate
        shell: bash
        run: |
          set -e
          APK=estradaplay-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -qi 'c2d88a15b134f435de9fb532699e93fcd46bc35900a086575fcb2bf7f2f66fdb' /tmp/apksigner.txt

      - name: Package 1.7.1 server files
        shell: bash
        run: |
          set -e
          rm -rf /tmp/ep171
          mkdir -p /tmp/ep171/api
          cp admin_radares.php /tmp/ep171/
          cp api/radar_db.php /tmp/ep171/api/
          cp api/road_hazard_db.php /tmp/ep171/api/
          cp api/road_safety_pack_helpers.php /tmp/ep171/api/
          cp api/road_state_pack.php /tmp/ep171/api/
          cp api/road_corridor_pack.php /tmp/ep171/api/
          cat > /tmp/ep171/LEIA-PRIMEIRO.txt <<'EOF'
          EstradaPlay 1.7.1 — ARQUIVOS DO SERVIDOR
          Extraia na raiz do servidor, sobrescrevendo os arquivos existentes.
          NÃO apague config.php, MariaDB, usuários, músicas ou metadados.
          Mantém a sincronização resiliente dos alertas do Espírito Santo.
          EOF
          (cd /tmp/ep171 && zip -qr "$GITHUB_WORKSPACE/EstradaPlay-1.7.1-SERVIDOR.zip" .)
          unzip -t EstradaPlay-1.7.1-SERVIDOR.zip
          cp estradaplay-app/app/build/outputs/apk/debug/app-debug.apk EstradaPlay-1.7.1.apk

      - name: Upload short-lived direct-download artifact
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: EstradaPlay-1.7.1-direct-${{ github.run_number }}
          path: |
            EstradaPlay-1.7.1.apk
            EstradaPlay-1.7.1-SERVIDOR.zip
          retention-days: 1
          compression-level: 0

      - name: Publish EstradaPlay 1.7.1 release assets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="estradaplay-1.7.1-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "EstradaPlay 1.7.1 · correção de toque" \
            --notes "Correção do toque em multimídias Android: remove pedido automático de permissão na abertura, roteia botões do cockpit antes da camada do mapa e impede a camada gráfica de alertas de capturar gestos. Mantém o design responsivo 1.7 e a base de alertas do ES." \
            EstradaPlay-1.7.1.apk \
            EstradaPlay-1.7.1-SERVIDOR.zip
