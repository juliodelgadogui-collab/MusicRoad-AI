# EstradaPlay 1.1.0 — offline-first music + passive GPS road safety
name: Build EstradaPlay Native APK

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - 'estradaplay-app/**'
      - 'api/road_pack.php'
      - '.github/workflows/build-native-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'estradaplay-app/**'
      - 'api/road_pack.php'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: estradaplay-stable-debug-signing-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=EstradaPlay Stable Debug,O=EstradaPlay,C=BR"
          fi

      - name: Verify EstradaPlay 1.1.0 offline architecture
        shell: bash
        run: |
          set -e
          grep -q "versionName '1.1.0'" estradaplay-app/app/build.gradle
          grep -q 'versionCode 2' estradaplay-app/app/build.gradle
          grep -q "applicationId 'com.estradaplay.app'" estradaplay-app/app/build.gradle
          grep -q 'android:name=".GateActivity"' estradaplay-app/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_FINE_LOCATION' estradaplay-app/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_LOCATION' estradaplay-app/app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="location"' estradaplay-app/app/src/main/AndroidManifest.xml
          grep -q 'class RoadSafetyService extends Service' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'packs.nearby' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'forward = east' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'lateral = Math.abs' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'Semáforo à frente' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'Quebra-molas à frente' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'class RoadPackStore' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadPackStore.java
          grep -q 'api/road_pack.php' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadPackStore.java
          grep -q 'highway\"=\"traffic_signals' api/road_pack.php
          grep -q 'traffic_calming' api/road_pack.php
          grep -q 'toll_booth' api/road_pack.php
          grep -q 'level_crossing' api/road_pack.php
          grep -q 'class DownloadService extends Service' estradaplay-app/app/src/main/java/com/estradaplay/app/DownloadService.java
          grep -q 'class PlayerService extends Service' estradaplay-app/app/src/main/java/com/estradaplay/app/PlayerService.java
          grep -q 'new File(t.localPath)' estradaplay-app/app/src/main/java/com/estradaplay/app/PlayerService.java
          if grep -q 'drive_stream.php\|DriveMediaResolver\|HttpURLConnection' estradaplay-app/app/src/main/java/com/estradaplay/app/PlayerService.java; then
            echo 'Player must remain local-only'; exit 1
          fi
          if grep -R -q 'android.webkit.WebView\|new WebView' estradaplay-app/app/src/main/java; then
            echo 'WebView found in EstradaPlay source'; exit 1
          fi
          if grep -R -q 'com\.musicroad\.ai' estradaplay-app; then
            echo 'Old MusicRoad package leaked into clean EstradaPlay app'; exit 1
          fi

      - name: PHP lint road pack endpoint
        run: php -l api/road_pack.php

      - name: Build EstradaPlay 1.1.0 APK
        working-directory: estradaplay-app
        run: gradle --no-daemon clean assembleDebug

      - name: Upload EstradaPlay 1.1.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: EstradaPlay-1.1.0-offline-road-safety-apk
          path: estradaplay-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
