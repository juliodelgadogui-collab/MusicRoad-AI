# EstradaPlay 1.7.3 — automotive touch compatibility + GPS/radar fixes
name: Build EstradaPlay Native APK

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - 'estradaplay-app/**'
      - 'admin_radares.php'
      - 'api/radar_db.php'
      - 'api/road_hazard_db.php'
      - 'api/road_pack.php'
      - 'api/road_state_pack.php'
      - 'api/road_corridor_pack.php'
      - 'api/road_safety_pack_helpers.php'
      - '.github/scripts/**'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

concurrency:
  group: estradaplay-native-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install fixed signer
        shell: bash
        run: |
          set -e
          base64 -d estradaplay-app/signing/estradaplay-dev.keystore.b64 > estradaplay-app/signing/estradaplay-dev.keystore
          keytool -list -v -keystore estradaplay-app/signing/estradaplay-dev.keystore -storepass android -alias androiddebugkey | tee /tmp/keytool.txt
          grep -q 'C2:D8:8A:15:B1:34:F4:35:DE:9F:B5:32:69:9E:93:FC:D4:6B:C3:59:00:A0:86:57:5F:CB:2B:F7:F2:F6:6F:DB' /tmp/keytool.txt

      - name: Apply compatibility chain
        shell: bash
        run: |
          set -e
          python3 estradaplay-app/tools/apply_151.py
          python3 estradaplay-app/tools/apply_152_alert_fix.py
          python3 estradaplay-app/tools/apply_160_automotive.py
          python3 estradaplay-app/tools/apply_161_stability.py
          python3 estradaplay-app/tools/apply_170_responsive_ui.py
          python3 .github/scripts/apply_171_touch_fix.py
          python3 .github/scripts/apply_172_gps_radar_fix.py
          python3 .github/scripts/apply_173_touch_compat_fix.py

      - name: Verify EstradaPlay 1.7.3
        shell: bash
        run: |
          set -e
          grep -q "versionName '1.7.3'" estradaplay-app/app/build.gradle
          grep -q 'versionCode 15' estradaplay-app/app/build.gradle
          grep -q "applicationId 'com.estradaplay.app'" estradaplay-app/app/build.gradle
          grep -q 'ADAPTIVE_COCKPIT_V170' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'TOUCH_INPUT_V171' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'TOUCH_COMPAT_V173' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'offsetDescendantRectToMyCoords' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'dispatchGenericMotionEvent' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'FLAG_NOT_TOUCHABLE' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'BASE DE ALERTAS VAZIA' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'lastSpeedKmh' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'speedKmh >= 4.0' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          if grep -R -q 'android.webkit.WebView\|new WebView' estradaplay-app/app/src/main/java; then exit 1; fi

      - name: PHP lint server files
        run: |
          php -l admin_radares.php
          php -l api/radar_db.php
          php -l api/road_hazard_db.php
          php -l api/road_pack.php
          php -l api/road_safety_pack_helpers.php
          php -l api/road_state_pack.php
          php -l api/road_corridor_pack.php

      - name: Build EstradaPlay 1.7.3 APK
        working-directory: estradaplay-app
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -e
          APK=estradaplay-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -qi 'c2d88a15b134f435de9fb532699e93fcd46bc35900a086575fcb2bf7f2f66fdb' /tmp/apksigner.txt

      - name: Package 1.7.3 files
        shell: bash
        run: |
          set -e
          rm -rf /tmp/ep173
          mkdir -p /tmp/ep173/api
          cp admin_radares.php /tmp/ep173/
          cp api/radar_db.php /tmp/ep173/api/
          cp api/road_hazard_db.php /tmp/ep173/api/
          cp api/road_pack.php /tmp/ep173/api/
          cp api/road_safety_pack_helpers.php /tmp/ep173/api/
          cp api/road_state_pack.php /tmp/ep173/api/
          cp api/road_corridor_pack.php /tmp/ep173/api/
          cat > /tmp/ep173/LEIA-PRIMEIRO.txt <<'EOF'
          EstradaPlay 1.7.3 — ARQUIVOS DO SERVIDOR
          Extraia na raiz do servidor, sobrescrevendo os arquivos existentes.
          NÃO apague config.php, MariaDB, usuários, músicas ou metadados.
          O servidor é o mesmo conjunto da 1.7.2; a mudança principal da 1.7.3 está no APK e no tratamento de toque da multimídia.
          EOF
          (cd /tmp/ep173 && zip -qr "$GITHUB_WORKSPACE/EstradaPlay-1.7.3-SERVIDOR.zip" .)
          unzip -t EstradaPlay-1.7.3-SERVIDOR.zip
          cp estradaplay-app/app/build/outputs/apk/debug/app-debug.apk EstradaPlay-1.7.3.apk

      - name: Publish EstradaPlay 1.7.3 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="estradaplay-1.7.3-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "EstradaPlay 1.7.3 · toque automotivo" \
            --notes "Corrige toque em centrais Android com tela virtual/compatibility scaling: deixa de comparar rawX/rawY com coordenadas globais, roteia pelos limites locais da janela, amplia a área útil dos botões e aceita entrada de mouse/stylus. Mantém as correções de velocidade e radares da 1.7.2." \
            EstradaPlay-1.7.3.apk \
            EstradaPlay-1.7.3-SERVIDOR.zip
