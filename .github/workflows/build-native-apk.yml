# EstradaPlay 1.3.1 — native redesign + fixed dev signer + offline-first music + state safety base + 250 km travel reserve
name: Build EstradaPlay Native APK

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - 'estradaplay-app/**'
      - 'api/road_pack.php'
      - 'api/road_state_pack.php'
      - 'api/road_corridor_pack.php'
      - 'api/road_safety_pack_helpers.php'
      - '.github/workflows/build-native-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'estradaplay-app/**'
      - 'api/road_pack.php'
      - 'api/road_state_pack.php'
      - 'api/road_corridor_pack.php'
      - 'api/road_safety_pack_helpers.php'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install fixed EstradaPlay development signer
        shell: bash
        run: |
          set -e
          base64 -d estradaplay-app/signing/estradaplay-dev.keystore.b64 > estradaplay-app/signing/estradaplay-dev.keystore
          keytool -list -v -keystore estradaplay-app/signing/estradaplay-dev.keystore -storepass android -alias androiddebugkey | tee /tmp/keytool.txt
          grep -q 'C2:D8:8A:15:B1:34:F4:35:DE:9F:B5:32:69:9E:93:FC:D4:6B:C3:59:00:A0:86:57:5F:CB:2B:F7:F2:F6:6F:DB' /tmp/keytool.txt

      - name: Verify EstradaPlay 1.3.1 native redesign and offline architecture
        shell: bash
        run: |
          set -e
          grep -q "versionName '1.3.1'" estradaplay-app/app/build.gradle
          grep -q 'versionCode 5' estradaplay-app/app/build.gradle
          grep -q "applicationId 'com.estradaplay.app'" estradaplay-app/app/build.gradle
          grep -q "storeFile estradaPlayDevKey" estradaplay-app/app/build.gradle
          grep -q 'android:name=".GateActivity"' estradaplay-app/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_FINE_LOCATION' estradaplay-app/app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="location"' estradaplay-app/app/src/main/AndroidManifest.xml
          grep -q 'EstradaPlay Design System 1.3' estradaplay-app/app/src/main/java/com/estradaplay/app/MainActivity.java
          grep -q 'featureCard' estradaplay-app/app/src/main/java/com/estradaplay/app/MainActivity.java
          grep -q 'Tudo pronto para a estrada' estradaplay-app/app/src/main/java/com/estradaplay/app/MainActivity.java
          grep -q 'BIBLIOTECA OFFLINE' estradaplay-app/app/src/main/java/com/estradaplay/app/MainActivity.java
          grep -q 'COBERTURA OFFLINE' estradaplay-app/app/src/main/java/com/estradaplay/app/MainActivity.java
          grep -q 'Proteção sem precisar abrir rota' estradaplay-app/app/src/main/java/com/estradaplay/app/GateActivity.java
          grep -q 'RESERVE_DISTANCE_M = 250000' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadPackStore.java
          grep -q 'api/road_corridor_pack.php' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadPackStore.java
          grep -q 'api/road_state_pack.php' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadPackStore.java
          grep -q 'prepareTravelReserve' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'reserve_km", 250' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'getLong' estradaplay-app/app/src/main/java/com/estradaplay/app/ApiClient.java
          grep -q "\['SP','RJ','MG','ES'\]" api/road_state_pack.php
          grep -q 'traffic_signals' api/road_safety_pack_helpers.php
          grep -q 'traffic_calming' api/road_safety_pack_helpers.php
          grep -q 'toll_booth' api/road_safety_pack_helpers.php
          grep -q 'level_crossing' api/road_safety_pack_helpers.php
          grep -q 'class DownloadService extends Service' estradaplay-app/app/src/main/java/com/estradaplay/app/DownloadService.java
          grep -q 'class PlayerService extends Service' estradaplay-app/app/src/main/java/com/estradaplay/app/PlayerService.java
          grep -q 'new File(t.localPath)' estradaplay-app/app/src/main/java/com/estradaplay/app/PlayerService.java
          if grep -q 'drive_stream.php\|DriveMediaResolver\|HttpURLConnection' estradaplay-app/app/src/main/java/com/estradaplay/app/PlayerService.java; then
            echo 'Player must remain local-only'; exit 1
          fi
          if grep -R -q 'android.webkit.WebView\|new WebView' estradaplay-app/app/src/main/java; then
            echo 'WebView found in EstradaPlay source'; exit 1
          fi
          if grep -R -q 'com\.musicroad\.ai' estradaplay-app; then
            echo 'Old MusicRoad package leaked into clean EstradaPlay app'; exit 1
          fi

      - name: PHP lint offline safety endpoints
        run: |
          php -l api/road_pack.php
          php -l api/road_safety_pack_helpers.php
          php -l api/road_state_pack.php
          php -l api/road_corridor_pack.php

      - name: Build EstradaPlay 1.3.1 APK
        working-directory: estradaplay-app
        run: gradle --no-daemon clean assembleDebug

      - name: Verify fixed APK signing certificate
        shell: bash
        run: |
          set -e
          APK=estradaplay-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -qi 'c2d88a15b134f435de9fb532699e93fcd46bc35900a086575fcb2bf7f2f66fdb' /tmp/apksigner.txt

      - name: Upload EstradaPlay 1.3.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: EstradaPlay-1.3.1-stable-signer-redesign-apk
          path: estradaplay-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
