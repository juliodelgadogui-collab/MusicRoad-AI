# MusicRoad 2.3.0 DriveOS Automotive — direct Google Drive playback + integrated offline
name: Build MusicRoad Native APK

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - 'android-app-v2/**'
      - 'api/route_fast.php'
      - 'api/route_hazards.php'
      - 'api/drive_stream.php'
      - 'api/drive_helpers.php'
      - '.github/workflows/build-native-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-app-v2/**'
      - 'api/route_fast.php'
      - 'api/route_hazards.php'
      - 'api/drive_stream.php'
      - 'api/drive_helpers.php'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: musicroad-stable-debug-signing-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MusicRoad Stable Debug,O=MusicRoad,C=BR"
          fi

      - name: Verify MusicRoad 2.3.0 native architecture
        shell: bash
        run: |
          set -e
          grep -q "versionName '2.3.0'" android-app-v2/app/build.gradle
          grep -q 'versionCode 47' android-app-v2/app/build.gradle
          grep -q "applicationId 'com.musicroad.ai'" android-app-v2/app/build.gradle
          grep -q 'extends ComponentActivity' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'android:name=".MusicRoadApplication"' android-app-v2/app/src/main/AndroidManifest.xml
          grep -q 'DriveOsShell.init' android-app-v2/app/src/main/java/com/musicroad/ai/MusicRoadApplication.java
          grep -q 'MusicOfflineStore.init' android-app-v2/app/src/main/java/com/musicroad/ai/MusicRoadApplication.java
          grep -q 'NativeAppGuard.start' android-app-v2/app/src/main/java/com/musicroad/ai/MusicRoadApplication.java
          grep -q 'class DriveMediaResolver' android-app-v2/app/src/main/java/com/musicroad/ai/DriveMediaResolver.java
          grep -q 'DRIVE_DIRECT' android-app-v2/app/src/main/java/com/musicroad/ai/DriveMediaResolver.java
          grep -q 'class MusicDirectDownload' android-app-v2/app/src/main/java/com/musicroad/ai/MusicDirectDownload.java
          grep -q 'MusicDirectDownload.start' android-app-v2/app/src/main/java/com/musicroad/ai/NativeAppGuard.java
          grep -q 'Offline integrado' android-app-v2/app/src/main/java/com/musicroad/ai/NativeAppGuard.java
          grep -q 'class MusicOfflineStore' android-app-v2/app/src/main/java/com/musicroad/ai/MusicOfflineStore.java
          grep -q 'preferLocal' android-app-v2/app/src/main/java/com/musicroad/ai/MusicTrack.java
          grep -q 'DriveMediaResolver.resolve' android-app-v2/app/src/main/java/com/musicroad/ai/PlaybackService.java
          grep -q 'DriveMediaResolver.prefetch' android-app-v2/app/src/main/java/com/musicroad/ai/PlaybackService.java
          grep -q 'source_mode' android-app-v2/app/src/main/java/com/musicroad/ai/PlaybackService.java
          grep -q "isset(\$_GET\['resolve'\])" api/drive_stream.php
          grep -q "'transport'=>'google_drive_direct'" api/drive_stream.php
          grep -q 'drive_cached_resolution' api/drive_helpers.php
          grep -q 'static void install(MainActivity a)' android-app-v2/app/src/main/java/com/musicroad/ai/DriveOsShell.java
          grep -q 'FastMapboxRouteEngine' android-app-v2/app/src/main/java/com/musicroad/ai/MainActivity.java
          grep -q 'api/route_fast.php' android-app-v2/app/src/main/java/com/musicroad/ai/FastMapboxRouteEngine.java
          grep -q 'api/route_hazards.php' android-app-v2/app/src/main/java/com/musicroad/ai/FastMapboxRouteEngine.java
          grep -q 'maxspeeds' android-app-v2/app/src/main/java/com/musicroad/ai/FastMapboxRouteEngine.java
          grep -q "'annotations'=>'maxspeed'" api/route_fast.php
          grep -q 'setDrivingMode' android-app-v2/app/src/main/java/com/musicroad/ai/NativeMapView.java
          grep -q 'mediastore-audio-v3-offline-library' android-app-v2/app/src/main/java/com/musicroad/ai/NativeMusicRepository.java
          if grep -q 'String selection = MediaStore.Audio.Media.IS_MUSIC' android-app-v2/app/src/main/java/com/musicroad/ai/NativeMusicRepository.java; then
            echo 'Legacy IS_MUSIC hard filter found'; exit 1
          fi
          grep -q 'BUMP_SEQUENCE_MILESTONES' android-app-v2/app/src/main/java/com/musicroad/ai/NavigationService.java
          if grep -R -q 'android.webkit.WebView\|new WebView' android-app-v2/app/src/main/java; then
            echo 'WebView found in MusicRoad 2.3.0 source'; exit 1
          fi

      - name: PHP lint Drive 2.3 endpoints
        run: |
          php -l api/drive_stream.php
          php -l api/drive_helpers.php

      - name: Build MusicRoad 2.3.0 APK
        working-directory: android-app-v2
        run: gradle --no-daemon clean assembleDebug

      - name: Upload MusicRoad 2.3.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicRoad-AI-native-2.3.0-DriveOS-Automotive-apk
          path: android-app-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
