name: Build MusicRoad Native APK

on:
  push:
    branches:
      - agent/native-apk-build
    paths:
      - 'android-app/**'
      - '.github/workflows/build-native-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: musicroad-stable-debug-signing-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MusicRoad Stable Debug,O=MusicRoad,C=BR"
          fi

      - name: Apply MusicRoad Native 1.4.0 core
        shell: bash
        run: unzip -o android-app/v140-core.zip -d android-app

      - name: Verify MusicRoad Native 1.4.0
        shell: bash
        run: |
          grep -q "versionName '1.4.0'" android-app/app/build.gradle
          grep -q 'versionCode 28' android-app/app/build.gradle
          if grep -R -q 'android.webkit.WebView\|new WebView' android-app/app/src/main/java; then
            echo 'WebView found in native source'; exit 1
          fi
          grep -q 'class NativeMapView extends View' android-app/app/src/main/java/com/musicroad/ai/NativeMapView.java
          grep -q 'MediaStore.Audio.Media' android-app/app/src/main/java/com/musicroad/ai/NativeMusicRepository.java

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicRoad-AI-native-1.4.0-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
