name: Estrada Play Universal 2.0.6 Menu Lateral Corrigido
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_v206_side_menu_fix.py'
      - 'tools/ci_build_epc_v206_side_menu_fix.sh'
      - '.github/workflows/build-estrada-play-universal-v206-side-menu-fix.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v206-side-menu-fix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Generate 2.0.6 side menu source
        run: |
          python3 -m py_compile tools/patch_estrada_play_v206_side_menu_fix.py
          python3 tools/patch_estrada_play_v206_side_menu_fix.py

      - name: Verify 2.0.6 scope
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          grep -q 'versionCode 206' "$APP/app/build.gradle"
          grep -q "versionName '2.0.6'" "$APP/app/build.gradle"
          grep -q 'SIDE_MENU_FIX_V206' "$J/RoadMapActivity.java"
          grep -q 'HORIZONTAL_COCKPIT_V205' "$J/RoadMapActivity.java"
          grep -q 'MUSIC_LIBRARY_NAV_V204' "$J/MusicPlayerActivity.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Persist generated 2.0.6 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app/app/build.gradle \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java
          git commit -m "Generate Universal 2.0.6 Menu Lateral Corrigido [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and validate APK
        run: bash tools/ci_build_epc_v206_side_menu_fix.sh

      - name: Publish 2.0.6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-2.0.6-menu-lateral-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "Estrada Play Comunista Universal 2.0.6 - Menu Lateral Corrigido" \
            --notes "Correção restrita ao menu lateral do cockpit horizontal: barra mais estreita, topo menor, botões com altura fixa e espaçamento compacto, rótulos em uma linha e versão no rodapé. Mapa, painel direito, navegação, música e demais funções permanecem como na 2.0.5. Sem WebView." \
            Estrada-Play-Comunista-Universal-2.0.6-Menu-Lateral-Corrigido.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.0.6-Menu-Lateral-Corrigido
          path: Estrada-Play-Comunista-Universal-2.0.6-Menu-Lateral-Corrigido.apk
          retention-days: 3
          compression-level: 0
