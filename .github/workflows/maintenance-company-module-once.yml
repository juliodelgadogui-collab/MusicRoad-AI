name: One-shot company module wiring

on:
  push:
    branches:
      - agent/estrada-play-comunista
    paths:
      - .github/workflows/maintenance-company-module-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0
      - name: Wire company module without building
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          echo "$PATCH_B64" | base64 -d | python3
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estrada-play-comunista-app/app/src/main/AndroidManifest.xml \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/GateActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MainActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/PremiumAccountActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/CompanyHomeActivity.java \
                  api/native_company.php
          git commit -m 'feat: wire company account routing and fleet history'
          git push origin HEAD:agent/estrada-play-comunista
