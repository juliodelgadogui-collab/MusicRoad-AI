name: Estrada Play Universal 1.7.1 Polished Screens
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - '.github/workflows/build-estrada-play-universal-v171-polish.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Verify polished source is really present
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          M=estrada-play-comunista-app/app/src/main/AndroidManifest.xml
          grep -q "versionName '1.7.1'" "$G"
          grep -q 'versionCode 171' "$G"
          grep -q 'MusicPlayerActivity' "$M"
          grep -q 'Dedicated music surface' "$J/MusicPlayerActivity.java"
          grep -q 'GARAGEM' "$J/VehicleCostActivity.java"
          grep -q 'DADOS DO VEÍCULO' "$J/VehicleCostActivity.java"
          grep -q 'CONTRIBUIÇÃO DA ESTRADA' "$J/RoadReportActivity.java"
          grep -q 'O QUE VOCÊ ENCONTROU' "$J/RoadReportActivity.java"
          grep -q 'HUD_NORMAL_MIGRATION' "$J/DriveSettings.java"
          grep -q 's.edit().putBoolean("hud_mirror",false)' "$J/DriveSettings.java"
          grep -q 'projection.setScaleX' "$J/HudActivity.java"
          grep -q 'CENTRAL DE BORDO' "$J/DriveToolsActivity.java"
          grep -q 'MusicPlayerActivity.class' "$J/RoadMapActivity.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi
          if grep -q 'simple_spinner_dropdown_item' "$J/VehicleCostActivity.java"; then exit 1; fi

      - name: Capture source SHA
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore

      - name: Generate embedded safety voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          test "$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 77

      - name: Build Universal APK
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleUniversalDebug

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          A=estrada-play-comunista-app/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$A"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$A" | tee /tmp/v171.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='171' versionName='1.7.1'" /tmp/v171.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$A" >/tmp/v171-cert.txt
          cp "$A" Estrada-Play-Comunista-Universal-1.7.1-Acabamento.apk
          sha256sum Estrada-Play-Comunista-Universal-1.7.1-Acabamento.apk | tee /tmp/v171-sha.txt

      - name: Publish Universal 1.7.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.7.1-polish-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Estrada Play Comunista Universal 1.7.1 - Acabamento" --notes "Release de acabamento construída diretamente do fonte redesenhado atual. Garante Veículo/Abastecimento em cartões automotivos, Reportar Ponto em seleção por cartões, HUD normal na tela por padrão com espelhamento apenas quando solicitado, player dedicado, Central de Bordo reorganizada, interface Universal vertical/horizontal, sem WebView e sem imagens geradas." Estrada-Play-Comunista-Universal-1.7.1-Acabamento.apk

      - name: Temporary artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Universal-1.7.1-Acabamento
          path: Estrada-Play-Comunista-Universal-1.7.1-Acabamento.apk
          retention-days: 1
          compression-level: 0
