name: EstradaPlay Server Central 500 MB v3

permissions:
  contents: write

on:
  push:
    branches:
      - agent/estrada-play-comunista
    paths:
      - 'api/server_intelligent.php'
      - 'api/server_status.php'
      - 'api/road_reports.php'
      - 'api/cron_drive_sync.php'
      - 'admin_reports.php'
      - 'tools/patch_server_central_v3.py'
      - '.github/workflows/server-central-v3-release.yml'
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Integrate Server Central v3
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_server_central_v3.py
          python3 tools/patch_server_central_v3.py

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            api/bootstrap.php \
            api/server_500mb.php \
            api/server_intelligent.php \
            api/native_auth.php \
            api/native_library_sync.php \
            api/native_app.php \
            api/google_drive_public.php \
            api/cron_drive_sync.php \
            api/road_reports.php \
            api/server_status.php \
            api/radars.php \
            api/radar_db.php \
            api/road_pack.php \
            api/road_corridor_pack.php \
            api/road_state_pack.php \
            api/offline_state.php \
            api/road_safety_pack_helpers.php \
            api/road_hazard_db.php \
            admin.php admin_server.php admin_reports.php; do
              php -l "$f"
          done

      - name: Validate v3 architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SERVER_500MB_V3' api/server_500mb.php
          grep -q "server_version'=>'500MB-v3'" api/server_500mb.php
          grep -q "ESTRADAPLAY_SERVER_INTELLIGENT_VERSION = '500MB-v3'" api/server_intelligent.php
          grep -q 'road_reports' api/server_intelligent.php
          grep -q 'native_require_json_user' api/road_reports.php
          grep -q 'duplicate' api/road_reports.php
          grep -q 'intelligent_server_housekeeping' api/cron_drive_sync.php
          grep -q 'Reportes da Estrada' admin_server.php
          grep -q 'Reportes da Estrada' admin_reports.php
          grep -q 'offline_state_packs' api/server_intelligent.php
          grep -q 'native_restore_user_from_request' api/road_pack.php
          grep -q 'native_restore_user_from_request' api/road_corridor_pack.php
          grep -q 'native_restore_user_from_request' api/road_state_pack.php
          grep -q 'native_restore_user_from_request' api/offline_state.php
          grep -q 'native_restore_user_from_request' api/radars.php

      - name: Commit integrated server source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/server_500mb.php api/road_pack.php api/road_corridor_pack.php api/road_state_pack.php api/offline_state.php api/radars.php admin_server.php
          git commit -m "Integrate Server Central 500 MB v3 [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Package server only
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/estradaplay-server-v3
          rm -rf "$OUT"
          mkdir -p "$OUT/api"
          for f in \
            bootstrap.php server_500mb.php server_intelligent.php native_auth.php \
            native_library_sync.php native_app.php google_drive_public.php cron_drive_sync.php \
            road_reports.php server_status.php radars.php radar_db.php road_pack.php \
            road_corridor_pack.php road_state_pack.php offline_state.php \
            road_safety_pack_helpers.php road_hazard_db.php; do
              cp "api/$f" "$OUT/api/$f"
          done
          cp admin.php admin_server.php admin_reports.php "$OUT/"
          cat > "$OUT/LEIA-PRIMEIRO.txt" <<'TXT'
          EstradaPlay - Central do Servidor 500 MB v3

          SOMENTE SERVIDOR. Nao contem APK, audio, video, mapas offline nem config.php.
          Extraia na RAIZ da instalacao atual e sobrescreva os arquivos incluidos.
          Nao apague config/config.php nem o banco existente.

          Depois da instalacao:
          1. Entre em /admin_server.php
          2. Abra /admin_reports.php para revisar reportes da estrada
          3. Mantenha o cron existente de /api/cron_drive_sync.php?key=...
          4. O mesmo cron agora tambem executa limpeza leve de reportes e logs

          O servidor permanece metadata-only: musicas ficam no Google Drive e videos/dashcam ficam apenas no aparelho.
          RJ, MG e ES sao os estados-base usados pela versao inteligente do aplicativo.
          TXT
          cd "$OUT"
          zip -qr "$GITHUB_WORKSPACE/EstradaPlay-SERVIDOR-500MB-CENTRAL-v3.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -l EstradaPlay-SERVIDOR-500MB-CENTRAL-v3.zip | tee /tmp/server-files.txt
          if grep -Ei '\.(apk|mp3|wav|mp4|mkv|mbtiles|pmtiles)$|config\.php$' /tmp/server-files.txt; then
            echo 'Pacote contem arquivo proibido' >&2
            exit 1
          fi
          sha256sum EstradaPlay-SERVIDOR-500MB-CENTRAL-v3.zip | tee /tmp/server-sha.txt

      - name: Publish Server Central v3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estradaplay-server-central-v3-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "EstradaPlay - Central do Servidor 500 MB v3" \
            --notes "Servidor consolidado para Estrada Play Comunista 1.4.0. Continua metadata-only e adequado ao host de 500 MB: nenhum audio, video, APK ou mapa pesado e armazenado. Adiciona fila de reportes da estrada com deduplicacao, painel administrativo de confirmacao/rejeicao, status autenticado do servidor, limpeza automatica no cron e autenticacao nativa resiliente para os endpoints de radar/pacotes offline. Inclui endpoints de RJ/MG/ES, catalogo do Google Drive e diagnostico central. Instalar extraindo o ZIP na raiz da instalacao atual; config.php e banco nao sao incluidos nem apagados." \
            EstradaPlay-SERVIDOR-500MB-CENTRAL-v3.zip

      - name: Temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: EstradaPlay-SERVIDOR-500MB-CENTRAL-v3
          path: EstradaPlay-SERVIDOR-500MB-CENTRAL-v3.zip
          retention-days: 1
          compression-level: 0
