name: Build EstradaPlay 2.x Direct

permissions:
  contents: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - 'estradaplay-app-v2/**'
      - '.github/workflows/build-estradaplay-v2.yml'
  workflow_dispatch:

concurrency:
  group: estradaplay-v2-direct
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signer
        shell: bash
        run: |
          set -euo pipefail
          base64 -d estradaplay-app-v2/signing/estradaplay-dev.keystore.b64 > estradaplay-app-v2/signing/estradaplay-dev.keystore

      - name: Generate embedded EstradaPlay voice
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 \
            -o "$MODEL" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "439e3a5f55a43ed70f918492acf5729dd35dde2d61a6c7956f04a8eee1f2c51f  $MODEL" | sha256sum -c -
          rm -rf /tmp/estradaplay-voice
          mkdir -p /tmp/estradaplay-voice
          tar -xjf "$MODEL" -C /tmp/estradaplay-voice
          python3 estradaplay-app-v2/tools/generate_voice_bank.py \
            --model-root /tmp/estradaplay-voice \
            --output estradaplay-app-v2/app/src/main/res/raw \
            --metadata-output estradaplay-app-v2/app/src/main/assets/estradaplay_voice
          test "$(find estradaplay-app-v2/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 70

      - name: Verify source architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '2." estradaplay-app-v2/app/build.gradle
          grep -q 'android:resizeableActivity="true"' estradaplay-app-v2/app/src/main/AndroidManifest.xml
          if grep -q 'sensorLandscape' estradaplay-app-v2/app/src/main/AndroidManifest.xml; then exit 1; fi
          if grep -R -q 'android.webkit.WebView\|new WebView' estradaplay-app-v2/app/src/main/java; then exit 1; fi
          grep -q 'AUTOMOTIVE_INPUT_V177' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'OSM_DIRECT_RADARS_V200' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadPackStore.java
          grep -q 'OSM_DIRECT_MAP_V200' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/OfflineRoadStore.java
          grep -q 'ANR_GUARD_V201' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'ROAD_LIMIT_V202' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'OFFLINE_VOICE_V204' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/EstradaPlayOfflineVoice.java
          grep -q 'OFFLINE_VOICE_V204' estradaplay-app-v2/tools/generate_voice_bank.py
          if grep -q "versionName '2.0.4'" estradaplay-app-v2/app/build.gradle; then
            grep -q 'OFFLINE_VOICE_V204' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
            test -s estradaplay-app-v2/app/src/main/res/raw/ep_radar_frente.wav
            test -s estradaplay-app-v2/app/src/main/res/raw/ep_limite_via.wav
            test -s estradaplay-app-v2/app/src/main/res/raw/ep_speed_060.wav
          fi

      - name: Build APK directly
        working-directory: estradaplay-app-v2
        run: gradle --no-daemon clean assembleDebug

      - name: Verify signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK=estradaplay-app-v2/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi 'c2d88a15b134f435de9fb532699e93fcd46bc35900a086575fcb2bf7f2f66fdb' /tmp/cert.txt
          VERSION=$(grep -o "versionName '[^']*'" estradaplay-app-v2/app/build.gradle | head -1 | cut -d"'" -f2)
          cp "$APK" "EstradaPlay-${VERSION}.apk"
          sha256sum "EstradaPlay-${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Try temporary artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: EstradaPlay-${{ env.VERSION }}-APK
          path: EstradaPlay-${{ env.VERSION }}.apk
          retention-days: 1
          compression-level: 0

      - name: Publish direct-build release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estradaplay-${VERSION}-direct-${GITHUB_RUN_NUMBER}"
          NOTES="Compilado diretamente de estradaplay-app-v2, sem aplicar patches da série 1.x."
          if [ "$VERSION" = "2.0.1" ]; then
            NOTES="Hotfix do ANR visto no Android: remove leitura/parse de GeoJSON grande do caminho principal do GPS, reduz trabalho repetitivo do serviço e limita o mapa OSM de emergência para centrais mais fracas. Mantém toque, velocidade, radares, música e suporte horizontal/vertical da 2.0."
          fi
          if [ "$VERSION" = "2.0.4" ]; then
            NOTES="Versão de teste com voz EstradaPlay embarcada e offline: o banco pt-BR é sintetizado no build e os alertas reproduzem os mesmos áudios em qualquer central. Android TTS fica apenas como fallback para valores não previstos. Mantém limite da via, limite do radar, aviso único de excesso, correção de ANR, toque e horizontal/vertical."
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "EstradaPlay ${VERSION} · build direto" \
            --notes "$NOTES" \
            "EstradaPlay-${VERSION}.apk"
