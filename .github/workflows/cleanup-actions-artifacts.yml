name: Limpeza automática de Artifacts

on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - '.github/workflows/cleanup-actions-artifacts.yml'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Apagar artifacts com mais de quantas horas? Use 0 para apagar todos.'
        required: false
        default: '12'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-artifacts
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_AGE_HOURS: ${{ inputs.max_age_hours || '12' }}
    steps:
      - name: Apagar Artifacts antigos
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$MAX_AGE_HOURS" =~ ^[0-9]+$ ]]; then
            echo "max_age_hours inválido: $MAX_AGE_HOURS"
            exit 1
          fi

          cutoff=$(date -u -d "$MAX_AGE_HOURS hours ago" +%s)
          total=0
          deleted=0
          kept=0

          while IFS=$'\t' read -r id name created_at; do
            [ -z "${id:-}" ] && continue
            total=$((total + 1))
            created_epoch=$(date -u -d "$created_at" +%s)

            if [ "$created_epoch" -le "$cutoff" ]; then
              echo "Apagando: $name (id=$id, criado=$created_at)"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              deleted=$((deleted + 1))
            else
              kept=$((kept + 1))
            fi
          done < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .name, .created_at] | @tsv')

          echo "Artifacts encontrados: $total"
          echo "Artifacts apagados: $deleted"
          echo "Artifacts mantidos: $kept"
          echo "Regra: apagar artifacts com mais de $MAX_AGE_HOURS hora(s)."
