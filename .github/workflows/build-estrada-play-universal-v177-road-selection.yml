name: Estrada Play Universal 1.7.7 Road Selection
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_road_selection_v177.py'
      - '.github/workflows/build-estrada-play-universal-v177-road-selection.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Apply 1.7.7 road selection fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_estrada_play_road_selection_v177.py
          python3 tools/patch_estrada_play_road_selection_v177.py

      - name: Verify road selection source
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          grep -q "versionName '1.7.7'" "$G"
          grep -q 'versionCode 177' "$G"
          grep -q 'ROAD_SELECTION_V177' "$J/RoadRadioActivity.java"
          grep -q 'MANUAL_ROAD_OVERRIDE_V177' "$J/RoadRadioService.java"
          grep -q 'selected_road' "$J/RoadRadioService.java"
          grep -q 'USAR IDENTIFICAÇÃO AUTOMÁTICA' "$J/RoadRadioActivity.java"
          grep -q 'ALTERAR RODOVIA' "$J/RoadRadioActivity.java"
          grep -q 'SP-330' "$J/KnownRoadCatalog.java"
          grep -q 'static void clear' "$J/KnownRoadCatalog.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Commit generated 1.7.7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app
          git commit -m "Generate Universal 1.7.7 road selection fix [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore

      - name: Generate embedded safety voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          test "$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 77

      - name: Build Universal APK
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleUniversalDebug

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          A=estrada-play-comunista-app/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$A"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$A" | tee /tmp/v177.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='177' versionName='1.7.7'" /tmp/v177.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$A" | tee /tmp/v177-cert.txt
          cp "$A" Estrada-Play-Comunista-Universal-1.7.7-Selecao-Rodovia.apk
          sha256sum Estrada-Play-Comunista-Universal-1.7.7-Selecao-Rodovia.apk | tee /tmp/v177-sha.txt

      - name: Publish Universal 1.7.7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.7.7-road-selection-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "Estrada Play Comunista Universal 1.7.7 - Seleção de Rodovia" \
            --notes "Corrige a seleção manual de rodovia no Rádio da Rodovia. A escolha agora permanece visível, tem prioridade real sobre a identificação automática e continua ativa até o motorista selecionar novamente o modo automático. O painel marca a rodovia atual, permite voltar à identificação automática e amplia o catálogo local com rodovias de SP além de MG/RJ/ES e BRs. Sem alteração no servidor e sem WebView." \
            Estrada-Play-Comunista-Universal-1.7.7-Selecao-Rodovia.apk

      - name: Temporary artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Universal-1.7.7-Selecao-Rodovia
          path: Estrada-Play-Comunista-Universal-1.7.7-Selecao-Rodovia.apk
          retention-days: 1
          compression-level: 0
