name: EPC Domínio Público 2.3.9 Página Abrir App
permissions:
  contents: read
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'public-domain/**'
      - '.github/workflows/package-epc-public-domain.yml'
  workflow_dispatch:

concurrency:
  group: epc-public-domain-v239
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
      - name: Validate public landing pages
        shell: bash
        run: |
          set -euo pipefail
          test -f public-domain/index.php
          test -f public-domain/convoy_invite.php
          test -f public-domain/.htaccess
          grep -q 'EPC_PUBLIC_HOME_V239' public-domain/index.php
          grep -q 'estradaplay://comboio' public-domain/index.php
          grep -q 'EPC_CONVOY_PUBLIC_PAGE_V239' public-domain/convoy_invite.php
          grep -q 'ENTRAR NO COMBOIO' public-domain/convoy_invite.php
          grep -q '^RewriteRule \^c/' public-domain/.htaccess
          php -l public-domain/index.php
          php -l public-domain/convoy_invite.php
      - name: Package public domain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          cp public-domain/index.php package/index.php
          cp public-domain/convoy_invite.php package/convoy_invite.php
          cp public-domain/.htaccess package/.htaccess
          cat > package/LEIA-ME.txt <<'EOF'
          ESTRADA PLAY — DOMÍNIO PÚBLICO 2.3.9

          Destino: raiz pública de xn--gesto-dra.store.

          Arquivos:
          - index.php: página principal com botão ABRIR ESTRADA PLAY.
          - convoy_invite.php: página de convite /c/CODIGO com botão ENTRAR NO COMBOIO.
          - .htaccess: HTTPS + rota /c/CODIGO.

          Não usa banco de dados e não altera a API interna.

          IMPORTANTE: se já existir .htaccess, faça backup e mescle as regras em vez de substituir cegamente.
          EOF
          (cd package && zip -r ../Estrada-Play-DOMINIO-PUBLICO-2.3.9-PAGINA-ABRIR-APP.zip .)
          sha256sum Estrada-Play-DOMINIO-PUBLICO-2.3.9-PAGINA-ABRIR-APP.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-DOMINIO-PUBLICO-2.3.9-PAGINA-ABRIR-APP
          path: Estrada-Play-DOMINIO-PUBLICO-2.3.9-PAGINA-ABRIR-APP.zip
          retention-days: 14
