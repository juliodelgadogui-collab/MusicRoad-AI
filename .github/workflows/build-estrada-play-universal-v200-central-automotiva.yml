name: Estrada Play Universal 2.0.0 Central Automotiva
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_v200_central_automotiva.py'
      - 'tools/patch_estrada_play_v200_compile_fix.py'
      - 'tools/ci_build_epc_v200.sh'
      - '.github/workflows/build-estrada-play-universal-v200-central-automotiva.yml'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/EpcBackdropView.java'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v200
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Generate 2.0.0 visual source
        run: |
          python3 -m py_compile tools/patch_estrada_play_v200_central_automotiva.py tools/patch_estrada_play_v200_compile_fix.py
          python3 tools/patch_estrada_play_v200_central_automotiva.py
          python3 tools/patch_estrada_play_v200_compile_fix.py

      - name: Verify Central Automotiva architecture
        run: |
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          grep -q "versionName '2.0.0'" "$G"
          grep -q 'versionCode 200' "$G"
          grep -q 'AUTOMOTIVE_RED_GOLD_V200' "$J/EpcBackdropView.java"
          grep -q 'AUTOMOTIVE_RED_GOLD_V200_HOME' "$J/MainActivity.java"
          grep -q 'CENTRAL AUTOMOTIVA' "$J/MainActivity.java"
          grep -q 'AUTOMOTIVE_RED_GOLD_V200_CENTRAL' "$J/DriveToolsActivity.java"
          grep -q 'AUTOMOTIVE_RED_GOLD_V200_NAV' "$J/RoadMapActivity.java"
          grep -q 'RÁDIO PTT' "$J/DriveToolsActivity.java"
          grep -q 'CLIMA' "$J/DriveToolsActivity.java"
          grep -q 'OBD2' "$J/DriveToolsActivity.java"
          grep -q 'EstradaVivaActivity' "$J/DriveToolsActivity.java"
          grep -q 'VOICE_FULL_ALERT_V192' "$J/EstradaPlayOfflineVoice.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Persist generated 2.0.0 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app/app/build.gradle \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MainActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/DriveToolsActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/EpcBackdropView.java
          git commit -m "Generate Universal 2.0.0 Central Automotiva [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and validate APK
        run: bash tools/ci_build_epc_v200.sh

      - name: Publish 2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="estrada-play-comunista-2.0.0-central-automotiva-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "Estrada Play Comunista Universal 2.0.0 - Central Automotiva" \
            --notes "Grande atualizacao visual nativa do EPC. Home com hierarquia de central multimidia, Central de Bordo reorganizada e navegacao com mapa dominante, orientacao no topo, velocidade/limite destacados e atalhos laterais. Mantem Clima da Rota, voz de alertas completos, Estrada Viva, Comboio, OBD2, SOS, offline, radio PTT, HUD, dashcam e demais funcoes. Sem WebView e sem usar a imagem de referencia como wallpaper." \
            Estrada-Play-Comunista-Universal-2.0.0-Central-Automotiva.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.0.0-Central-Automotiva
          path: Estrada-Play-Comunista-Universal-2.0.0-Central-Automotiva.apk
          retention-days: 3
          compression-level: 0
