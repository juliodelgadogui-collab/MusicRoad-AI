name: Build Estrada Play 5.2.0 Once

on:
  push:
    branches:
      - agent/estrada-play-comunista-cleanup-staging
    paths:
      - '.github/workflows/build-520-once.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical Android source
        shell: bash
        run: |
          set -euo pipefail
          test -f estrada-play-comunista-app/settings.gradle
          test -f estrada-play-comunista-app/app/build.gradle
          for retired in android-app android-app-v2 estradaplay-app estradaplay-app-v2; do
            if [ -e "$retired" ]; then
              echo "Base Android aposentada voltou para a árvore: $retired"
              exit 1
            fi
          done

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable candidate signing key
        id: candidate-key
        uses: actions/cache@v4
        with:
          path: estrada-play-comunista-app/signing/estradaplay-dev.keystore
          key: estradaplay-universal-candidate-keystore-v1

      - name: Create candidate signing key once
        if: steps.candidate-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p estrada-play-comunista-app/signing
          keytool -genkeypair -v \
            -keystore estrada-play-comunista-app/signing/estradaplay-dev.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Estrada Play Stable Candidate,O=Estrada Play,C=BR"

      - name: Unit tests
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon --stacktrace testUniversalDebugUnitTest

      - name: Strict Android lint
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon --stacktrace lintUniversalDebug

      - name: Compile Universal candidate
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon --stacktrace assembleUniversalCandidate

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-5.2.0-UNIVERSAL
          path: estrada-play-comunista-app/app/build/outputs/apk/universal/candidate/*.apk
          if-no-files-found: error
          retention-days: 7
