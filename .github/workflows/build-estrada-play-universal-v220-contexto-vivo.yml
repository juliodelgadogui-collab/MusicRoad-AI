name: Estrada Play Universal 2.2.0 Contexto Vivo
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/EstradaPlayApplication.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RouteContextV7BackgroundReceiver.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RouteContextV7BackgroundPolicy.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RouteContextV7Cache.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/HudActivity.java'
      - 'estrada-play-comunista-app/app/src/main/AndroidManifest.xml'
      - 'estrada-play-comunista-app/app/src/test/**'
      - 'estrada-play-comunista-app/app/build.gradle'
      - 'tools/ci_build_epc_v220_contexto_vivo.sh'
      - '.github/workflows/build-estrada-play-comunista*.yml'
      - '.github/workflows/build-estrada-play-portable*.yml'
      - '.github/workflows/build-estrada-play-universal-v*.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v220-contexto-vivo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Verify direct-source architecture
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          grep -q 'versionCode 220' "$APP/app/build.gradle"
          grep -q "versionName '2.2.0'" "$APP/app/build.gradle"
          grep -q 'CONTEXTO_VIVO_V220' "$J/EstradaPlayApplication.java"
          grep -q 'CONTEXTO_VIVO_V220' "$J/RouteContextV7BackgroundReceiver.java"
          grep -q 'CONTEXTO_VIVO_V220' "$J/RouteContextV7Cache.java"
          grep -q 'CONTEXTO_VIVO_V220' "$J/HudActivity.java"
          grep -q 'BASE_CONSOLIDADA_V210' "$J/RoadSafetyService.java"
          grep -q 'CONTEXTO_INTELIGENTE_V209' "$J/RouteContextV7Client.java"
          grep -q 'android:name=".EstradaPlayApplication"' "$APP/app/src/main/AndroidManifest.xml"

          forbidden=(
            tools/patch_estrada_play_v208_navigation_real.py
            tools/fix_epc_v208_navigation_strings.py
            tools/ci_build_epc_v208_navigation_real.sh
            tools/patch_estrada_play_v209_context_inteligente.py
            tools/ci_build_epc_v209_context_inteligente.sh
            tools/migrate_epc_v210_base_consolidada.py
            .github/workflows/build-estrada-play-universal-v208-navigation-real.yml
            .github/workflows/build-estrada-play-universal-v209-contexto-inteligente.yml
            .github/workflows/build-estrada-play-universal-v210-base-consolidada.yml
          )
          for legacy in "${forbidden[@]}"; do
            if [ -e "$legacy" ]; then
              echo "Legacy EPC build path returned: $legacy"
              exit 1
            fi
          done

          legacy_workflows="$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'build-estrada-play-comunista*.yml' \
               -o -name 'build-estrada-play-portable*.yml' \
               -o -name 'build-estrada-play-universal-v*.yml' \) \
            ! -name 'build-estrada-play-universal-v220-contexto-vivo.yml' -print)"
          if [ -n "$legacy_workflows" ]; then
            echo 'Obsolete EPC Android workflow detected:'
            printf '%s\n' "$legacy_workflows"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Production signing readiness
        env:
          KEYSTORE_B64: ${{ secrets.ESTRADAPLAY_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo 'SIGNING_STATUS=production-ready' >> "$GITHUB_ENV"
          else
            echo 'SIGNING_STATUS=development-test' >> "$GITHUB_ENV"
          fi

      - name: Unit tests, build and validate 2.2.0
        run: bash tools/ci_build_epc_v220_contexto_vivo.sh

      - name: Publish 2.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-2.2.0-contexto-vivo-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Estrada Play Comunista Universal 2.2.0 - Contexto Vivo" \
            --notes "Contexto Vivo mantém um snapshot autenticado do Server 7.0 enquanto o núcleo GPS está ativo, mesmo fora do mapa. O bridge é registrado no processo do app, respeita modo offline, usa cadência adaptativa e persiste somente o contexto agregado. O HUD passa a combinar trânsito/clima/eventos Server 7.0 com a proteção local, mantendo radar e risco local sempre como prioridade. A base 2.1.0 consolidada, Navegação Real 2.0.8, Segurança 2.0.7 e Contexto Inteligente 2.0.9 permanecem preservados. Build nativo direto do fonte, sem WebView e sem gerador de patch. Signing: ${SIGNING_STATUS}." \
            Estrada-Play-Comunista-Universal-2.2.0-Contexto-Vivo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.2.0-Contexto-Vivo
          path: Estrada-Play-Comunista-Universal-2.2.0-Contexto-Vivo.apk
          retention-days: 3
          compression-level: 0
