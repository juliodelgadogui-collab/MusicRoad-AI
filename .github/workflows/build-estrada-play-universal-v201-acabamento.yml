name: Estrada Play Universal 2.0.1 Acabamento Automotivo
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_v201_polish.py'
      - 'tools/patch_estrada_play_v201_fix.py'
      - 'tools/patch_estrada_play_v201_idempotent.py'
      - 'tools/patch_estrada_play_v201_route_fix.py'
      - 'tools/ci_build_epc_v201.sh'
      - '.github/workflows/build-estrada-play-universal-v201-acabamento.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v201
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Generate 2.0.1 polish source
        run: |
          python3 -m py_compile tools/patch_estrada_play_v201_polish.py tools/patch_estrada_play_v201_fix.py tools/patch_estrada_play_v201_idempotent.py tools/patch_estrada_play_v201_route_fix.py
          python3 tools/patch_estrada_play_v201_polish.py
          python3 tools/patch_estrada_play_v201_fix.py
          python3 tools/patch_estrada_play_v201_idempotent.py
          python3 tools/patch_estrada_play_v201_route_fix.py

      - name: Verify automotive polish architecture
        run: |
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          grep -q "versionName '2.0.1'" "$G"
          grep -q 'versionCode 201' "$G"
          grep -q 'NAV_POLISH_V201' "$J/RouteEngine.java"
          grep -q 'nextDistanceM' "$J/RouteEngine.java"
          grep -q 'new Maneuver(action,road,type,modifier,type.equals' "$J/RouteEngine.java"
          if grep -q 'new Maneuver(action,road,type,modifier,before,type.equals' "$J/RouteEngine.java"; then exit 1; fi
          grep -q 'navDistanceText' "$J/RoadMapActivity.java"
          grep -q 'navEtaText' "$J/RoadMapActivity.java"
          grep -q 'mapPlayerToggle' "$J/RoadMapActivity.java"
          test "$(grep -c 'private final BroadcastReceiver playerReceiver' "$J/RoadMapActivity.java")" -eq 1
          test "$(grep -c 'NAV_POLISH_V201 helpers' "$J/RoadMapActivity.java")" -eq 1
          test "$(grep -c 'private final View nightTint' "$J/RoadMapView.java")" -eq 1
          grep -q 'ALERT_CARD_V201' "$J/SafetyAlertOverlay.java"
          grep -q 'class EpcMotion' "$J/EpcMotion.java"
          grep -q '#ff3048' "$J/RoadMapView.java"
          grep -q 'VOICE_FULL_ALERT_V192' "$J/EstradaPlayOfflineVoice.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Persist generated 2.0.1 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app/app/build.gradle \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MainActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/DriveToolsActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapView.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RouteEngine.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/SafetyAlertOverlay.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/EpcMotion.java
          git commit -m "Generate Universal 2.0.1 Acabamento Automotivo [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and validate APK
        run: bash tools/ci_build_epc_v201.sh

      - name: Publish 2.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="estrada-play-comunista-2.0.1-acabamento-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "Estrada Play Comunista Universal 2.0.1 - Acabamento Automotivo" \
            --notes "Refino da Central Automotiva 2.0: navegacao separa distancia, manobra e via; ETA, distancia restante e duracao ficam no mapa; velocimetro reage ao excesso; rota vermelha mais forte; mapa recebe tratamento noturno; alertas deixam de bloquear a tela e viram cards contextuais; player offline passa a ter anterior/play-pausa/proxima no cockpit; clima permanece integrado; transicoes curtas nativas em Home, Central e mapa. Mantem todas as funcoes da 2.0.0, voz completa e sem WebView." \
            Estrada-Play-Comunista-Universal-2.0.1-Acabamento-Automotivo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.0.1-Acabamento-Automotivo
          path: Estrada-Play-Comunista-Universal-2.0.1-Acabamento-Automotivo.apk
          retention-days: 3
          compression-level: 0
