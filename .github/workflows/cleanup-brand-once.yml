name: One-shot legacy notification cleanup

on:
  push:
    branches:
      - agent/estrada-play-comunista
    paths:
      - .github/workflows/cleanup-brand-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0
      - name: Replace retired visible brand in notifications
        run: |
          set -euo pipefail
          files=(
            estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/PlayerService.java
            estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/DownloadService.java
          )
          for f in "${files[@]}"; do
            sed -i 's/Estrada Play Comunista/Estrada Play/g' "$f"
          done
          git diff --check
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'fix: remove legacy brand from service notifications'
          git push origin HEAD:agent/estrada-play-comunista
