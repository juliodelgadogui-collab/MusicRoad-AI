name: Build Estrada Play Comunista

on:
  push:
    branches:
      - agent/estrada-play-comunista
    paths:
      - 'estrada-play-comunista-app/**'
      - '.github/workflows/build-estrada-play-comunista.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-universal-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Universal release APK
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon --stacktrace assembleUniversalRelease

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-Universal-release
          path: estrada-play-comunista-app/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 3
