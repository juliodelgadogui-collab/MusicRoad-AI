name: Build Estrada Play Comunista Universal

on:
  push:
    branches:
      - agent/estrada-play-comunista
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: 'Executar smoke tests em emulador Android'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  universal-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable candidate signing key
        id: candidate-key
        uses: actions/cache@v4
        with:
          path: estrada-play-comunista-app/signing/estradaplay-dev.keystore
          key: estradaplay-universal-candidate-keystore-v1

      - name: Create candidate signing key once
        if: steps.candidate-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p estrada-play-comunista-app/signing
          keytool -genkeypair -v \
            -keystore estrada-play-comunista-app/signing/estradaplay-dev.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Estrada Play Stable Candidate,O=Estrada Play,C=BR"

      - name: Unit tests
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon --stacktrace testUniversalDebugUnitTest

      - name: Strict Android lint
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon --stacktrace lintUniversalDebug

      - name: Compile Universal candidate
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon --stacktrace assembleUniversalCandidate

      - name: Enable KVM
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_device_tests }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Device smoke tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_device_tests }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd estrada-play-comunista-app && gradle --no-daemon connectedUniversalDebugAndroidTest

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-4.1.3-UNIVERSAL
          path: estrada-play-comunista-app/app/build/outputs/apk/universal/candidate/*.apk
          if-no-files-found: error
          retention-days: 7
