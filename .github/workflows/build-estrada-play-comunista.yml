name: Build Estrada Play Comunista

on:
  workflow_dispatch:
  push:
    branches:
      - agent/estrada-play-comunista

permissions:
  contents: read

jobs:
  build-universal-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create temporary debug keystore
        run: |
          mkdir -p estrada-play-comunista-app/signing
          keytool -genkeypair -v \
            -keystore estrada-play-comunista-app/signing/estradaplay-dev.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Compile signed Universal debug APK
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon --stacktrace assembleUniversalDebug

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-Universal-INSTALAVEL
          path: estrada-play-comunista-app/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 3
