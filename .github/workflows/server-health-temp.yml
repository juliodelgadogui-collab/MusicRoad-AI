name: Server health temporary

on:
  push:
    branches:
      - agent/estrada-play-comunista
    paths:
      - '.github/workflows/server-health-temp.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect client links and preview host
        shell: bash
        run: |
          set +e
          echo '===== eventmenu root (diagnostic only, certificate mismatch bypassed) ====='
          curl -k -sS -L --max-time 15 --connect-timeout 8 \
            https://eventmenu.atwebpages.com/ -o /tmp/root.html || true
          echo "size=$(wc -c </tmp/root.html 2>/dev/null || echo 0)"
          head -c 3000 /tmp/root.html 2>/dev/null || true
          echo
          echo '===== absolute URLs found ====='
          grep -Eo 'https?://[^"'"'"' <>)]+' /tmp/root.html 2>/dev/null | sort -u | head -100 || true
          echo
          echo '===== likely API/server terms ====='
          grep -Eio '.{0,90}(api|server|native_app|musicroad|estradaplay).{0,140}' /tmp/root.html 2>/dev/null | head -80 || true
          echo
          echo '===== valid certificate hostname ====='
          for path in / /api/ping.php '/api/native_app.php?action=session'; do
            echo "--- https://f28-preview.runhosting.com$path ---"
            curl -sS -D - -L --max-time 15 --connect-timeout 8 \
              "https://f28-preview.runhosting.com$path" -o /tmp/preview.txt || true
            head -c 1200 /tmp/preview.txt 2>/dev/null || true
            echo
          done
