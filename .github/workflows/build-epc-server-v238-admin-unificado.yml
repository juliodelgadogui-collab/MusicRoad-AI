name: EPC Server 2.3.8 Admin Unificado
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'admin_central.php'
      - 'login.php'
      - 'index.php'
      - 'admin_official_data_cleanup.php'
      - 'diagnostico_estradaplay_209.php'
      - 'api/official_data_policy.php'
      - 'api/server_context_v7.php'
      - '.github/workflows/build-epc-server-v238-admin-unificado.yml'
  workflow_dispatch:

concurrency:
  group: epc-server-v238-admin-unificado
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Validate unified administration
        shell: bash
        run: |
          set -euo pipefail
          php -l admin_central.php
          php -l login.php
          php -l index.php
          php -l admin.php
          php -l admin_epc.php
          php -l admin_auth_diagnostics.php
          php -l admin_collective.php
          php -l admin_devices.php
          php -l admin_official_data_cleanup.php
          php -l admin_radares.php
          php -l admin_radio.php
          php -l admin_reports.php
          php -l admin_server.php
          php -l diagnostico_estradaplay_209.php
          php -l api/official_data_policy.php
          php -l api/server_context_v7.php
          grep -q 'ADMINISTRAÇÃO UNIFICADA' admin_central.php
          grep -q 'admin_official_data_cleanup.php' admin_central.php
          grep -q 'admin_auth_diagnostics.php' admin_central.php
          grep -q 'admin_central.php' login.php
          grep -q 'admin_central.php' index.php

      - name: Package unified admin server update
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/epc-v238
          mkdir -p /tmp/epc-v238/api /tmp/epc-v238/assets/css /tmp/epc-v238/assets/js
          cp admin_central.php /tmp/epc-v238/
          cp admin.php /tmp/epc-v238/
          cp admin_epc.php /tmp/epc-v238/
          cp admin_auth_diagnostics.php /tmp/epc-v238/
          cp admin_collective.php /tmp/epc-v238/
          cp admin_devices.php /tmp/epc-v238/
          cp admin_official_data_cleanup.php /tmp/epc-v238/
          cp admin_radares.php /tmp/epc-v238/
          cp admin_radio.php /tmp/epc-v238/
          cp admin_reports.php /tmp/epc-v238/
          cp admin_server.php /tmp/epc-v238/
          cp diagnostico_estradaplay_209.php /tmp/epc-v238/
          cp login.php index.php /tmp/epc-v238/
          cp api/official_data_policy.php api/server_context_v7.php /tmp/epc-v238/api/
          [ -f assets/css/admin-epc.css ] && cp assets/css/admin-epc.css /tmp/epc-v238/assets/css/ || true
          [ -f assets/css/app.css ] && cp assets/css/app.css /tmp/epc-v238/assets/css/ || true
          [ -f assets/js/admin-epc.js ] && cp assets/js/admin-epc.js /tmp/epc-v238/assets/js/ || true
          [ -f assets/js/admin.js ] && cp assets/js/admin.js /tmp/epc-v238/assets/js/ || true
          cat > /tmp/epc-v238/LEIA-ME.txt <<'EOF'
          Estrada Play Comunista - Servidor 2.3.8 - Administração Unificada

          Esta atualização coloca todas as funções administrativas em uma única central.
          Após o login de administrador, o sistema abre admin_central.php.

          Módulos disponíveis na mesma central:
          - Visão geral EPC
          - Clientes, Google Drive e biblioteca
          - Dispositivos
          - Relatos
          - Base comunitária
          - Radares
          - Rádio PTT
          - Base oficial e limpeza
          - Servidor
          - Diagnóstico de autenticação
          - Diagnóstico legado 2.0.9

          A limpeza da base continua protegida por login administrador, CSRF e confirmação textual.
          Nenhuma limpeza é executada automaticamente.

          Instalação:
          1. Faça backup do servidor e do banco.
          2. Extraia este ZIP na raiz do servidor, preservando as pastas.
          3. NÃO substitua config/config.php.
          4. Entre novamente como administrador.
          5. A central deve abrir em admin_central.php.

          Esta atualização não altera o APK, o PTT Android nem o banco automaticamente.
          EOF
          (cd /tmp/epc-v238 && zip -r "$GITHUB_WORKSPACE/Estrada-Play-Comunista-SERVIDOR-2.3.8-ADMIN-UNIFICADO.zip" .)
          sha256sum Estrada-Play-Comunista-SERVIDOR-2.3.8-ADMIN-UNIFICADO.zip | tee /tmp/epc-v238-sha.txt

      - name: Publish unified admin package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-server-2.3.8-admin-unificado-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Estrada Play Comunista - Servidor 2.3.8 Admin Unificado" \
            --notes "Central administrativa única para todos os módulos existentes, incluindo Base Oficial/Limpeza e Diagnóstico de Autenticação. O login e a raiz encaminham administradores para admin_central.php. Não altera config/config.php, não executa limpeza automática e não modifica o APK." \
            Estrada-Play-Comunista-SERVIDOR-2.3.8-ADMIN-UNIFICADO.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-SERVIDOR-2.3.8-ADMIN-UNIFICADO
          path: Estrada-Play-Comunista-SERVIDOR-2.3.8-ADMIN-UNIFICADO.zip
          retention-days: 7
