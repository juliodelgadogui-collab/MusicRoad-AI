name: Estrada Play Universal 1.6.2 Portable + Server v6
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_portable_v162_server_v6.py'
      - '.github/workflows/build-estrada-play-portable-v162-server-v6.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Apply portable app and clean server patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_estrada_play_portable_v162_server_v6.py
          python3 tools/patch_estrada_play_portable_v162_server_v6.py

      - name: Verify portable architecture and installer
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          M=estrada-play-comunista-app/app/src/main/AndroidManifest.xml
          grep -q "versionName '1.6.2'" "$G"
          grep -q 'versionCode 162' "$G"
          grep -q 'ServerEndpointStore.base' "$J/ApiClient.java"
          grep -q 'ServerSettingsActivity' "$M"
          grep -q 'TROCAR SERVIDOR' "$J/MainActivity.java"
          grep -q 'CONFIGURAR SERVIDOR' "$J/DriveToolsActivity.java"
          grep -q 'api/ping.php' "$J/ServerSettingsActivity.java"
          grep -q 'ESTRADAPLAY_SETUP_REQUIRED_V6' api/bootstrap.php
          grep -q "500MB-v6" api/server_intelligent.php
          grep -q 'install.lock' install.php
          grep -q 'password_hash' install.php
          grep -q 'setup_required' api/ping.php
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi
          php -l install.php
          php -l api/bootstrap.php
          php -l api/ping.php
          php -l api/server_intelligent.php
          php -l api/radio.php
          php -l admin_server.php
          php -l admin_radio.php

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app api/bootstrap.php api/ping.php api/server_intelligent.php install.php admin_server.php
          git commit -m "Generate Universal 1.6.2 portable and Server v6 [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore

      - name: Generate and validate embedded safety voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          COUNT=$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)
          test "$COUNT" -ge 77

      - name: Build Portable Universal APK
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleUniversalDebug

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          A=estrada-play-comunista-app/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$A"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$A" | tee /tmp/v162.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='162' versionName='1.6.2'" /tmp/v162.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$A" >/tmp/v162-cert.txt
          cp "$A" Estrada-Play-Comunista-Universal-1.6.2-PORTATIL.apk
          sha256sum Estrada-Play-Comunista-Universal-1.6.2-PORTATIL.apk | tee /tmp/v162-sha.txt

      - name: Package complete clean Server Central v6
        shell: bash
        run: |
          set -euo pipefail
          DEST=/tmp/estradaplay-server-v6
          rm -rf "$DEST"
          mkdir -p "$DEST"
          # Root server PHP/UI files only.
          find . -maxdepth 1 -type f \( -name '*.php' -o -name '.htaccess' \) -print0 | xargs -0 -I{} cp '{}' "$DEST/"
          # Required server directories.
          for D in api assets database config; do
            test -d "$D"
            cp -a "$D" "$DEST/$D"
          done
          rm -f "$DEST/config/config.php"
          # Writable runtime directories start empty; no old DB, logs, caches or credentials.
          mkdir -p "$DEST/storage/db" "$DEST/storage/cache" "$DEST/logs"
          printf 'Deny from all\n' > "$DEST/storage/.htaccess"
          printf 'Deny from all\n' > "$DEST/logs/.htaccess"
          cat > "$DEST/LEIA-PRIMEIRO.txt" <<'TXT'
          ESTRADA PLAY - SERVER CENTRAL 500 MB V6 - INSTALACAO LIMPA

          1. Envie TODO o conteúdo deste ZIP para a pasta pública do novo domínio.
          2. Extraia mantendo as pastas.
          3. Abra no navegador: https://SEU-DOMINIO/install.php
          4. Informe MariaDB/MySQL (recomendado) ou SQLite e crie o primeiro administrador.
          5. Ao concluir, o instalador cria storage/install.lock e fica bloqueado.
          6. No APK Universal 1.6.2: tela de acesso > TROCAR SERVIDOR, ou Central Inteligente > CONFIGURAR SERVIDOR.
          7. O app testa api/ping.php antes de salvar o novo endereço.

          SEGURANCA
          - Este ZIP NÃO contém config/config.php.
          - Este ZIP NÃO contém banco antigo, senhas, tokens, áudio, vídeo, APK ou cache.
          - O Rádio da Rodovia continua P2P/WebRTC; o hosting não armazena voz.
          - Depois da instalação, mantenha HTTPS ativo.
          TXT
          # Lint every packaged PHP file before release.
          while IFS= read -r -d '' F; do php -l "$F" >/dev/null; done < <(find "$DEST" -type f -name '*.php' -print0)
          test -f "$DEST/install.php"
          test -f "$DEST/api/ping.php"
          test -f "$DEST/api/radio.php"
          test -f "$DEST/database/schema.sql"
          test -f "$DEST/config/config.example.php"
          test ! -f "$DEST/config/config.php"
          ! find "$DEST" -type f | grep -E '\.(apk|mp3|wav|mp4|m4a|ogg|sqlite|db|zip)$'
          (cd "$DEST" && zip -qr "$GITHUB_WORKSPACE/EstradaPlay-SERVIDOR-COMPLETO-v6-INSTALACAO-LIMPA.zip" .)
          unzip -l EstradaPlay-SERVIDOR-COMPLETO-v6-INSTALACAO-LIMPA.zip | tee /tmp/server-v6-list.txt
          ! grep -Eq 'config/config\.php|\.(apk|mp3|wav|mp4|m4a|ogg|sqlite|db)$' /tmp/server-v6-list.txt
          sha256sum EstradaPlay-SERVIDOR-COMPLETO-v6-INSTALACAO-LIMPA.zip | tee /tmp/server-v6-sha.txt

      - name: Publish Portable Universal 1.6.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.6.2-portable-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Estrada Play Comunista Universal 1.6.2 - Portátil" --notes "APK Universal preparado para mudança de hospedagem sem recompilar. O servidor pode ser trocado pela tela de autenticação ou pela Central Inteligente; a URL não aparece no cockpit normal. Ao trocar, sessão/conta do servidor anterior são removidas do aparelho e o login reinicia. Mantém Rádio da Rodovia WebRTC P2P e todas as funções da 1.6.1." Estrada-Play-Comunista-Universal-1.6.2-PORTATIL.apk
          echo "APP_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish complete clean Server v6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estradaplay-server-v6-clean-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "EstradaPlay Server Central v6 - Instalação Limpa" --notes "Pacote COMPLETO para servidor novo. Basta extrair e abrir /install.php. O instalador testa MariaDB/MySQL ou SQLite, gera config/config.php, cria todas as tabelas-base, cria o primeiro administrador e grava storage/install.lock para se bloquear. Inclui api/ping.php para o APK portátil. Não contém credenciais, banco antigo, áudio, vídeo, APK nem cache." EstradaPlay-SERVIDOR-COMPLETO-v6-INSTALACAO-LIMPA.zip

      - name: Temporary artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: EstradaPlay-Portable-1.6.2-and-Clean-Server-v6
          path: |
            Estrada-Play-Comunista-Universal-1.6.2-PORTATIL.apk
            EstradaPlay-SERVIDOR-COMPLETO-v6-INSTALACAO-LIMPA.zip
          retention-days: 1
          compression-level: 0
