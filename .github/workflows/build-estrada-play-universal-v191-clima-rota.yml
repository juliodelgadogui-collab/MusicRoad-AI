name: Estrada Play Universal 1.9.1 Clima da Rota
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_v191_clima_rota.py'
      - 'tools/ci_build_epc_v191.sh'
      - '.github/workflows/build-estrada-play-universal-v191-clima-rota.yml'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadWeatherMonitor.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/WeatherActivity.java'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v191
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Generate 1.9.1 source
        run: |
          python3 -m py_compile tools/patch_estrada_play_v191_clima_rota.py
          python3 tools/patch_estrada_play_v191_clima_rota.py

      - name: Verify weather architecture
        run: |
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          M=estrada-play-comunista-app/app/src/main/AndroidManifest.xml
          grep -q "versionName '1.9.1'" "$G"
          grep -q 'versionCode 191' "$G"
          grep -q 'WeatherActivity' "$M"
          grep -q 'CLIMA_ROTA_V191' "$J/RoadWeatherMonitor.java"
          grep -q 'CHUVA À FRENTE' "$J/RoadWeatherMonitor.java"
          grep -q 'saveActiveRoute' "$J/TripPlannerActivity.java"
          grep -q 'maybeAnnounceWeatherForecast' "$J/RoadSafetyService.java"
          grep -q 'RoadWeatherMonitor.compactStatus' "$J/RoadMapActivity.java"
          grep -q 'new Tool("CLIMA"' "$J/DriveToolsActivity.java"
          grep -q 'vai chover' "$J/VoiceCommandActivity.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Persist generated 1.9.1 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app/app/build.gradle \
                  estrada-play-comunista-app/app/src/main/AndroidManifest.xml \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/DriveToolsActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/TripPlannerActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/VoiceCommandActivity.java \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadSafetyService.java
          git commit -m "Generate Universal 1.9.1 Clima da Rota [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and validate APK
        run: bash tools/ci_build_epc_v191.sh

      - name: Publish 1.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="estrada-play-comunista-1.9.1-clima-rota-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "Estrada Play Comunista Universal 1.9.1 - Clima da Rota" \
            --notes "Previsao de chuva local e ao longo da rota, status visivel no mapa e Central, consulta por voz e aviso de chuva a frente. Open-Meteo direto no aparelho. Sem WebView." \
            Estrada-Play-Comunista-Universal-1.9.1-Clima-da-Rota.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-1.9.1-Clima-da-Rota
          path: Estrada-Play-Comunista-Universal-1.9.1-Clima-da-Rota.apk
          retention-days: 3
          compression-level: 0
