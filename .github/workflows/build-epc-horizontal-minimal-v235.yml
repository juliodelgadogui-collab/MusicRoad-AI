name: EPC Android 2.3.8 Comboio Link Público
permissions:
  contents: read
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - '.htaccess'
      - 'convoy_invite.php'
      - 'estrada-play-comunista-app/app/build.gradle'
      - 'estrada-play-comunista-app/app/src/main/AndroidManifest.xml'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/ConvoyIntegrationV237.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/ConvoyActivity.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/ConvoyStore.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/ConvoyLiveBridge.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/EstradaPlayApplication.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/GateActivity.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapView.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/HorizontalCockpitV235.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/EpcMotion.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java'
      - '.github/workflows/build-epc-horizontal-minimal-v235.yml'
  workflow_dispatch:

concurrency:
  group: epc-android-v238
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Apply horizontal crash guard
        shell: bash
        run: |
          set -euo pipefail
          F=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/HorizontalCockpitV235.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path('estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/HorizontalCockpitV235.java')
          s = p.read_text(encoding='utf-8')
          old = 'LinearLayout media = findLinearWithText(dock, "MÚSICA OFFLINE");'
          new = 'LinearLayout media = findDirectLinearWithText(dock, "MÚSICA OFFLINE");'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'LinearLayout media = findDirectLinearWithText(dock, "MÚSICA OFFLINE");' "$F"
          if grep -q 'LinearLayout media = findLinearWithText(dock, "MÚSICA OFFLINE");' "$F"; then
            echo 'Unsafe self-parent lookup still present'; exit 1
          fi

      - name: Validate 2.3.8 public convoy integration
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          M="$APP/app/src/main/AndroidManifest.xml"

          grep -q "versionCode 239" "$APP/app/build.gradle"
          grep -q "versionName '2.3.8'" "$APP/app/build.gradle"
          grep -q 'https://www.xn--gesto-dra.store/c/' "$APP/app/build.gradle"
          grep -q 'EPC_CONVOY_PUBLIC_LINK_V238' "$APP/app/build.gradle"

          test -f convoy_invite.php
          grep -q 'EPC_CONVOY_PUBLIC_LINK_V238' convoy_invite.php
          grep -q 'estradaplay://comboio/' convoy_invite.php
          grep -q '^RewriteRule \^c/' .htaccess

          test -f "$J/ConvoyIntegrationV237.java"
          grep -q 'COMBOIO_LINK_MAP_V237' "$J/ConvoyIntegrationV237.java"
          grep -q 'setConvoyMembers' "$J/ConvoyIntegrationV237.java"
          grep -q 'ConvoyIntegrationV237.install(this)' "$J/EstradaPlayApplication.java"
          grep -q 'ConvoyIntegrationV237.captureInvite' "$J/GateActivity.java"
          grep -q 'setConvoyMembers' "$J/RoadMapView.java"
          grep -q 'CONVOY_MAP_V180' "$J/RoadMapView.java"
          grep -q 'android:scheme="estradaplay"' "$M"
          grep -q 'android:host="comboio"' "$M"
          grep -q 'android.intent.action.VIEW' "$M"
          grep -q 'android.intent.category.BROWSABLE' "$M"

          grep -q 'HORIZONTAL_MINIMAL_V235' "$J/HorizontalCockpitV235.java"
          grep -q 'HorizontalCockpitV235.apply(v)' "$J/EpcMotion.java"
          grep -q 'MÚSICA OFFLINE' "$J/HorizontalCockpitV235.java"
          grep -q 'GPS ATIVO' "$J/HorizontalCockpitV235.java"

          if grep -R -q 'android.webkit.WebView\|new WebView' "$APP/app/src/main/java"; then
            echo 'WebView detected'; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare development signing key
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          base64 -d "$APP/signing/estradaplay-dev.keystore.b64" > "$APP/signing/estradaplay-dev.keystore"

      - name: Generate embedded Portuguese voice bank
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-v238-voice && mkdir -p /tmp/epc-v238-voice
          tar -xjf "$MODEL" -C /tmp/epc-v238-voice
          python3 "$APP/tools/generate_voice_bank.py" --model-root /tmp/epc-v238-voice --output "$APP/app/src/main/res/raw" --metadata-output "$APP/app/src/main/assets/estradaplay_voice"
          test "$(find "$APP/app/src/main/res/raw" -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 77

      - name: Unit tests and build universal plus horizontal APKs
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          (cd "$APP" && gradle --no-daemon testUniversalDebugUnitTest testHorizontalDebugUnitTest assembleUniversalDebug assembleHorizontalDebug)

          U="$APP/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          H="$APP/app/build/outputs/apk/horizontal/debug/app-horizontal-debug.apk"
          test -f "$U"
          test -f "$H"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$U" | tee /tmp/epc-v238-universal-badging.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='239' versionName='2.3.8'" /tmp/epc-v238-universal-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$H" | tee /tmp/epc-v238-horizontal-badging.txt
          grep -q "package: name='com.estradaplay.comunista.horizontal' versionCode='239' versionName='2.3.8'" /tmp/epc-v238-horizontal-badging.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$U" AndroidManifest.xml | tee /tmp/epc-v238-manifest.txt
          grep -q 'estradaplay' /tmp/epc-v238-manifest.txt
          grep -q 'comboio' /tmp/epc-v238-manifest.txt

          grep -a -q 'https://www.xn--gesto-dra.store/c/' "$U"
          grep -a -q 'https://www.xn--gesto-dra.store/c/' "$H"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$U"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$H"

          cp "$U" Estrada-Play-Comunista-Universal-2.3.8.apk
          cp "$H" Estrada-Play-Comunista-Horizontal-2.3.8.apk
          sha256sum Estrada-Play-Comunista-Universal-2.3.8.apk Estrada-Play-Comunista-Horizontal-2.3.8.apk | tee /tmp/epc-v238-sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.3.8
          path: |
            Estrada-Play-Comunista-Universal-2.3.8.apk
            Estrada-Play-Comunista-Horizontal-2.3.8.apk
          retention-days: 7
          compression-level: 0
