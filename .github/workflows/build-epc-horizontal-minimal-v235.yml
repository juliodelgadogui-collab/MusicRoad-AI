name: EPC Horizontal Minimal Cockpit
permissions:
  contents: read
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/HorizontalCockpitV235.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/EpcMotion.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java'
      - '.github/workflows/build-epc-horizontal-minimal-v235.yml'
  workflow_dispatch:

concurrency:
  group: epc-horizontal-minimal-v235
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Validate horizontal minimal cockpit
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          test -f "$J/HorizontalCockpitV235.java"
          grep -q 'HORIZONTAL_MINIMAL_V235' "$J/HorizontalCockpitV235.java"
          grep -q 'HorizontalCockpitV235.apply(v)' "$J/EpcMotion.java"
          grep -q 'MÚSICA OFFLINE' "$J/HorizontalCockpitV235.java"
          grep -q 'GPS ATIVO' "$J/HorizontalCockpitV235.java"
          grep -q 'CHEGADA' "$J/HorizontalCockpitV235.java"
          grep -q 'RESTANTE' "$J/HorizontalCockpitV235.java"
          grep -q 'DURAÇÃO' "$J/HorizontalCockpitV235.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$APP/app/src/main/java"; then
            echo 'WebView detected'; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare development signing key
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          base64 -d "$APP/signing/estradaplay-dev.keystore.b64" > "$APP/signing/estradaplay-dev.keystore"

      - name: Generate embedded Portuguese voice bank
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-horizontal-voice && mkdir -p /tmp/epc-horizontal-voice
          tar -xjf "$MODEL" -C /tmp/epc-horizontal-voice
          python3 "$APP/tools/generate_voice_bank.py" --model-root /tmp/epc-horizontal-voice --output "$APP/app/src/main/res/raw" --metadata-output "$APP/app/src/main/assets/estradaplay_voice"
          test "$(find "$APP/app/src/main/res/raw" -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 77

      - name: Unit tests and build horizontal plus universal APKs
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          (cd "$APP" && gradle --no-daemon testHorizontalDebugUnitTest testUniversalDebugUnitTest assembleHorizontalDebug assembleUniversalDebug)

          H="$APP/app/build/outputs/apk/horizontal/debug/app-horizontal-debug.apk"
          U="$APP/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          test -f "$H"
          test -f "$U"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$H" | tee /tmp/epc-horizontal-badging.txt
          grep -q "package: name='com.estradaplay.comunista.horizontal' versionCode='234' versionName='2.3.4'" /tmp/epc-horizontal-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$U" | tee /tmp/epc-universal-badging.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='234' versionName='2.3.4'" /tmp/epc-universal-badging.txt

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$H"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$U"

          cp "$H" Estrada-Play-Comunista-Horizontal-Minimal-2.3.4.apk
          cp "$U" Estrada-Play-Comunista-Universal-Minimal-Landscape-2.3.4.apk
          sha256sum Estrada-Play-Comunista-Horizontal-Minimal-2.3.4.apk Estrada-Play-Comunista-Universal-Minimal-Landscape-2.3.4.apk | tee /tmp/epc-horizontal-sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-Minimal-Landscape-2.3.4
          path: |
            Estrada-Play-Comunista-Horizontal-Minimal-2.3.4.apk
            Estrada-Play-Comunista-Universal-Minimal-Landscape-2.3.4.apk
          retention-days: 7
          compression-level: 0
