name: Export signed release download URLs

permissions:
  contents: read

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/workflows/export-release-urls.yml'
  workflow_dispatch:

jobs:
  export-urls:
    runs-on: ubuntu-22.04
    steps:
      - name: Export temporary signed URLs for EstradaPlay 1.7.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export_url() {
            local asset_id="$1"
            local label="$2"
            curl -sS \
              -D "/tmp/${label}.headers" \
              -o /dev/null \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            local url
            url="$(tr -d '\r' < "/tmp/${label}.headers" | awk 'BEGIN{IGNORECASE=1} /^location: / {sub(/^location: /, ""); print; exit}')"
            test -n "$url"
            echo "${label}_SIGNED_URL=${url}"
          }

          export_url 531244766 APK
          export_url 531244765 SERVER
