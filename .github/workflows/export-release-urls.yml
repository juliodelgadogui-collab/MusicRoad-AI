name: Export signed release download URLs

permissions:
  contents: read

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/workflows/export-release-urls.yml'
  workflow_dispatch:

jobs:
  export-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Export server package for chat transfer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/530917767" \
            -o /tmp/EstradaPlay-1.7.0-SERVIDOR.zip
          test "$(stat -c%s /tmp/EstradaPlay-1.7.0-SERVIDOR.zip)" -eq 18668
          echo "SERVER_FILE_B64=$(base64 -w0 /tmp/EstradaPlay-1.7.0-SERVIDOR.zip)"
