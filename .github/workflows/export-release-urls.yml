name: Export signed release download URLs

permissions:
  contents: read

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/workflows/export-release-urls.yml'
  workflow_dispatch:

jobs:
  export-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve temporary signed URLs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolve() {
            local id="$1" name="$2"
            rm -f /tmp/h
            code=$(curl -sS -o /dev/null -D /tmp/h -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${id}")
            echo "${name}_HTTP=${code}"
            url=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/h)
            if [ -z "$url" ]; then
              echo "No redirect URL for ${name}" >&2
              cat /tmp/h >&2
              exit 1
            fi
            echo "${name}_SIGNED_URL=${url}"
          }
          resolve 530917759 APK
          resolve 530917767 SERVER
