name: Export signed release download URLs

permissions:
  contents: read

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/workflows/export-release-urls.yml'
  workflow_dispatch:

jobs:
  export-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze APK transfer size
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/530917759" \
            -o /tmp/EstradaPlay-1.7.0.apk
          cp /tmp/EstradaPlay-1.7.0.apk /tmp/thin.apk
          zip -dq /tmp/thin.apk 'lib/*' || true
          echo "FULL_SIZE=$(stat -c%s /tmp/EstradaPlay-1.7.0.apk)"
          echo "THIN_SIZE=$(stat -c%s /tmp/thin.apk)"
          echo 'TOP_APK_ENTRIES:'
          unzip -l /tmp/EstradaPlay-1.7.0.apk | awk 'NF==4 && $1 ~ /^[0-9]+$/ {print $1, $4}' | sort -nr | head -25
