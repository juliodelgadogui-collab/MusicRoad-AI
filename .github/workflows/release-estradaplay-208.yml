name: Release EstradaPlay 2.0.8 Without Artifacts

permissions:
  contents: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/workflows/release-estradaplay-208.yml'
  workflow_dispatch:

concurrency:
  group: estradaplay-208-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-apk-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signer
        shell: bash
        run: |
          set -euo pipefail
          base64 -d estradaplay-app-v2/signing/estradaplay-dev.keystore.b64 > estradaplay-app-v2/signing/estradaplay-dev.keystore

      - name: Generate embedded EstradaPlay voice
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          test "$(stat -c %s "$MODEL")" -eq 67183065
          rm -rf /tmp/estradaplay-voice && mkdir -p /tmp/estradaplay-voice
          tar -xjf "$MODEL" -C /tmp/estradaplay-voice
          python3 estradaplay-app-v2/tools/generate_voice_bank.py --model-root /tmp/estradaplay-voice --output estradaplay-app-v2/app/src/main/res/raw --metadata-output estradaplay-app-v2/app/src/main/assets/estradaplay_voice
          test "$(find estradaplay-app-v2/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 70

      - name: Verify 2.0.8 recovery
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 208" estradaplay-app-v2/app/build.gradle
          grep -q "versionName '2.0.8'" estradaplay-app-v2/app/build.gradle
          grep -q 'LIBRARY_PAGED_V208' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/MainActivity.java
          grep -q 'LIBRARY_PAGED_V208' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/ApiClient.java
          grep -q 'CATALOG_FILE_V208' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/LibraryStore.java
          grep -q "library_page" api/native_app.php
          grep -q "library_sync_only" api/native_app.php
          grep -q 'DRIVE_SYNC_V208' api/native_library_sync.php
          if grep -R -q 'android.webkit.WebView\|new WebView' estradaplay-app-v2/app/src/main/java; then exit 1; fi
          php -l api/bootstrap.php
          php -l api/native_app.php
          php -l api/native_auth.php
          php -l api/native_library_sync.php
          php -l api/drive_stream.php

      - name: Build APK directly
        working-directory: estradaplay-app-v2
        run: gradle --no-daemon clean assembleDebug

      - name: Verify signature and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK=estradaplay-app-v2/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi 'c2d88a15b134f435de9fb532699e93fcd46bc35900a086575fcb2bf7f2f66fdb' /tmp/cert.txt
          cp "$APK" EstradaPlay-2.0.8.apk
          sha256sum EstradaPlay-2.0.8.apk | tee /tmp/apk.sha

      - name: Package server 2.0.8
        shell: bash
        run: |
          set -euo pipefail
          PKG=/tmp/estradaplay-server-208
          rm -rf "$PKG"
          mkdir -p "$PKG/api"
          cp api/bootstrap.php "$PKG/api/"
          cp api/library.php "$PKG/api/"
          cp api/native_app.php "$PKG/api/"
          cp api/native_auth.php "$PKG/api/"
          cp api/native_library_sync.php "$PKG/api/"
          cp api/drive_stream.php "$PKG/api/"
          cat > "$PKG/LEIA-PRIMEIRO.txt" <<'EOF'
          EstradaPlay 2.0.8 - biblioteca paginada

          Extraia este ZIP na RAIZ da instalação do EstradaPlay e permita sobrescrever os arquivos incluídos.
          O pacote não contém config.php, senhas, banco de dados, usuários nem músicas.

          Correções:
          - resolve o limite de 4.000.000 caracteres confirmado com 4.587 músicas;
          - catálogo enviado em páginas de até 500 faixas;
          - sincronização do Google Drive não devolve mais milhares de músicas na mesma resposta;
          - falha em uma subpasta pública não interrompe as demais;
          - filtra referências internas falsas do Google em pastas públicas;
          - mantém autenticação por aparelho e streaming direto do Drive.
          EOF
          (cd "$PKG" && zip -qr "$GITHUB_WORKSPACE/EstradaPlay-2.0.8-SERVIDOR.zip" .)
          sha256sum EstradaPlay-2.0.8-SERVIDOR.zip | tee /tmp/server.sha

      - name: Publish direct Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estradaplay-2.0.8-direct-r${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$(git rev-parse HEAD)" \
            --title "EstradaPlay 2.0.8 · biblioteca paginada" \
            --notes "Correção confirmada pelo diagnóstico: 4.587 músicas geravam 4.030.700 caracteres, acima do limite de 4.000.000 do APK 2.0.7. A 2.0.8 usa paginação em blocos de até 500 músicas, sincronização separada, catálogo em arquivo interno e scanner público do Google Drive mais resiliente." \
            EstradaPlay-2.0.8.apk EstradaPlay-2.0.8-SERVIDOR.zip
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Print final checksums
        shell: bash
        run: |
          cat /tmp/apk.sha
          cat /tmp/server.sha
          echo "Release: ${RELEASE_TAG}"
