name: Migrate EstradaPlay 2.0.6 Nonblocking Boot

permissions:
  contents: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/workflows/migrate-estradaplay-206.yml'

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-apk-build
          fetch-depth: 0

      - name: Consolidate 2.0.6 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('estradaplay-app-v2/app/src/main/java/com/estradaplay/app/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          old = '''    private void boot() {
              if (hasAccount()) {
                  startRoadSafetyIfAllowed();
                  if (!library.hasSetupDone()) {
                      if (online()) loadCatalogAndOpenChooser(true); else showOfflineSetupBlocked();
                  } else openConfiguredTarget();
                  return;
              }
              if (online()) attemptDeviceLogin();
              else showAuth(false, "Conecte-se para entrar pela primeira vez. Depois, música e alertas preparados continuam disponíveis offline.");
          }
          '''
          new = '''    // BOOT_NONBLOCKING_V206: biblioteca nunca bloqueia a abertura do EstradaPlay.
              private void boot() {
                  if (hasAccount()) {
                      startRoadSafetyIfAllowed();
                      library.setSetupDone(true);
                      openConfiguredTarget();
                      if (online()) syncCatalogInBackground();
                      return;
                  }
                  if (online()) attemptDeviceLogin();
                  else showAuth(false, "Conecte-se para entrar pela primeira vez. Depois, mapa, proteção e músicas já baixadas continuam disponíveis offline.");
              }
          '''
          if old not in s:
              raise SystemExit('boot block not found')
          s = s.replace(old, new, 1)

          old = '''                    saveAccount(j.optJSONObject("account"));
                      ui.post(() -> loadCatalogAndOpenChooser(true));'''
          new = '''                    saveAccount(j.optJSONObject("account"));
                      library.setSetupDone(true);
                      ui.post(() -> { showHome(); syncCatalogInBackground(); });'''
          count = s.count(old)
          if count < 2:
              raise SystemExit(f'expected two post-login library gates, found {count}')
          s = s.replace(old, new, 2)

          anchor = '''    private void loadCatalogAndOpenChooser(boolean initial) {
          '''
          if anchor not in s:
              raise SystemExit('loadCatalogAndOpenChooser anchor missing')
          background = '''    private void syncCatalogInBackground() {
              if (!online()) return;
              io.execute(() -> {
                  try {
                      ApiClient.Response r = api.get("api/library.php?action=list");
                      JSONObject j = r.json();
                      JSONArray arr = j.optJSONArray("tracks");
                      if (!r.ok() || arr == null) {
                          ApiClient.Response fallback = api.get("api/native_app.php?action=library");
                          j = fallback.json();
                          arr = j.optJSONArray("tracks");
                          if (!fallback.ok() || arr == null) return;
                      }
                      ArrayList<Track> tracks = new ArrayList<>();
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.optJSONObject(i);
                          if (o == null) continue;
                          Track t = Track.fromServer(o, api);
                          if (!t.remoteSource.isEmpty()) tracks.add(t);
                      }
                      if (!tracks.isEmpty()) {
                          int beforeFolders = library.folderNames(library.catalog()).size();
                          library.saveCatalog(tracks);
                          int afterFolders = library.folderNames(tracks).size();
                          if (afterFolders > beforeFolders && beforeFolders > 0) {
                              int added = afterFolders - beforeFolders;
                              ui.post(() -> toast(added + (added == 1 ? " nova pasta encontrada." : " novas pastas encontradas.")));
                          }
                      }
                  } catch (Exception ignored) {
                      // A biblioteca é opcional para iniciar o app. Uma falha aqui nunca bloqueia mapa/GPS.
                  }
              });
          }

          '''
          s = s.replace(anchor, background + anchor, 1)

          old = '''                library.saveCatalog(tracks);
                      ui.post(() -> { if (tracks.isEmpty()) showCatalogEmpty(initial); else showFolderChooser(initial); });'''
          new = '''                if (!tracks.isEmpty()) library.saveCatalog(tracks);
                      ui.post(() -> {
                          if (tracks.isEmpty()) {
                              library.setSetupDone(true);
                              showHome();
                              toast("Nenhuma música disponível agora. O EstradaPlay continua funcionando; tente novamente em Gerenciar Biblioteca.");
                          } else {
                              library.setSetupDone(true);
                              showFolderChooser(initial);
                          }
                      });'''
          if old not in s:
              raise SystemExit('catalog success callback not found')
          s = s.replace(old, new, 1)

          old = '''                    if (!library.catalog().isEmpty()) showFolderChooser(initial);
                          else alertWithRetry("Não consegui carregar as pastas", "Confira a internet e tente novamente.", () -> loadCatalogAndOpenChooser(initial));'''
          new = '''                    if (!library.catalog().isEmpty()) {
                              library.setSetupDone(true);
                              showFolderChooser(initial);
                          } else {
                              library.setSetupDone(true);
                              showHome();
                              toast("Biblioteca indisponível agora. Mapa, GPS e proteção continuam funcionando.");
                          }'''
          if old not in s:
              raise SystemExit('catalog failure callback not found')
          s = s.replace(old, new, 1)

          old = '''                    library.setSetupDone(hasOfflineMusic);
                      if (hasOfflineMusic) {
                          ui.postDelayed(() -> { downloadInitialFlow = false; showHome(); }, 900);
                      } else {
                          downloadInitialFlow = false;
                          ui.postDelayed(() -> {
                              toast("Nenhuma música foi baixada. Escolha novamente quando estiver online.");
                              if (online()) loadCatalogAndOpenChooser(true); else showOfflineSetupBlocked();
                          }, 650);
                      }'''
          new = '''                    library.setSetupDone(true);
                      if (hasOfflineMusic) {
                          ui.postDelayed(() -> { downloadInitialFlow = false; showHome(); }, 900);
                      } else {
                          downloadInitialFlow = false;
                          ui.postDelayed(() -> {
                              toast("Nenhuma música foi baixada. Você pode tentar novamente depois em Gerenciar Biblioteca.");
                              showHome();
                          }, 650);
                      }'''
          if old not in s:
              raise SystemExit('download initial gate not found')
          s = s.replace(old, new, 1)

          old = '''    private void alertWithRetry(String title, String message, Runnable retry) { new AlertDialog.Builder(this).setTitle(title).setMessage(message).setNegativeButton("Voltar", (d,w) -> { if (library.hasSetupDone()) showHome(); else showAuth(false, null); }).setPositiveButton("Tentar novamente", (d,w) -> retry.run()).show(); }'''
          new = '''    private void alertWithRetry(String title, String message, Runnable retry) { new AlertDialog.Builder(this).setTitle(title).setMessage(message).setNegativeButton("Voltar", (d,w) -> { if (hasAccount()) showHome(); else showAuth(false, null); }).setPositiveButton("Tentar novamente", (d,w) -> retry.run()).show(); }'''
          if old not in s:
              raise SystemExit('alertWithRetry not found')
          s = s.replace(old, new, 1)

          old = '''        if (hasAccount() && library != null && library.hasSetupDone()) openConfiguredTarget();'''
          new = '''        if (hasAccount() && library != null) openConfiguredTarget();'''
          if old not in s:
              raise SystemExit('onNewIntent gate not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          gradle = Path('estradaplay-app-v2/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          if "versionCode 205" not in g or "versionName '2.0.5'" not in g:
              raise SystemExit('expected version 2.0.5 source')
          g = g.replace('versionCode 205', 'versionCode 206', 1).replace("versionName '2.0.5'", "versionName '2.0.6'", 1)
          gradle.write_text(g, encoding='utf-8')

          wf = Path('.github/workflows/build-estradaplay-v2.yml')
          w = wf.read_text(encoding='utf-8')
          check = "          grep -q 'X-EstradaPlay-Device' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/ApiClient.java\n"
          if "BOOT_NONBLOCKING_V206" not in w:
              w = w.replace(check, check + "          grep -q 'BOOT_NONBLOCKING_V206' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/MainActivity.java\n", 1)
          w = w.replace('EstradaPlay 2.0.5 - correção de biblioteca', 'EstradaPlay 2.0.6 - biblioteca não bloqueia o app')
          w = w.replace('Esta atualização restaura sessão por dispositivo e sincroniza novas pastas do Google Drive.', 'Esta atualização restaura sessão por dispositivo, sincroniza novas pastas do Google Drive e mantém o app utilizável mesmo quando a biblioteca estiver indisponível.')
          marker = '''          if [ "$VERSION" = "2.0.5" ]; then
              NOTES="Corrige a biblioteca após reinstalação e a descoberta de novas pastas do Google Drive. O app envia uma identidade estável do aparelho em toda chamada; o servidor reconstrói a sessão, refaz a varredura das pastas ativas e mantém fallback da biblioteca já salva. Inclui pacote de servidor."
            fi
          '''
          add = marker + '''          if [ "$VERSION" = "2.0.6" ]; then
              NOTES="Corrige o bloqueio no primeiro acesso: falha do Drive/biblioteca não impede mais o EstradaPlay de abrir. Mapa, GPS e proteção entram normalmente; a biblioteca sincroniza em segundo plano e novas pastas continuam sendo descobertas pelo servidor. Inclui pacote de servidor."
            fi
          '''
          if marker not in w:
              raise SystemExit('release notes marker missing')
          w = w.replace(marker, add, 1)
          wf.write_text(w, encoding='utf-8')
          PY

          grep -q 'BOOT_NONBLOCKING_V206' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/MainActivity.java
          grep -q "versionName '2.0.6'" estradaplay-app-v2/app/build.gradle

      - name: Commit consolidated 2.0.6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estradaplay-app-v2/app/src/main/java/com/estradaplay/app/MainActivity.java estradaplay-app-v2/app/build.gradle .github/workflows/build-estradaplay-v2.yml
          git commit -m "EstradaPlay 2.0.6: never block boot on music library"
          git push origin HEAD:agent/native-apk-build
