name: EstradaPlay Server v6.1 Hybrid Current/New
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/server_v61_hybrid_current_install.py'
      - '.github/workflows/build-server-v61-hybrid-current.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Apply hybrid current-server protection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/server_v61_hybrid_current_install.py
          python3 tools/server_v61_hybrid_current_install.py
          grep -q "500MB-v6.1" api/server_intelligent.php
          grep -q 'existing-installation-adopted' api/ping.php
          grep -q 'SERVER_V61_HYBRID' install.php
          php -l api/ping.php
          php -l api/server_intelligent.php
          php -l install.php

      - name: Commit generated server source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ping.php api/server_intelligent.php install.php
          git commit -m "Generate Server v6.1 hybrid current-host protection [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build hybrid full server ZIP
        shell: bash
        run: |
          set -euo pipefail
          DEST=/tmp/estradaplay-server-v61
          rm -rf "$DEST" && mkdir -p "$DEST"
          find . -maxdepth 1 -type f \( -name '*.php' -o -name '.htaccess' \) -print0 | xargs -0 -I{} cp '{}' "$DEST/"
          for D in api assets database config; do cp -a "$D" "$DEST/$D"; done
          # Never ship credentials or an old database. Existing files on the host are preserved because they are absent from the ZIP.
          rm -f "$DEST/config/config.php"
          mkdir -p "$DEST/storage/db" "$DEST/storage/cache" "$DEST/logs"
          printf 'Deny from all\n' > "$DEST/storage/.htaccess"
          printf 'Deny from all\n' > "$DEST/logs/.htaccess"
          cat > "$DEST/LEIA-PRIMEIRO.txt" <<'TXT'
          ESTRADA PLAY - SERVER CENTRAL V6.1 HIBRIDO

          SERVIDOR ATUAL:
          1. Faça backup do config/config.php e do banco por precaução.
          2. Extraia este ZIP por cima da instalação atual.
          3. NÃO abra o instalador para reinstalar. Se config.php já existir, o sistema valida o banco e adota a instalação automaticamente.
          4. config/config.php e o banco NÃO estão no ZIP, portanto não são substituídos pela extração.
          5. api/ping.php cria storage/install.lock automaticamente quando detectar config + banco saudáveis.

          SERVIDOR NOVO:
          1. Extraia o ZIP.
          2. Abra /install.php e configure MariaDB/MySQL ou SQLite e o primeiro administrador.

          O pacote não contém credenciais, banco, áudio, vídeo, APK nem cache.
          TXT
          while IFS= read -r -d '' F; do php -l "$F" >/dev/null; done < <(find "$DEST" -type f -name '*.php' -print0)
          test -f "$DEST/install.php"
          test -f "$DEST/api/ping.php"
          test -f "$DEST/api/radio.php"
          test ! -f "$DEST/config/config.php"
          ! find "$DEST" -type f | grep -E '\.(apk|mp3|wav|mp4|m4a|ogg|sqlite|db|zip)$'
          (cd "$DEST" && zip -qr "$GITHUB_WORKSPACE/EstradaPlay-SERVIDOR-COMPLETO-v6.1-HIBRIDO.zip" .)
          unzip -l EstradaPlay-SERVIDOR-COMPLETO-v6.1-HIBRIDO.zip | tee /tmp/v61-list.txt
          ! grep -Eq 'config/config\.php|\.(apk|mp3|wav|mp4|m4a|ogg|sqlite|db)$' /tmp/v61-list.txt
          sha256sum EstradaPlay-SERVIDOR-COMPLETO-v6.1-HIBRIDO.zip | tee /tmp/v61-sha.txt

      - name: Publish Server v6.1 Hybrid
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estradaplay-server-v6.1-hybrid-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "EstradaPlay Server Central v6.1 - Híbrido" --notes "Pacote completo seguro para servidor atual ou novo. Em instalação existente, preserva config/config.php e banco, valida a conexão e cria install.lock automaticamente; não exige reinstalar. Em hospedagem nova, /install.php continua disponível. Sem credenciais, banco, mídia ou APK no ZIP." EstradaPlay-SERVIDOR-COMPLETO-v6.1-HIBRIDO.zip
