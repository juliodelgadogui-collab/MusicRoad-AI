name: Migrate EstradaPlay 2.0.8 Paged Library

permissions:
  contents: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/workflows/migrate-estradaplay-208.yml'
      - '.github/scripts/migrate_208.py'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-apk-build

      - name: Apply 2.0.8 migration
        run: python3 .github/scripts/migrate_208.py

      - name: Verify migrated sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 208" estradaplay-app-v2/app/build.gradle
          grep -q "versionName '2.0.8'" estradaplay-app-v2/app/build.gradle
          grep -q 'LIBRARY_PAGED_V208' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/MainActivity.java
          grep -q 'LIBRARY_PAGED_V208' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/ApiClient.java
          grep -q 'CATALOG_FILE_V208' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/LibraryStore.java
          grep -q "library_page" api/native_app.php
          grep -q "library_sync_only" api/native_app.php
          grep -q 'DRIVE_SYNC_V208' api/native_library_sync.php
          php -l api/native_app.php
          php -l api/native_auth.php
          php -l api/native_library_sync.php
          php -l api/bootstrap.php

      - name: Commit migrated sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estradaplay-app-v2/app/build.gradle \
                  estradaplay-app-v2/app/src/main/java/com/estradaplay/app/ApiClient.java \
                  estradaplay-app-v2/app/src/main/java/com/estradaplay/app/MainActivity.java \
                  estradaplay-app-v2/app/src/main/java/com/estradaplay/app/LibraryStore.java \
                  api/native_app.php api/native_library_sync.php
          git commit -m "EstradaPlay 2.0.8 paged library and resilient Drive sync"
          git push origin HEAD:agent/native-apk-build
