name: Apply EstradaPlay 2.0.3 Voice

permissions:
  contents: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/scripts/apply_203_estradaplay_voice.py'
      - '.github/workflows/apply-estradaplay-203-voice.yml'
  workflow_dispatch:

concurrency:
  group: estradaplay-203-voice
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-apk-build

      - name: Apply EstradaPlay voice profile
        run: python3 .github/scripts/apply_203_estradaplay_voice.py

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '2.0.3'" estradaplay-app-v2/app/build.gradle
          grep -q 'ESTRADAPLAY_VOICE_V203' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'selectEstradaPlayVoice' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'Limite do radar' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java

      - name: Commit definitive 2.0.3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estradaplay-app-v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'EstradaPlay 2.0.3: branded automotive voice'
          git push origin HEAD:agent/native-apk-build
