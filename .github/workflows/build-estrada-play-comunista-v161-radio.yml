name: Estrada Play Comunista 1.6.1 Estrada Radio
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_comunista_radio_v161.py'
      - 'tools/patch_estrada_play_comunista_radio_v161_compilefix.py'
      - '.github/workflows/build-estrada-play-comunista-v161-radio.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Apply 1.6.1 road radio patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_estrada_play_comunista_radio_v161.py tools/patch_estrada_play_comunista_radio_v161_compilefix.py
          python3 tools/patch_estrada_play_comunista_radio_v161.py
          python3 tools/patch_estrada_play_comunista_radio_v161_compilefix.py

      - name: Verify radio architecture
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          M=estrada-play-comunista-app/app/src/main/AndroidManifest.xml
          grep -q "versionName '1.6.1'" "$G"
          grep -q 'versionCode 161' "$G"
          grep -q "io.github.webrtc-sdk:android:144.7559.09" "$G"
          grep -q 'FOREGROUND_SERVICE_MICROPHONE' "$M"
          grep -q 'RoadRadioService' "$M"
          grep -q 'android:stopWithTask="true"' "$M"
          grep -q 'ACTION_SAFETY_AUDIO' "$J/RoadSafetyService.java"
          grep -q 'RoadIdentityResolver.resolve' "$J/RoadRadioService.java"
          grep -q 'createPeerConnection' "$J/RoadRadioService.java"
          grep -q 'localTrack.setEnabled(on)' "$J/RoadRadioService.java"
          grep -q 'RÁDIO DA RODOVIA' "$J/RoadRadioActivity.java"
          grep -q "500MB-v5" api/server_intelligent.php
          grep -q "audio_stored'=>false" api/radio.php
          grep -q 'admin_radio.php' admin_server.php
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi
          php -l api/radio.php
          php -l api/server_intelligent.php
          php -l admin_radio.php
          php -l admin_server.php

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app api/radio.php api/server_intelligent.php admin_radio.php admin_server.php
          git commit -m "Generate Comunista 1.6.1 Estrada Radio [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore

      - name: Generate and validate embedded safety voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          COUNT=$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)
          test "$COUNT" -ge 77

      - name: Build Universal APK
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleUniversalDebug

      - name: Verify Universal identity and signature
        shell: bash
        run: |
          set -euo pipefail
          A=estrada-play-comunista-app/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$A"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$A" | tee /tmp/v161.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='161' versionName='1.6.1'" /tmp/v161.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$A" >/tmp/v161-cert.txt
          cp "$A" Estrada-Play-Comunista-Universal-1.6.1-Radio.apk
          sha256sum Estrada-Play-Comunista-Universal-1.6.1-Radio.apk | tee /tmp/v161-sha.txt

      - name: Package Server Central v5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/server-v5 && mkdir -p /tmp/server-v5/api
          cp api/radio.php /tmp/server-v5/api/
          cp api/server_intelligent.php /tmp/server-v5/api/
          cp admin_radio.php /tmp/server-v5/
          cp admin_server.php /tmp/server-v5/
          cat > /tmp/server-v5/INSTALAR-SERVER-V5.txt <<'TXT'
          EstradaPlay Server Central 500 MB v5 - Radio da Rodovia
          1. Extraia sobre a instalacao atual do Server Central v4.
          2. NAO apague config/config.php nem o banco.
          3. O endpoint api/radio.php cria as tabelas leves de presenca/sinalizacao no primeiro uso.
          4. O servidor NAO recebe nem armazena audio do radio; apenas presenca, SDP/ICE e alertas temporarios.
          5. Painel: /admin_radio.php
          6. STUN publico vem habilitado. Para redes que exigem relay, configure no banco/app_settings radio_turn_url, radio_turn_username e radio_turn_password apontando para um TURN proprio.
          TXT
          (cd /tmp/server-v5 && zip -qr "$GITHUB_WORKSPACE/EstradaPlay-SERVIDOR-500MB-CENTRAL-v5-RADIO.zip" .)
          unzip -l EstradaPlay-SERVIDOR-500MB-CENTRAL-v5-RADIO.zip | tee /tmp/server-v5-list.txt
          ! grep -Eq '\.(apk|mp3|wav|mp4|m4a|ogg)$|config\.php' /tmp/server-v5-list.txt
          sha256sum EstradaPlay-SERVIDOR-500MB-CENTRAL-v5-RADIO.zip | tee /tmp/server-v5-sha.txt

      - name: Publish 1.6.1 app release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.6.1-radio-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Estrada Play Comunista 1.6.1 - Rádio da Rodovia" --notes "Universal com Rádio da Rodovia PTT em tempo real. Reconhece localmente BR/RJ/MG/ES/SP, cria sala por rodovia + sentido + trecho aproximado e usa WebRTC P2P para áudio. O servidor só sinaliza presença/SDP/ICE e nunca armazena voz. Sala pública limitada a 8 aparelhos. Alertas rápidos temporários: acidente, objeto, obra, trânsito e chuva. Voz de segurança tem prioridade e silencia o rádio automaticamente. Serviço de rádio é non-sticky e encerra com a tarefa. Mantém todas as funções e estabilizações da Universal 1.6.0." Estrada-Play-Comunista-Universal-1.6.1-Radio.apk
          echo "APP_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish Server v5 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estradaplay-server-central-v5-radio-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "EstradaPlay - Central do Servidor 500 MB v5 - Rádio" --notes "Atualização leve do Server Central v4. Adiciona api/radio.php, presença por sala, sinalização WebRTC P2P, alertas temporários, limite de 8 participantes por trecho, limpeza automática e painel admin_radio.php com kill switch. Nenhum áudio é recebido ou armazenado pelo hosting. Mantém metadata-only e compatibilidade com a Universal 1.6.1." EstradaPlay-SERVIDOR-500MB-CENTRAL-v5-RADIO.zip

      - name: Temporary artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-1.6.1-Radio-and-Server-v5
          path: |
            Estrada-Play-Comunista-Universal-1.6.1-Radio.apk
            EstradaPlay-SERVIDOR-500MB-CENTRAL-v5-RADIO.zip
          retention-days: 1
          compression-level: 0
