name: Apply EstradaPlay 2.0.4 Offline Voice

permissions:
  contents: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/scripts/apply_204_activate_offline_voice.py'
      - '.github/workflows/apply-estradaplay-204-offline-voice.yml'
  workflow_dispatch:

concurrency:
  group: estradaplay-204-offline-voice
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-apk-build
          fetch-depth: 0

      - name: Apply 2.0.4 embedded voice
        run: python3 .github/scripts/apply_204_activate_offline_voice.py

      - name: Verify definitive source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '2.0.4'" estradaplay-app-v2/app/build.gradle
          grep -q 'OFFLINE_VOICE_V204' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/EstradaPlayOfflineVoice.java
          grep -q 'OFFLINE_VOICE_V204' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'OFFLINE_VOICE_V204' estradaplay-app-v2/tools/generate_voice_bank.py
          grep -q 'Generate embedded EstradaPlay voice' .github/workflows/build-estradaplay-v2.yml
          grep -q 'speakRoadLimitVoice' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'speakOverspeedVoice' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'speakHazardVoice' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java

      - name: Commit definitive 2.0.4 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estradaplay-app-v2/app/build.gradle \
                  estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'EstradaPlay 2.0.4: embedded offline voice bank'
          git push origin HEAD:agent/native-apk-build
