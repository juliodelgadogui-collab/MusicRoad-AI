name: EPC Server 2.3.6 Auth Persistence
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'api/bootstrap.php'
      - 'api/native_auth.php'
      - 'api/native_auth_diagnostic.php'
      - 'admin_auth_diagnostics.php'
      - '.github/workflows/build-epc-server-v236-auth-persist.yml'
  workflow_dispatch:

concurrency:
  group: epc-server-v236-auth-persist
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Validate auth persistence fix
        shell: bash
        run: |
          set -euo pipefail
          php -l api/bootstrap.php
          php -l api/native_auth.php
          php -l api/native_auth_diagnostic.php
          php -l admin_auth_diagnostics.php
          grep -q 'APP_SETTINGS_KEY_QUOTE_V236' api/bootstrap.php
          grep -Fq 'WHERE `key` = ? LIMIT 1' api/bootstrap.php
          grep -q 'AUTH_SALT_BRIDGE_V236' api/bootstrap.php
          grep -q 'native-auth-salt-v207.php' api/bootstrap.php
          grep -q 'SERVER_AUTH_PERSIST_V235' api/native_auth.php
          grep -q 'SERVER_AUTH_DIAG_V235' api/native_auth_diagnostic.php

      - name: Package incremental server hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/epc-v236
          mkdir -p /tmp/epc-v236/api
          cp api/bootstrap.php /tmp/epc-v236/api/bootstrap.php
          cp api/native_auth.php /tmp/epc-v236/api/native_auth.php
          cp api/native_auth_diagnostic.php /tmp/epc-v236/api/native_auth_diagnostic.php
          cp admin_auth_diagnostics.php /tmp/epc-v236/admin_auth_diagnostics.php
          cat > /tmp/epc-v236/LEIA-ME.txt <<'EOF'
          Estrada Play Comunista - Hotfix Servidor 2.3.6 - Persistencia de autenticacao

          O diagnostico do servidor encontrou falha na leitura de app_settings no MySQL/MariaDB.
          A coluna `key` agora e escapada corretamente nas leituras.

          IMPORTANTE:
          - O bootstrap preserva o salt privado que ja estava sendo usado e o copia para app_settings.
          - Isso evita trocar a identidade criptografica das credenciais existentes.
          - Nenhuma senha, token ou segredo acompanha este pacote.
          - Nao substitua config/config.php nem a pasta config do seu servidor.

          Instalacao:
          1. Extraia este ZIP na raiz do servidor, mantendo as pastas.
          2. Substitua os quatro arquivos incluidos.
          3. Abra admin_auth_diagnostics.php e atualize a pagina duas vezes.
          4. O esperado e: RESULTADO OK (ou apenas ATENCAO), Salt no banco OK, Fallback privado OK e probe OK.
          5. No app 2.3.4, faca login uma ultima vez se a credencial estiver REVOGADA. Depois feche e abra o app para testar a sessao persistente.
          EOF
          (cd /tmp/epc-v236 && zip -r "$GITHUB_WORKSPACE/Estrada-Play-Comunista-SERVIDOR-2.3.6-AUTH-PERSISTENCIA.zip" .)
          sha256sum Estrada-Play-Comunista-SERVIDOR-2.3.6-AUTH-PERSISTENCIA.zip | tee /tmp/epc-v236-sha.txt

      - name: Publish server hotfix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-server-2.3.6-auth-persist-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Estrada Play Comunista - Servidor 2.3.6 Auth Persistencia" \
            --notes "Hotfix incremental do servidor para a falha confirmada pelo painel de diagnostico: leitura de app_settings no MySQL/MariaDB usando a coluna key sem escape. O bootstrap tambem migra o salt privado ja efetivo para native_auth_salt_v207 antes da camada native_auth carregar, evitando troca de identidade criptografica. Inclui diagnostico atual. Nao altera config/config.php, nao contem credenciais e nao e implantado automaticamente no servidor." \
            Estrada-Play-Comunista-SERVIDOR-2.3.6-AUTH-PERSISTENCIA.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-SERVIDOR-2.3.6-AUTH-PERSISTENCIA
          path: Estrada-Play-Comunista-SERVIDOR-2.3.6-AUTH-PERSISTENCIA.zip
          retention-days: 7
