name: Estrada Play Comunista 1.5.1 Voice Reliability
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_comunista_voice_reliability_v151.py'
      - '.github/workflows/build-estrada-play-comunista-v151-voice.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0
      - name: Apply 1.5.1 voice reliability
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_estrada_play_comunista_voice_reliability_v151.py
          python3 tools/patch_estrada_play_comunista_voice_reliability_v151.py
      - name: Verify voice architecture
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          M=estrada-play-comunista-app/app/src/main/AndroidManifest.xml
          grep -q "versionName '1.5.1'" "$G"
          grep -q 'versionCode 151' "$G"
          grep -q 'VOICE_RELIABILITY_V151' "$J/RoadSafetyService.java"
          grep -q 'activeVoiceToken' "$J/RoadSafetyService.java"
          grep -q 'voiceTokenFromId' "$J/RoadSafetyService.java"
          grep -q 'requestLocalFocus' "$J/EstradaPlayOfflineVoice.java"
          grep -q 'audibleStart' "$J/EstradaPlayOfflineVoice.java"
          grep -q 'class VoiceSettings' "$J/VoiceSettings.java"
          grep -q 'class VoiceDiagnosticsActivity' "$J/VoiceDiagnosticsActivity.java"
          grep -q 'VoiceDiagnosticsActivity' "$M"
          grep -q 'DIAGNÓSTICO DE VOZ' "$J/DriveToolsActivity.java"
          grep -q 'RoadThoughts' "$J/RoadSafetyService.java"
          grep -q 'RoadSurfaceMonitor' "$J/RoadSafetyService.java"
          grep -q 'prefetchCoreStates' "$J/RoadPackStore.java"
          grep -q "versionName '2.0.11'" estradaplay-app-v2/app/build.gradle
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi
      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app
          git commit -m "Generate Comunista 1.5.1 voice reliability [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore
      - name: Generate and validate embedded voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          COUNT=$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)
          test "$COUNT" -ge 77
          for f in ep_radar_frente.wav ep_limite_radar.wav ep_reduza.wav ep_dist_0500.wav ep_speed_060.wav ep_quebra_molas_frente.wav; do test -s "estrada-play-comunista-app/app/src/main/res/raw/$f"; done
      - name: Build both APKs
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleVerticalDebug assembleHorizontalDebug
      - name: Verify identities and signatures
        shell: bash
        run: |
          set -euo pipefail
          V=estrada-play-comunista-app/app/build/outputs/apk/vertical/debug/app-vertical-debug.apk
          H=estrada-play-comunista-app/app/build/outputs/apk/horizontal/debug/app-horizontal-debug.apk
          test -f "$V" && test -f "$H"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$V" | tee /tmp/v151.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$H" | tee /tmp/h151.txt
          grep -q "package: name='com.estradaplay.comunista.vertical' versionCode='151' versionName='1.5.1'" /tmp/v151.txt
          grep -q "package: name='com.estradaplay.comunista.horizontal' versionCode='151' versionName='1.5.1'" /tmp/h151.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$V" >/tmp/v151-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$H" >/tmp/h151-cert.txt
          cp "$V" Estrada-Play-Comunista-Vertical-1.5.1.apk
          cp "$H" Estrada-Play-Comunista-Horizontal-1.5.1.apk
          sha256sum Estrada-Play-Comunista-Vertical-1.5.1.apk Estrada-Play-Comunista-Horizontal-1.5.1.apk | tee /tmp/v151-sha.txt
      - name: Publish 1.5.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.5.1-voice-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Estrada Play Comunista 1.5.1 - Voz Confiável" --notes "Correção específica de confiabilidade da voz. Cada fala possui sessão/token próprio, então callbacks atrasados de uma fala cancelada não podem mais restaurar volume ou abandonar foco de áudio de uma fala nova. A voz embarcada solicita foco antes do primeiro WAV, mas a música só é reduzida depois que o MediaPlayer confirma reprodução. Mudança de limite/excesso não atropela outra fala de segurança em andamento; radar e perigos continuam tendo prioridade. Adiciona Diagnóstico de Voz no app com teste da voz embarcada, teste do TTS Android e seleção Automático / Voz embarcada / TTS Android. Mantém toda a Inteligência Coletiva 1.5.0, radares offline RJ/MG/ES, dashcam, câmera opcional, pensamentos e versões Vertical/Horizontal. Sem WebView." Estrada-Play-Comunista-Vertical-1.5.1.apk Estrada-Play-Comunista-Horizontal-1.5.1.apk
      - name: Temporary artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-1.5.1
          path: |
            Estrada-Play-Comunista-Vertical-1.5.1.apk
            Estrada-Play-Comunista-Horizontal-1.5.1.apk
          retention-days: 1
          compression-level: 0
