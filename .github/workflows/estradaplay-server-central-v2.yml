name: EstradaPlay Server Central v2

permissions:
  contents: write

on:
  push:
    branches:
      - agent/native-apk-build
    paths:
      - '.github/workflows/estradaplay-server-central-v2.yml'
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-apk-build
          fetch-depth: 0

      - name: Integrate control center
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('admin.php')
          s = p.read_text(encoding='utf-8')
          if 'href="admin_server.php"' not in s:
              needle = '<div class="row"><a class="button secondary" href="admin_radares.php">'
              repl = '<div class="row"><a class="button secondary" href="admin_server.php">Central do Servidor</a><a class="button secondary" href="admin_radares.php">'
              if needle not in s:
                  raise SystemExit('admin toolbar anchor not found')
              s = s.replace(needle, repl, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('api/native_app.php')
          s = p.read_text(encoding='utf-8')
          old = "return ['tracks'=>$tracks,'active_roots'=>$roots,'last_sync'=>app_setting('native_library_last_sync',''),'db_driver'=>(string)db()->getAttribute(PDO::ATTR_DRIVER_NAME)];"
          new = "return ['tracks'=>$tracks,'active_roots'=>$roots,'last_sync'=>app_setting('native_library_last_sync',''),'catalog_version'=>server_catalog_version(),'catalog_changed_at'=>app_setting('catalog_changed_at',''),'db_driver'=>(string)db()->getAttribute(PDO::ATTR_DRIVER_NAME)];"
          if 'catalog_version' not in s:
              if old not in s:
                  raise SystemExit('native_library_meta anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('admin_server.php')
          s = p.read_text(encoding='utf-8')
          old = "if (($_GET['format'] ?? '') === 'json') {\n    json_response(['ok'=>true,'diagnostic'=>$diag,'folders'=>$folders,'history'=>$history]);\n}"
          new = """if (($_GET['format'] ?? '') === 'json') {
    $safeDiag = $diag;
    if (isset($safeDiag['health']) && is_array($safeDiag['health'])) unset($safeDiag['health']['cron_url']);
    $safeFolders = array_map(static function(array $row): array {
        unset($row['folder_id']);
        return $row;
    }, $folders);
    json_response(['ok'=>true,'diagnostic'=>$safeDiag,'folders'=>$safeFolders,'history'=>$history]);
}"""
          if '$safeFolders' not in s:
              if old not in s:
                  raise SystemExit('admin_server json anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate PHP and server-only architecture
        shell: bash
        run: |
          set -euo pipefail
          for f in api/bootstrap.php api/server_500mb.php api/native_library_sync.php api/native_app.php api/google_drive_public.php api/cron_drive_sync.php admin.php admin_server.php; do
            php -l "$f"
          done
          grep -q 'SERVER_500MB_V2' api/server_500mb.php
          grep -q 'drive_sync_history' api/server_500mb.php
          grep -q 'server_catalog_version' api/server_500mb.php
          grep -q 'last_sync_inserted' api/server_500mb.php
          grep -q 'Central do Servidor' admin.php
          grep -q 'Diagnóstico permanente' admin_server.php
          grep -q '\$safeFolders' admin_server.php
          grep -q "unset(\$safeDiag\['health'\]\['cron_url'\])" admin_server.php
          grep -q 'catalog_version' api/native_app.php
          grep -q "'cron'" api/cron_drive_sync.php
          ! git diff --name-only | grep -E '^(estradaplay-app|android-app)'

      - name: Commit server integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.php admin_server.php api/native_app.php
          git commit -m "Integrate EstradaPlay Server Control Center v2 [skip ci]" || true
          git push origin HEAD:agent/native-apk-build

      - name: Package server update
        shell: bash
        run: |
          set -euo pipefail
          PKG=/tmp/estradaplay-server-central-v2
          rm -rf "$PKG"
          mkdir -p "$PKG/api"
          cp api/bootstrap.php "$PKG/api/"
          cp api/server_500mb.php "$PKG/api/"
          cp api/native_library_sync.php "$PKG/api/"
          cp api/native_app.php "$PKG/api/"
          cp api/google_drive_public.php "$PKG/api/"
          cp api/cron_drive_sync.php "$PKG/api/"
          cp admin.php admin_server.php "$PKG/"
          cat > "$PKG/LEIA-PRIMEIRO.txt" <<'EOF'
          EstradaPlay - Central do Servidor 500 MB v2

          Atualização SOMENTE DO SERVIDOR. Não contém APK.
          Extraia na raiz da instalação e sobrescreva os arquivos incluídos.
          NÃO contém config/config.php, banco, usuários, senhas ou músicas.

          Novidades:
          - Central do Servidor protegida pelo login de administrador;
          - uso gerenciado dos 500 MB e alertas em 350/400/450 MB;
          - histórico de até 100 sincronizações;
          - status e mudanças reais por pasta pública do Google Drive;
          - sincronização individual por pasta;
          - versão incremental do catálogo;
          - diagnóstico permanente em admin_server.php e admin_server.php?format=json;
          - limpeza/rotação manual e automática;
          - áudio continua 100% no Google Drive público, sem cópia no servidor.

          Depois de instalar, acesse:
          /admin_server.php
          EOF
          (cd "$PKG" && zip -qr "$GITHUB_WORKSPACE/EstradaPlay-SERVIDOR-500MB-CENTRAL-v2.zip" .)
          sha256sum EstradaPlay-SERVIDOR-500MB-CENTRAL-v2.zip

      - name: Publish server release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estradaplay-server-central-v2-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$(git rev-parse HEAD)" \
            --title "EstradaPlay · Central do Servidor 500 MB v2" \
            --notes "Atualização somente do servidor: Central protegida, histórico de sincronização, status por pasta, versão do catálogo, alertas de espaço e diagnóstico permanente. Nenhuma alteração no APK." \
            EstradaPlay-SERVIDOR-500MB-CENTRAL-v2.zip
