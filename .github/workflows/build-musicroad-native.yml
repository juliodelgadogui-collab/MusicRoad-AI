name: Build MusicRoad Native

on:
  workflow_dispatch:
  push:
    branches:
      - agent/native-apk-build
    paths:
      - 'android-app-v2/**'
      - 'api/road_catalog.php'
      - 'api/offline_road.php'
      - '.github/workflows/build-musicroad-native.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate PHP road APIs
        run: |
          php -l api/road_catalog.php
          php -l api/offline_road.php

      - name: Build Android directly from android-app-v2
        working-directory: android-app-v2
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicRoad-AI-native-2.4.1-debug-apk
          path: android-app-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
