name: EPC Estrada Play Comunista Teste Unificado
permissions:
  contents: read
on:
  push:
    branches: [agent/estrada-play-comunista-teste-unificado]
    paths:
      - 'estrada-play-comunista-app/**'
      - '.github/workflows/build-epc-unified-test.yml'
  workflow_dispatch:

concurrency:
  group: epc-unified-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista-teste-unificado
          fetch-depth: 0

      - name: Validate unified test architecture
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          grep -q "teste {" "$APP/app/build.gradle"
          grep -q "applicationIdSuffix '.teste'" "$APP/app/build.gradle"
          grep -q "versionCode 235" "$APP/app/build.gradle"
          grep -q "versionNameSuffix '-teste-unificado'" "$APP/app/build.gradle"
          grep -q "appLabel: 'Estrada Play Comunista Teste'" "$APP/app/build.gradle"
          grep -q 'UNIFIED_TEST_V235' "$J/DriveToolsActivity.java"
          grep -q 'CENTRAL UNIFICADA' "$J/DriveToolsActivity.java"
          grep -q 'MEU VEÍCULO' "$J/DriveToolsActivity.java"
          grep -q 'OCULTADOS NESTE TESTE' "$J/DriveToolsActivity.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$APP/app/src/main/java"; then
            echo 'WebView detected'; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare development signing key
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          base64 -d "$APP/signing/estradaplay-dev.keystore.b64" > "$APP/signing/estradaplay-dev.keystore"

      - name: Generate embedded Portuguese voice bank
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-test-voice && mkdir -p /tmp/epc-test-voice
          tar -xjf "$MODEL" -C /tmp/epc-test-voice
          python3 "$APP/tools/generate_voice_bank.py" --model-root /tmp/epc-test-voice --output "$APP/app/src/main/res/raw" --metadata-output "$APP/app/src/main/assets/estradaplay_voice"
          test "$(find "$APP/app/src/main/res/raw" -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 77

      - name: Unit tests and build test APK
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          (cd "$APP" && gradle --no-daemon testTesteDebugUnitTest assembleTesteDebug)
          A="$APP/app/build/outputs/apk/teste/debug/app-teste-debug.apk"
          test -f "$A"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$A" | tee /tmp/epc-test-badging.txt
          grep -q "package: name='com.estradaplay.comunista.teste' versionCode='235' versionName='2.3.4-teste-unificado'" /tmp/epc-test-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$A"
          cp "$A" Estrada-Play-Comunista-Teste-Unificado-2.3.4.apk
          sha256sum Estrada-Play-Comunista-Teste-Unificado-2.3.4.apk | tee /tmp/epc-test-sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-Teste-Unificado-2.3.4
          path: Estrada-Play-Comunista-Teste-Unificado-2.3.4.apk
          retention-days: 7
          compression-level: 0
