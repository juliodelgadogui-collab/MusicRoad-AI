name: Cleanup old Actions artifacts

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/workflows/cleanup-artifacts.yml'
  workflow_dispatch:

jobs:
  cleanup-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing Actions artifacts only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Listing Actions artifacts in ${GITHUB_REPOSITORY}..."
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' || true)
          if [ -z "$ids" ]; then
            echo "No Actions artifacts found."
          else
            count=0
            while read -r id; do
              [ -z "$id" ] && continue
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              count=$((count+1))
            done <<< "$ids"
            echo "Deleted ${count} Actions artifacts."
          fi

      - name: Trigger fresh EstradaPlay build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sleep 10
          gh workflow run build-native-apk.yml --ref agent/native-apk-build
          echo "Fresh build dispatched."
