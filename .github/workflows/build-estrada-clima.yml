name: Build Estrada Clima Universal

on:
  pull_request:
    branches:
      - main
    paths:
      - 'build/estrada-clima-0.1.0-source.tar.gz.b64'
      - '.github/workflows/build-estrada-clima.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-universal:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore source
        run: |
          base64 -d build/estrada-clima-0.1.0-source.tar.gz.b64 | tar -xzf -
          test -f EstradaClima-0.1.0/settings.gradle

      - name: Build Universal APK
        working-directory: EstradaClima-0.1.0
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare Universal artifact
        run: |
          mkdir -p out
          cp EstradaClima-0.1.0/app/build/outputs/apk/debug/app-debug.apk out/Estrada-Clima-0.1.0-UNIVERSAL.apk
          sha256sum out/Estrada-Clima-0.1.0-UNIVERSAL.apk | tee out/SHA256.txt

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Clima-0.1.0-UNIVERSAL
          path: out/*
          if-no-files-found: error
          retention-days: 7
