name: Repair EstradaPlay 2.0.9 Source Only

permissions:
  contents: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/workflows/repair-estradaplay-209-source.yml'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-apk-build
          fetch-depth: 0

      - name: Apply permanent 2.0.9 repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path('.').rglob('*.php'):
              if any(part in {'vendor', '.git'} for part in p.parts):
                  continue
              s = p.read_text(encoding='utf-8')
              n = re.sub(r"datetime\(\s*(['\"])now\1\s*\)", 'CURRENT_TIMESTAMP', s, flags=re.I)
              if n != s:
                  p.write_text(n, encoding='utf-8')
                  print('timestamp:', p)

          p = Path('api/client_state.php')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'\$stmt = db\(\)->prepare\("INSERT INTO client_device_state.*?\$stmt->execute\(\[\(int\)\$user\[\'id\'\],\$deviceId,\$deviceName,\$musicPermission,\$locationPermission,\$folderCount,\$trackCount,\$lat,\$lon\]\);', re.S)
          replacement = r'''// SERVER_DB_COMPAT_V209: portable upsert for SQLite and MySQL/MariaDB.
          $now = date('Y-m-d H:i:s');
          $check = db()->prepare('SELECT id FROM client_device_state WHERE user_id=? AND device_id=? LIMIT 1');
          $check->execute([(int)$user['id'],$deviceId]);
          $existingId = (int)($check->fetchColumn() ?: 0);
          if ($existingId > 0) {
              $stmt = db()->prepare('UPDATE client_device_state SET device_name=?,music_permission=?,location_permission=?,music_folder_count=?,music_track_count=?,last_latitude=COALESCE(?,last_latitude),last_longitude=COALESCE(?,last_longitude),last_seen_at=? WHERE id=?');
              $stmt->execute([$deviceName,$musicPermission,$locationPermission,$folderCount,$trackCount,$lat,$lon,$now,$existingId]);
          } else {
              $stmt = db()->prepare('INSERT INTO client_device_state (user_id,device_id,device_name,music_permission,location_permission,music_folder_count,music_track_count,last_latitude,last_longitude,last_seen_at) VALUES (?,?,?,?,?,?,?,?,?,?)');
              $stmt->execute([(int)$user['id'],$deviceId,$deviceName,$musicPermission,$locationPermission,$folderCount,$trackCount,$lat,$lon,$now]);
          }'''
          n, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('client_state block not found')
          p.write_text(n, encoding='utf-8')

          p = Path('api/bootstrap.php')
          s = p.read_text(encoding='utf-8')
          marker = '// SERVER_DB_COMPAT_V209: runtime PHP/SQL is normalized for SQLite and MySQL/MariaDB.\n'
          anchor = '// DB_COMPAT_V207: minimum runtime schema compatible with SQLite and MySQL/MariaDB.\n'
          if marker not in s:
              if anchor not in s: raise SystemExit('bootstrap anchor not found')
              p.write_text(s.replace(anchor, marker + anchor, 1), encoding='utf-8')

          p = Path('estradaplay-app-v2/app/src/main/java/com/estradaplay/app/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          marker = '// LIBRARY_FAILSAFE_V209: paged catalog first, bounded legacy catalog on any server-side page failure.\n'
          anchor = '// LIBRARY_PAGED_V208: fetch the catalog in bounded pages so library size cannot break the app.\n'
          if marker not in s:
              if anchor not in s: raise SystemExit('MainActivity anchor not found')
              s = s.replace(anchor, marker + anchor, 1)
          s = s.replace('if (r.code == 400 || r.code == 404) return fetchLegacyCatalog();', 'if (r.code >= 400) return fetchLegacyCatalog();')
          s = s.replace('if (raw == null) throw new Exception("Resposta da biblioteca sem faixas");', 'if (raw == null) return fetchLegacyCatalog();')
          s = s.replace('if (r.code == 400 || r.code == 404) {\n        r = api.getLong("api/native_app.php?action=library_sync");', 'if (!r.ok()) {\n        r = api.getLong("api/native_app.php?action=library_sync");')
          p.write_text(s, encoding='utf-8')

          p = Path('estradaplay-app-v2/app/build.gradle')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'versionCode\s+\d+', 'versionCode 209', s, count=1)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '2.0.9'", s, count=1)
          p.write_text(s, encoding='utf-8')

          Path('diagnostico_estradaplay_209.php').write_text(r'''<?php
          declare(strict_types=1);
          require __DIR__ . '/api/bootstrap.php';
          header('Content-Type: application/json; charset=utf-8');
          $out=['diagnostic'=>'EstradaPlay-server-2.0.9','generated_at'=>gmdate('c'),'checks'=>[]];
          $add=static function(string $name,bool $ok,$detail=null) use (&$out):void{$out['checks'][]=['name'=>$name,'ok'=>$ok,'detail'=>$detail];};
          try{$driver=(string)db()->getAttribute(PDO::ATTR_DRIVER_NAME);$add('Banco',true,$driver);}catch(Throwable $e){$add('Banco',false,$e->getMessage());echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT);exit;}
          try{$v=db()->query('SELECT CURRENT_TIMESTAMP')->fetchColumn();$add('CURRENT_TIMESTAMP',(bool)$v,$v);}catch(Throwable $e){$add('CURRENT_TIMESTAMP',false,$e->getMessage());}
          foreach(['users','music_library','drive_folders','client_device_state','audit_logs'] as $t){try{$c=(int)db()->query('SELECT COUNT(*) FROM '.$t)->fetchColumn();$add('Tabela '.$t,true,$c);}catch(Throwable $e){$add('Tabela '.$t,false,$e->getMessage());}}
          try{$rows=db()->query('SELECT id,title,artist,album,origin,origin_ref,source_url,mime_type,file_size,folder,duration FROM music_library ORDER BY id ASC LIMIT 500')->fetchAll()?:[];$bytes=strlen(json_encode(['ok'=>true,'tracks'=>$rows],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));$add('Página de 500 faixas',count($rows)<=500,['tracks'=>count($rows),'json_bytes'=>$bytes]);}catch(Throwable $e){$add('Página de 500 faixas',false,$e->getMessage());}
          $out['ok']=!array_filter($out['checks'],fn($c)=>!$c['ok']);echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT);
          ''', encoding='utf-8')
          PY

      - name: Audit and lint
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE "datetime\(['\"]now['\"]\)" --include='*.php' .; then exit 1; fi
          if grep -n 'ON CONFLICT' api/client_state.php; then exit 1; fi
          grep -q 'SERVER_DB_COMPAT_V209' api/bootstrap.php
          grep -q 'SERVER_DB_COMPAT_V209' api/client_state.php
          grep -q 'LIBRARY_FAILSAFE_V209' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/MainActivity.java
          grep -q "versionName '2.0.9'" estradaplay-app-v2/app/build.gradle
          php -l api/bootstrap.php
          php -l api/client_state.php
          php -l api/google_drive_public.php
          php -l api/native_app.php
          php -l api/radar_route_helpers.php
          php -l admin.php
          php -l login.php
          php -l client.php
          php -l diagnostico_estradaplay_209.php

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api admin.php login.php client.php diagnostico_estradaplay_209.php estradaplay-app-v2/app/build.gradle estradaplay-app-v2/app/src/main/java/com/estradaplay/app/MainActivity.java
          git commit -m "Fix EstradaPlay 2.0.9 MariaDB server compatibility"
          git push origin HEAD:agent/native-apk-build
