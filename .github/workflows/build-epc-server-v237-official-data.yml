name: EPC Server 2.3.7 Official Road Data
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'api/official_data_policy.php'
      - 'api/server_context_v7.php'
      - 'admin_official_data_cleanup.php'
      - '.github/workflows/build-epc-server-v237-official-data.yml'
  workflow_dispatch:

concurrency:
  group: epc-server-v237-official-data
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Validate official-only data policy
        shell: bash
        run: |
          set -euo pipefail
          php -l api/official_data_policy.php
          php -l api/server_context_v7.php
          php -l admin_official_data_cleanup.php
          grep -q 'EPC_OFFICIAL_DATA_V250' api/official_data_policy.php
          grep -q "return \['DNIT', 'DER'\]" api/official_data_policy.php
          grep -q "road_data_mode.*OFFICIAL" api/server_context_v7.php
          grep -q 'LIMPAR_BASE_OFICIAL' admin_official_data_cleanup.php
          grep -q "road_live_events" admin_official_data_cleanup.php
          grep -q "road_hazards" admin_official_data_cleanup.php

      - name: Package server cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/epc-v237
          mkdir -p /tmp/epc-v237/api
          cp api/official_data_policy.php /tmp/epc-v237/api/official_data_policy.php
          cp api/server_context_v7.php /tmp/epc-v237/api/server_context_v7.php
          cp admin_official_data_cleanup.php /tmp/epc-v237/admin_official_data_cleanup.php
          cat > /tmp/epc-v237/LEIA-ME.txt <<'EOF'
          Estrada Play Comunista - Servidor 2.3.7 - Base Rodoviaria Oficial

          Objetivo:
          remover dados de teste/comunitarios da inteligencia rodoviaria e deixar o
          contexto principal usando apenas fontes oficiais reconhecidas pelo sistema.

          Fontes oficiais reconhecidas nesta versao:
          - DNIT
          - DER

          O que o modo OFICIAL faz no Server 7.0:
          - nao exibe eventos LIVE/comunitarios;
          - nao exibe transito colaborativo;
          - nao exibe combustivel informado por usuarios;
          - filtra perigos/radares para fontes oficiais;
          - mantem clima externo e navegacao normalmente.

          Limpeza opcional do banco:
          1. Faca BACKUP do banco de dados.
          2. Extraia este ZIP na raiz do servidor, preservando as pastas.
          3. Entre no painel como administrador.
          4. Abra admin_official_data_cleanup.php.
          5. PRIMEIRO confira a tabela de fontes e quantidades.
          6. Se estiver correto, digite exatamente LIMPAR_BASE_OFICIAL.
          7. A pagina apaga somente as bases rodoviarias nao oficiais/comunitarias.

          A limpeza remove:
          - road_live_events e votos;
          - amostras colaborativas de transito;
          - precos de combustivel enviados por usuarios;
          - reportes rodoviarios do app;
          - hazards nao oficiais, incluindo OPENSTREETMAP;
          - radares sem qualquer fonte DNIT/DER;
          - fontes/logs de importacao nao oficiais;
          - cache meteorologico antigo (sera recriado automaticamente).

          A limpeza NAO remove:
          - usuarios;
          - autenticacao ou credenciais de aparelho;
          - config/config.php;
          - app_settings criticos;
          - musicas/biblioteca;
          - Comboio;
          - dados administrativos fora da inteligencia rodoviaria.

          Nenhum arquivo deste pacote executa a exclusao automaticamente.
          A limpeza so acontece apos login de administrador + CSRF + confirmacao textual.
          EOF
          (cd /tmp/epc-v237 && zip -r "$GITHUB_WORKSPACE/Estrada-Play-Comunista-SERVIDOR-2.3.7-BASE-OFICIAL.zip" .)
          sha256sum Estrada-Play-Comunista-SERVIDOR-2.3.7-BASE-OFICIAL.zip | tee /tmp/epc-v237-sha.txt

      - name: Publish server package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-server-2.3.7-base-oficial-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Estrada Play Comunista - Servidor 2.3.7 Base Oficial" \
            --notes "Pacote seguro para separar a inteligencia rodoviaria oficial de dados comunitarios/teste. O Server 7.0 passa a operar em modo OFICIAL por padrao, reconhecendo DNIT e DER como fontes oficiais. Inclui painel de PREVIA e limpeza manual protegida por login admin, CSRF e confirmacao textual. Nenhuma exclusao e executada automaticamente e config/config.php nao e alterado." \
            Estrada-Play-Comunista-SERVIDOR-2.3.7-BASE-OFICIAL.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-SERVIDOR-2.3.7-BASE-OFICIAL
          path: Estrada-Play-Comunista-SERVIDOR-2.3.7-BASE-OFICIAL.zip
          retention-days: 7
