name: EstradaPlay Server 500MB

permissions:
  contents: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/workflows/estradaplay-server-500mb.yml'
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-apk-build
          fetch-depth: 0

      - name: Apply lightweight server architecture
        shell: bash
        run: |
          set -euo pipefail
          cat > api/server_500mb.php <<'PHP'
          <?php
          declare(strict_types=1);

          // SERVER_500MB_V1: metadata-only runtime for small shared hosting.
          function server_ensure_500mb_schema(): void
          {
              try {
                  $driver = (string)db()->getAttribute(PDO::ATTR_DRIVER_NAME);
                  if ($driver !== 'mysql') return;

                  $cols = schema_columns('music_library');
                  $defs = [
                      'drive_root_id' => 'INT NULL',
                      'sync_token' => 'VARCHAR(64) NULL',
                      'last_seen_at' => 'DATETIME NULL',
                  ];
                  foreach ($defs as $name => $definition) {
                      if (!in_array($name, $cols, true)) {
                          db()->exec("ALTER TABLE music_library ADD COLUMN {$name} {$definition}");
                      }
                  }

                  $folderCols = schema_columns('drive_folders');
                  $folderDefs = [
                      'last_sync_duration_ms' => 'INT NULL',
                      'last_sync_tracks' => 'INT NOT NULL DEFAULT 0',
                      'last_sync_removed' => 'INT NOT NULL DEFAULT 0',
                      'last_sync_errors' => 'INT NOT NULL DEFAULT 0',
                  ];
                  foreach ($folderDefs as $name => $definition) {
                      if (!in_array($name, $folderCols, true)) {
                          db()->exec("ALTER TABLE drive_folders ADD COLUMN {$name} {$definition}");
                      }
                  }

                  server_mysql_index('music_library', 'idx_music_drive_root', 'drive_root_id');
                  server_mysql_index('music_library', 'idx_music_sync_token', 'sync_token');
                  server_mysql_index('music_library', 'idx_music_last_seen', 'last_seen_at');
                  server_mysql_index('drive_folders', 'idx_drive_active', 'active');
                  server_mysql_index('client_device_state', 'idx_device_last_seen', 'last_seen_at');
                  server_mysql_index('audit_logs', 'idx_audit_created', 'created_at');
              } catch (Throwable $e) {
                  error_log('SERVER_500MB schema: ' . $e->getMessage());
              }
          }

          function server_mysql_index(string $table, string $index, string $column): void
          {
              try {
                  $s = db()->prepare('SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=? AND INDEX_NAME=?');
                  $s->execute([$table, $index]);
                  if ((int)$s->fetchColumn() === 0) {
                      $safeTable = preg_replace('/[^A-Za-z0-9_]/', '', $table);
                      $safeIndex = preg_replace('/[^A-Za-z0-9_]/', '', $index);
                      $safeColumn = preg_replace('/[^A-Za-z0-9_]/', '', $column);
                      db()->exec("CREATE INDEX {$safeIndex} ON {$safeTable} ({$safeColumn})");
                  }
              } catch (Throwable $e) {}
          }

          function server_rotate_logs(): void
          {
              $dir = dirname(__DIR__) . '/logs';
              if (!is_dir($dir)) return;
              $file = $dir . '/php-error.log';
              $max = 2 * 1024 * 1024;
              if (!is_file($file) || filesize($file) <= $max) return;
              @unlink($file . '.3');
              if (is_file($file . '.2')) @rename($file . '.2', $file . '.3');
              if (is_file($file . '.1')) @rename($file . '.1', $file . '.2');
              @rename($file, $file . '.1');
              @touch($file);
          }

          function server_housekeeping(): void
          {
              static $ran = false;
              if ($ran) return;
              $ran = true;
              server_rotate_logs();
              try {
                  $last = (int)app_setting('server_housekeeping_ts', '0');
                  if ($last > 0 && time() - $last < 21600) return;
                  $cut = date('Y-m-d H:i:s', time() - 30 * 86400);
                  $s = db()->prepare('DELETE FROM audit_logs WHERE created_at < ?');
                  $s->execute([$cut]);
                  set_app_setting('server_housekeeping_ts', (string)time());
              } catch (Throwable $e) {
                  error_log('SERVER_500MB housekeeping: ' . $e->getMessage());
              }
          }

          function server_cron_key(): string
          {
              $key = trim((string)app_setting('server_cron_key', ''));
              if ($key !== '') return $key;
              $key = bin2hex(random_bytes(24));
              set_app_setting('server_cron_key', $key);
              return $key;
          }

          function server_health_snapshot(): array
          {
              server_ensure_500mb_schema();
              $root = dirname(__DIR__);
              $total = @disk_total_space($root) ?: 0;
              $free = @disk_free_space($root) ?: 0;
              $dbBytes = 0;
              try {
                  if ((string)db()->getAttribute(PDO::ATTR_DRIVER_NAME) === 'mysql') {
                      $dbBytes = (int)db()->query('SELECT COALESCE(SUM(data_length+index_length),0) FROM information_schema.TABLES WHERE table_schema=DATABASE()')->fetchColumn();
                  }
              } catch (Throwable $e) {}
              $logBytes = 0;
              foreach (glob($root . '/logs/*') ?: [] as $f) if (is_file($f)) $logBytes += (int)filesize($f);
              try { $tracks = (int)db()->query('SELECT COUNT(*) FROM music_library')->fetchColumn(); } catch (Throwable $e) { $tracks = 0; }
              try { $roots = (int)db()->query('SELECT COUNT(*) FROM drive_folders WHERE active=1')->fetchColumn(); } catch (Throwable $e) { $roots = 0; }
              $host = (string)($_SERVER['HTTP_HOST'] ?? 'seu-dominio');
              $scheme = (!empty($_SERVER['HTTPS']) && $_SERVER['HTTPS'] !== 'off') ? 'https' : 'http';
              $cron = $scheme . '://' . $host . '/api/cron_drive_sync.php?key=' . rawurlencode(server_cron_key());
              return [
                  'disk_total'=>$total,'disk_free'=>$free,'disk_used'=>max(0,$total-$free),
                  'disk_total_h'=>server_human_bytes($total),'disk_free_h'=>server_human_bytes($free),'disk_used_h'=>server_human_bytes(max(0,$total-$free)),
                  'db_bytes'=>$dbBytes,'db_h'=>server_human_bytes($dbBytes),
                  'logs_bytes'=>$logBytes,'logs_h'=>server_human_bytes($logBytes),
                  'tracks'=>$tracks,'active_roots'=>$roots,
                  'last_sync'=>(string)app_setting('native_library_last_sync','Nunca'),
                  'cron_url'=>$cron,
              ];
          }

          function server_human_bytes(int|float $bytes): string
          {
              $bytes = max(0, (float)$bytes);
              foreach (['B','KB','MB','GB','TB'] as $unit) {
                  if ($bytes < 1024 || $unit === 'TB') return number_format($bytes, $unit === 'B' ? 0 : 1, ',', '.') . ' ' . $unit;
                  $bytes /= 1024;
              }
              return '0 B';
          }

          function server_sync_active_drive_folders(bool $force = false, array $onlyIds = []): array
          {
              if (function_exists('set_time_limit')) @set_time_limit(180);
              ensure_schema();
              server_ensure_500mb_schema();

              if (!$force && !$onlyIds) {
                  $lastRaw = trim((string)app_setting('native_library_last_sync', ''));
                  $last = $lastRaw !== '' ? strtotime($lastRaw) : false;
                  if ($last && time() - $last < 300) {
                      return ['skipped'=>true,'reason'=>'catalog_fresh','roots'=>0,'folders'=>0,'tracks'=>0,'inserted'=>0,'updated'=>0,'removed'=>0,'errors'=>[],'last_sync'=>$lastRaw];
                  }
              }

              $lock = server_sync_lock_acquire();
              if (!$lock) {
                  return ['skipped'=>true,'reason'=>'sync_already_running','roots'=>0,'folders'=>0,'tracks'=>0,'inserted'=>0,'updated'=>0,'removed'=>0,'errors'=>[],'last_sync'=>(string)app_setting('native_library_last_sync','')];
              }

              $startedAll = microtime(true);
              try {
                  $sql = 'SELECT id,name,folder_id,folder_link FROM drive_folders WHERE active=1';
                  $params = [];
                  $ids = array_values(array_filter(array_map('intval', $onlyIds), fn($v) => $v > 0));
                  if ($ids) {
                      $sql .= ' AND id IN (' . implode(',', array_fill(0, count($ids), '?')) . ')';
                      $params = $ids;
                  }
                  $sql .= ' ORDER BY id ASC';
                  $q = db()->prepare($sql); $q->execute($params);
                  $roots = $q->fetchAll() ?: [];
                  $stats = ['skipped'=>false,'roots'=>count($roots),'folders'=>0,'tracks'=>0,'inserted'=>0,'updated'=>0,'removed'=>0,'errors'=>[]];
                  $apiKey = google_api_key();

                  foreach ($roots as $root) {
                      $rootStarted = microtime(true);
                      $rootId = (int)$root['id'];
                      $visited = [];
                      $rootName = trim((string)($root['name'] ?? '')) ?: 'Google Drive';
                      $syncToken = bin2hex(random_bytes(12));
                      $beforeTracks = (int)$stats['tracks'];
                      $beforeInserted = (int)$stats['inserted'];
                      $beforeUpdated = (int)$stats['updated'];
                      $beforeErrors = count($stats['errors']);
                      $GLOBALS['estradaplay_sync_root_id'] = $rootId;
                      $GLOBALS['estradaplay_sync_token'] = $syncToken;
                      try {
                          native_library_scan_folder((string)$root['folder_id'], [$rootName], $apiKey, $visited, $stats, 0);
                          $rootErrors = count($stats['errors']) - $beforeErrors;
                          $removed = 0;
                          if ($rootErrors === 0) $removed = server_sync_prune_root($rootId, $syncToken);
                          $stats['removed'] += $removed;
                          $rootTracks = max(0, (int)$stats['tracks'] - $beforeTracks);
                          $duration = (int)round((microtime(true)-$rootStarted)*1000);
                          $status = 'OK: '.$rootTracks.' músicas verificadas'.($removed > 0 ? ' | '.$removed.' removida(s)' : '').($rootErrors > 0 ? ' | '.$rootErrors.' aviso(s)' : '');
                          $u = db()->prepare('UPDATE drive_folders SET last_import_at=?,last_status=?,last_sync_duration_ms=?,last_sync_tracks=?,last_sync_removed=?,last_sync_errors=? WHERE id=?');
                          $u->execute([date('Y-m-d H:i:s'),$status,$duration,$rootTracks,$removed,$rootErrors,$rootId]);
                      } catch (Throwable $e) {
                          $stats['errors'][] = $rootName.': '.$e->getMessage();
                          $duration = (int)round((microtime(true)-$rootStarted)*1000);
                          try {
                              $u = db()->prepare('UPDATE drive_folders SET last_import_at=?,last_status=?,last_sync_duration_ms=?,last_sync_errors=? WHERE id=?');
                              $u->execute([date('Y-m-d H:i:s'),'Erro: '.$e->getMessage(),$duration,1,$rootId]);
                          } catch (Throwable $ignored) {}
                      } finally {
                          unset($GLOBALS['estradaplay_sync_root_id'],$GLOBALS['estradaplay_sync_token']);
                      }
                  }
                  set_app_setting('native_library_last_sync', date('Y-m-d H:i:s'));
                  set_app_setting('native_library_last_duration_ms', (string)(int)round((microtime(true)-$startedAll)*1000));
                  audit_log('drive.sync', ['roots'=>$stats['roots'],'tracks'=>$stats['tracks'],'inserted'=>$stats['inserted'],'updated'=>$stats['updated'],'removed'=>$stats['removed'],'errors'=>count($stats['errors'])]);
                  return $stats;
              } finally {
                  server_sync_lock_release($lock);
              }
          }

          function server_sync_prune_root(int $rootId, string $token): int
          {
              if ($rootId <= 0 || $token === '') return 0;
              $s = db()->prepare("DELETE FROM music_library WHERE origin='Google Drive' AND drive_root_id=? AND sync_token IS NOT NULL AND sync_token<>?");
              $s->execute([$rootId,$token]);
              return $s->rowCount();
          }

          function server_sync_lock_acquire(): array|false
          {
              try {
                  if ((string)db()->getAttribute(PDO::ATTR_DRIVER_NAME) === 'mysql') {
                      $s = db()->query("SELECT GET_LOCK('estradaplay_drive_sync',0)");
                      if ((int)$s->fetchColumn() === 1) return ['type'=>'mysql'];
                      return false;
                  }
              } catch (Throwable $e) {}
              $path = sys_get_temp_dir() . '/estradaplay-drive-sync.lock';
              $fh = @fopen($path, 'c+');
              if (!$fh || !@flock($fh, LOCK_EX | LOCK_NB)) { if ($fh) @fclose($fh); return false; }
              return ['type'=>'file','handle'=>$fh];
          }

          function server_sync_lock_release(array $lock): void
          {
              if (($lock['type'] ?? '') === 'mysql') {
                  try { db()->query("SELECT RELEASE_LOCK('estradaplay_drive_sync')"); } catch (Throwable $e) {}
                  return;
              }
              if (($lock['type'] ?? '') === 'file' && isset($lock['handle']) && is_resource($lock['handle'])) {
                  @flock($lock['handle'], LOCK_UN); @fclose($lock['handle']);
              }
          }
          PHP

          cat > api/cron_drive_sync.php <<'PHP'
          <?php
          declare(strict_types=1);
          require_once __DIR__ . '/bootstrap.php';
          require_once __DIR__ . '/native_library_sync.php';

          $allowed = PHP_SAPI === 'cli';
          if (!$allowed) {
              $given = trim((string)($_GET['key'] ?? ''));
              $allowed = $given !== '' && hash_equals(server_cron_key(), $given);
          }
          if (!$allowed) json_response(['ok'=>false,'error'=>'Chave de cron inválida.'],403);

          $sync = native_library_sync_active_drive_folders(false);
          if (PHP_SAPI === 'cli') {
              echo json_encode(['ok'=>true,'sync'=>$sync], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES) . PHP_EOL;
              exit;
          }
          json_response(['ok'=>true,'sync'=>$sync]);
          PHP

          python3 - <<'PY'
          from pathlib import Path
          import re

          # bootstrap: load 500 MB runtime, run migrations/housekeeping, and stop production test-account creation.
          p = Path('api/bootstrap.php')
          s = p.read_text(encoding='utf-8')
          if "server_500mb.php" not in s:
              s += "\n\nrequire_once __DIR__ . '/server_500mb.php';\nserver_rotate_logs();\n"
          s = s.replace(
              "    try {\n        db()->exec(\"UPDATE users SET role = 'client' WHERE role IN ('user','cliente')\");\n        db()->exec(\"UPDATE users SET status = 'active' WHERE status IS NULL OR status = ''\");\n    } catch (Throwable $e) {}\n}",
              "    try {\n        db()->exec(\"UPDATE users SET role = 'client' WHERE role IN ('user','cliente')\");\n        db()->exec(\"UPDATE users SET status = 'active' WHERE status IS NULL OR status = ''\");\n    } catch (Throwable $e) {}\n    if (function_exists('server_ensure_500mb_schema')) server_ensure_500mb_schema();\n}",
              1
          )
          s = s.replace(
              "function ensure_default_users(): void\n{\n    ensure_schema();\n    $now = date('Y-m-d H:i:s');",
              "function ensure_default_users(): void\n{\n    ensure_schema();\n    global $config;\n    if (($config['env'] ?? 'production') !== 'development') return;\n    $now = date('Y-m-d H:i:s');",
              1
          )
          s = s.replace(
              "function ensure_runtime_tables(): void { ensure_schema(); }",
              "function ensure_runtime_tables(): void { ensure_schema(); if (function_exists('server_housekeeping')) server_housekeeping(); }",
              1
          )
          p.write_text(s, encoding='utf-8')

          # native sync: delegate scheduling/locking/pruning to the lightweight runtime.
          p = Path('api/native_library_sync.php')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r"function native_library_sync_active_drive_folders\(\): array\n\{.*?\n\}\n\nfunction native_library_scan_folder", re.S)
          repl = "function native_library_sync_active_drive_folders(bool $force = false, array $onlyIds = []): array\n{\n    return server_sync_active_drive_folders($force, $onlyIds);\n}\n\nfunction native_library_scan_folder"
          s, n = pattern.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit('native sync function anchor not found')

          save_pat = re.compile(r"function native_library_save_track\(array \$file, array \$path, array &\$stats\): void\n\{.*?\n\}", re.S)
          save_repl = r'''function native_library_save_track(array $file, array $path, array &$stats): void
          {
              $fileId = trim((string)($file['id'] ?? ''));
              if ($fileId === '') return;
              $name = trim((string)($file['name'] ?? '')) ?: $fileId;
              $title = preg_replace('/\.[^.]+$/', '', $name) ?: $name;
              $folderPath = $path ? implode(' / ', $path) : 'Google Drive';
              $album = $path ? (string)end($path) : 'Google Drive';
              $mime = trim((string)($file['mime_type'] ?? '')) ?: native_library_mime($name);
              $size = (int)($file['file_size'] ?? 0);
              $cover = trim((string)($file['cover_url'] ?? ''));
              $rootId = (int)($GLOBALS['estradaplay_sync_root_id'] ?? 0);
              $token = (string)($GLOBALS['estradaplay_sync_token'] ?? '');
              $now = date('Y-m-d H:i:s');
              $source = 'api/drive_stream.php?id=' . rawurlencode($fileId);
              $q = db()->prepare('SELECT id FROM music_library WHERE origin=? AND origin_ref=? LIMIT 1');
              $q->execute(['Google Drive',$fileId]);
              $id = (int)($q->fetchColumn() ?: 0);
              if ($id > 0) {
                  $u = db()->prepare('UPDATE music_library SET title=?,artist=?,album=?,folder=?,mime_type=?,file_size=?,cover_url=?,source_url=?,drive_root_id=?,sync_token=?,last_seen_at=? WHERE id=?');
                  $u->execute([$title,$folderPath,$album,$folderPath,$mime,$size ?: null,$cover ?: null,$source,$rootId ?: null,$token ?: null,$now,$id]);
                  $stats['updated']++;
              } else {
                  $i = db()->prepare('INSERT INTO music_library (title,artist,album,folder,cover_url,origin,origin_ref,source_url,mime_type,file_size,drive_root_id,sync_token,last_seen_at,created_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)');
                  $i->execute([$title,$folderPath,$album,$folderPath,$cover ?: null,'Google Drive',$fileId,$source,$mime,$size ?: null,$rootId ?: null,$token ?: null,$now,$now]);
                  $stats['inserted']++;
              }
              $stats['tracks']++;
          }'''
          s, n = save_pat.subn(save_repl, s, count=1)
          if n != 1:
              raise SystemExit('native save function anchor not found')
          p.write_text(s, encoding='utf-8')

          # Admin Drive buttons use the same locked sync instead of a second heavy scanner.
          p = Path('api/google_drive_public.php')
          s = p.read_text(encoding='utf-8')
          if "native_library_sync.php" not in s:
              s = s.replace("require __DIR__ . '/drive_helpers.php';", "require __DIR__ . '/drive_helpers.php';\nrequire_once __DIR__ . '/native_library_sync.php';", 1)
          anchor = "$data = input_json();\n"
          block = r'''$data = input_json();
          if (!empty($data['import_all']) || !empty($data['folder_db_id'])) {
              $ids = !empty($data['folder_db_id']) ? [(int)$data['folder_db_id']] : [];
              $sync = native_library_sync_active_drive_folders(true, $ids);
              $compat = [
                  'folders_scanned'=>(int)($sync['folders'] ?? 0),
                  'tracks_found'=>(int)($sync['tracks'] ?? 0),
                  'inserted'=>(int)($sync['inserted'] ?? 0),
                  'updated'=>(int)($sync['updated'] ?? 0),
                  'removed'=>(int)($sync['removed'] ?? 0),
                  'skipped'=>0,
                  'verified'=>(int)($sync['tracks'] ?? 0),
                  'saved'=>(int)($sync['inserted'] ?? 0) + (int)($sync['updated'] ?? 0),
                  'errors'=>$sync['errors'] ?? [],
              ];
              audit_log('google_drive.public_import', ['server500'=>true,'stats'=>$compat]);
              json_response(['ok'=>true,'stats'=>$compat,'sync'=>$sync,'tracks'=>[]]);
          }
          '''
          if 'server500' not in s:
              s = s.replace(anchor, block, 1)
          p.write_text(s, encoding='utf-8')

          # Admin health/storage section.
          p = Path('admin.php')
          s = p.read_text(encoding='utf-8')
          if '$health = server_health_snapshot();' not in s:
              s = s.replace("?>\n<!doctype html>", "$health = server_health_snapshot();\n?>\n<!doctype html>", 1)
          marker = '''  <div class="grid admin-summary">
              <?php foreach ($summary as $label=>$value): ?><article class="panel"><h2><?= htmlspecialchars($label) ?></h2><p class="big-number"><?= (int)$value ?></p></article><?php endforeach; ?>
            </div>'''
          health = marker + r'''

            <section class="panel">
              <div class="section-heading"><div><h2>Saúde do servidor · modo 500 MB</h2><p class="muted">O servidor guarda somente metadados. Áudio permanece no Google Drive e vai direto para o aparelho.</p></div></div>
              <div class="grid admin-summary">
                <article class="panel"><h2>Espaço livre</h2><p class="big-number"><?= htmlspecialchars((string)$health['disk_free_h']) ?></p></article>
                <article class="panel"><h2>MariaDB</h2><p class="big-number"><?= htmlspecialchars((string)$health['db_h']) ?></p></article>
                <article class="panel"><h2>Logs</h2><p class="big-number"><?= htmlspecialchars((string)$health['logs_h']) ?></p></article>
                <article class="panel"><h2>Catálogo</h2><p class="big-number"><?= (int)$health['tracks'] ?></p></article>
              </div>
              <p class="muted"><strong>Última sincronização:</strong> <?= htmlspecialchars((string)$health['last_sync']) ?> · <strong>Pastas ativas:</strong> <?= (int)$health['active_roots'] ?></p>
              <details><summary>Sincronização automática</summary><p class="muted">Configure o cron da hospedagem para chamar esta URL a cada 5 ou 10 minutos. Chamadas extras não repetem a varredura se o catálogo ainda estiver recente.</p><code style="word-break:break-all"><?= htmlspecialchars((string)$health['cron_url']) ?></code></details>
            </section>'''
          if 'Saúde do servidor · modo 500 MB' not in s:
              if marker not in s:
                  raise SystemExit('admin summary marker not found')
              s = s.replace(marker, health, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate PHP and architecture
        shell: bash
        run: |
          set -euo pipefail
          for f in api/bootstrap.php api/server_500mb.php api/native_library_sync.php api/google_drive_public.php api/cron_drive_sync.php admin.php; do php -l "$f"; done
          grep -q 'SERVER_500MB_V1' api/server_500mb.php
          grep -q 'GET_LOCK' api/server_500mb.php
          grep -q 'sync_token' api/server_500mb.php
          grep -q 'last_sync_removed' api/server_500mb.php
          grep -q 'server_health_snapshot' admin.php
          grep -q 'server_sync_active_drive_folders' api/native_library_sync.php
          ! grep -R -E --include='*.php' '(file_put_contents|fopen)\([^\n]*(\.mp3|\.m4a|\.flac|audio_cache)' api/server_500mb.php api/cron_drive_sync.php

      - name: Commit server only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/bootstrap.php api/server_500mb.php api/native_library_sync.php api/google_drive_public.php api/cron_drive_sync.php admin.php
          git commit -m "Optimize EstradaPlay server for 500MB hosting [skip ci]" || true
          git push origin HEAD:agent/native-apk-build

      - name: Package server-only update
        shell: bash
        run: |
          set -euo pipefail
          PKG=/tmp/estradaplay-server-500mb
          rm -rf "$PKG"
          mkdir -p "$PKG/api"
          cp api/bootstrap.php "$PKG/api/"
          cp api/server_500mb.php "$PKG/api/"
          cp api/native_library_sync.php "$PKG/api/"
          cp api/google_drive_public.php "$PKG/api/"
          cp api/cron_drive_sync.php "$PKG/api/"
          cp admin.php "$PKG/"
          cat > "$PKG/LEIA-PRIMEIRO.txt" <<'EOF'
          EstradaPlay - servidor leve para hospedagem de 500 MB

          Extraia este ZIP na RAIZ da instalação e sobrescreva somente os arquivos incluídos.
          NÃO contém APK, config/config.php, banco, músicas, usuários ou credenciais.

          O que muda:
          - nenhum áudio é salvo no servidor;
          - Google Drive público continua sendo a origem das músicas;
          - catálogo fica no MariaDB somente como metadados;
          - apenas uma sincronização do Drive pode rodar por vez;
          - chamadas automáticas são limitadas a uma varredura a cada 5 minutos;
          - músicas removidas do Drive são removidas do catálogo somente após uma leitura completa e sem erros da pasta raiz;
          - logs PHP são rotacionados em arquivos de até ~2 MB;
          - audit_logs com mais de 30 dias são limpos automaticamente;
          - painel mostra espaço livre, tamanho do banco, logs, catálogo e URL de cron;
          - índices MariaDB são criados para biblioteca, pastas, dispositivos e logs.

          Sincronização automática:
          Depois de instalar, abra o painel Admin > Saúde do servidor e copie a URL de cron.
          Configure a hospedagem para chamar a URL a cada 5 ou 10 minutos.
          EOF
          (cd "$PKG" && zip -qr "$GITHUB_WORKSPACE/EstradaPlay-SERVIDOR-500MB-v1.zip" .)
          sha256sum EstradaPlay-SERVIDOR-500MB-v1.zip

      - name: Publish server-only release
