name: Apply EstradaPlay 2.0.2 Road Limit Voice

permissions:
  contents: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/scripts/apply_202_road_limit_voice.py'
      - '.github/workflows/apply-estradaplay-202-road-limit.yml'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-apk-build
          fetch-depth: 0

      - name: Apply 2.0.2 road-limit rules
        run: python3 .github/scripts/apply_202_road_limit_voice.py

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ROAD_LIMIT_V202' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'ROAD_LIMIT_INDEX_V202' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/OfflineRoadStore.java
          grep -q "versionName '2.0.2'" estradaplay-app-v2/app/build.gradle
          grep -q 'versionCode 202' estradaplay-app-v2/app/build.gradle
          grep -q 'Limite do radar' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'Você passou do limite da via' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java

      - name: Commit definitive 2.0.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estradaplay-app-v2/app/build.gradle \
                  estradaplay-app-v2/app/src/main/java/com/estradaplay/app/RoadSafetyService.java \
                  estradaplay-app-v2/app/src/main/java/com/estradaplay/app/OfflineRoadStore.java
          if git diff --cached --quiet; then
            echo 'Source already at 2.0.2'
            exit 0
          fi
          git commit -m 'EstradaPlay 2.0.2: road and radar speed-limit voice'
          git push origin HEAD:agent/native-apk-build
