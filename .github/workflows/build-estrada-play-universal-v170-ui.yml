name: Estrada Play Universal 1.7.0 Automotive UI
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_universal_ui_v170.py'
      - '.github/workflows/build-estrada-play-universal-v170-ui.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Apply Universal 1.7.0 redesign
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_estrada_play_universal_ui_v170.py
          python3 tools/patch_estrada_play_universal_ui_v170.py

      - name: Verify redesigned architecture
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          M=estrada-play-comunista-app/app/src/main/AndroidManifest.xml
          grep -q "versionName '1.7.0'" "$G"
          grep -q 'versionCode 170' "$G"
          grep -q 'MusicPlayerActivity' "$M"
          grep -q 'Dedicated music surface' "$J/MusicPlayerActivity.java"
          grep -q 'PLAYER_QUERY_STATE' "$J/PlayerService.java"
          grep -q 'CENTRAL DE BORDO' "$J/DriveToolsActivity.java"
          grep -q 'Só o que você precisa' "$J/DriveToolsActivity.java"
          grep -q 'Planejador' "$J/TripPlannerActivity.java"
          grep -q 'MusicPlayerActivity.class' "$J/RoadMapActivity.java"
          ! grep -q 'installUniversalDriveWidgets(width,height)' "$J/RoadMapActivity.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app
          git commit -m "Generate Universal 1.7.0 automotive UI [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore

      - name: Generate embedded safety voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          test "$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 77

      - name: Build Universal APK
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleUniversalDebug

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          A=estrada-play-comunista-app/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$A"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$A" | tee /tmp/v170.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='170' versionName='1.7.0'" /tmp/v170.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$A" >/tmp/v170-cert.txt
          cp "$A" Estrada-Play-Comunista-Universal-1.7.0-Interface-Automotiva.apk
          sha256sum Estrada-Play-Comunista-Universal-1.7.0-Interface-Automotiva.apk | tee /tmp/v170-sha.txt

      - name: Publish Universal 1.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.7.0-ui-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Estrada Play Comunista Universal 1.7.0 - Interface Automotiva" --notes "Redesign funcional da Universal. Remove o painel flutuante Viagem Agora que cobria o mapa; Música passa a abrir em player dedicado e nunca redireciona automaticamente para downloads; Central de Bordo reorganizada por categorias; Planejador redesenhado; interface nativa adaptativa vertical/horizontal. Mantém servidor portátil, Rádio da Rodovia, voz, proteção offline e demais funções. Sem WebView e sem imagens geradas." Estrada-Play-Comunista-Universal-1.7.0-Interface-Automotiva.apk

      - name: Temporary artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Universal-1.7.0-UI
          path: Estrada-Play-Comunista-Universal-1.7.0-Interface-Automotiva.apk
          retention-days: 1
          compression-level: 0
