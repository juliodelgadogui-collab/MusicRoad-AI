name: Estrada Play Comunista 1.4.2 Thoughts
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_comunista_thoughts_v142.py'
      - '.github/workflows/build-estrada-play-comunista-v142.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0
      - name: Generate 1.4.2 editions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_estrada_play_comunista_intelligence_core_v140.py tools/patch_estrada_play_comunista_camera_ai_v140.py tools/patch_estrada_play_comunista_drive_extras_v140.py tools/fix_estrada_play_comunista_v140_runtime.py tools/patch_estrada_play_comunista_offline_voice_v141.py tools/patch_estrada_play_comunista_thoughts_v142.py
          python3 tools/create_estrada_play_comunista.py
          python3 tools/fix_estrada_play_comunista_generated.py
          python3 tools/patch_estrada_play_comunista_design_v110.py
          python3 tools/fix_estrada_play_comunista_splash_v110.py
          python3 tools/patch_estrada_play_comunista_design_v120.py
          python3 tools/patch_estrada_play_comunista_orientation_split_v121.py
          python3 tools/patch_estrada_play_comunista_safety_overlay_v122.py
          python3 tools/patch_estrada_play_comunista_optional_camera_v130.py
          python3 tools/patch_estrada_play_comunista_visible_videos_v131.py
          python3 tools/patch_estrada_play_comunista_intelligence_core_v140.py
          python3 tools/patch_estrada_play_comunista_camera_ai_v140.py
          python3 tools/patch_estrada_play_comunista_drive_extras_v140.py
          python3 tools/fix_estrada_play_comunista_v140_runtime.py
          python3 tools/patch_estrada_play_comunista_offline_voice_v141.py
          python3 tools/patch_estrada_play_comunista_thoughts_v142.py
      - name: Verify thoughts architecture
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          M=estrada-play-comunista-app/app/src/main/AndroidManifest.xml
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          grep -q "versionName '1.4.2'" "$G"
          grep -q 'versionCode 142' "$G"
          grep -q 'class RoadThoughts' "$J/RoadThoughts.java"
          grep -q 'MODE_SCREEN_VOICE' "$J/RoadThoughts.java"
          grep -q 'PARÁFRASE' "$J/ThoughtsActivity.java"
          grep -q 'Karl Marx' "$J/RoadThoughts.java"
          grep -q 'Rosa Luxemburgo' "$J/RoadThoughts.java"
          grep -q 'Antonio Gramsci' "$J/RoadThoughts.java"
          grep -q 'Che Guevara' "$J/RoadThoughts.java"
          grep -q 'RoadThoughtOverlay.show' "$J/MainActivity.java"
          grep -q 'RoadThoughtOverlay.show' "$J/RoadMapActivity.java"
          grep -q 'RoadThoughtOverlay.show' "$J/AutomotiveActivity.java"
          grep -q 'maybeEmitRoadThought' "$J/RoadSafetyService.java"
          grep -q 'interruptThoughtForSafety' "$J/RoadSafetyService.java"
          grep -q 'ThoughtsActivity' "$M"
          grep -q 'primeOfflineRadarCore' "$J/RoadSafetyService.java"
          grep -q 'beginVoiceDucking' "$J/RoadSafetyService.java"
          grep -q 'com.google.mlkit:text-recognition:16.0.1' "$G"
          grep -q "versionName '2.0.11'" estradaplay-app-v2/app/build.gradle
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi
      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app
          git commit -m "Generate Comunista 1.4.2 Pensamentos da Estrada [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore
      - name: Generate embedded safety voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          test "$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 71
      - name: Build both APKs
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleVerticalDebug assembleHorizontalDebug
      - name: Verify APK identities and signatures
        shell: bash
        run: |
          set -euo pipefail
          V=estrada-play-comunista-app/app/build/outputs/apk/vertical/debug/app-vertical-debug.apk
          H=estrada-play-comunista-app/app/build/outputs/apk/horizontal/debug/app-horizontal-debug.apk
          test -f "$V" && test -f "$H"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$V" | tee /tmp/v.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$H" | tee /tmp/h.txt
          grep -q "package: name='com.estradaplay.comunista.vertical' versionCode='142' versionName='1.4.2'" /tmp/v.txt
          grep -q "package: name='com.estradaplay.comunista.horizontal' versionCode='142' versionName='1.4.2'" /tmp/h.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$V" >/tmp/v-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$H" >/tmp/h-cert.txt
          cp "$V" Estrada-Play-Comunista-Vertical-1.4.2.apk
          cp "$H" Estrada-Play-Comunista-Horizontal-1.4.2.apk
          sha256sum Estrada-Play-Comunista-Vertical-1.4.2.apk Estrada-Play-Comunista-Horizontal-1.4.2.apk | tee /tmp/sha.txt
      - name: Publish 1.4.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.4.2-thoughts-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Estrada Play Comunista 1.4.2 - Pensamentos da Estrada" --notes "Adiciona Pensamentos da Estrada: biblioteca local de paráfrases inspiradas em Marx, Engels, Rosa Luxemburgo, Gramsci, Che, Lenin, Mariátegui, Kollontai, Zetkin, Paulo Freire, Amílcar Cabral, Fanon e Sankara. Opções Desligado / Só tela / Tela + voz e intervalos de 20/25/30 min. A primeira frase só aparece após alguns minutos em movimento. Radar, quebra-molas, limite e demais alertas interrompem imediatamente qualquer pensamento. Textos são identificados como paráfrases, nunca como citação literal. Mantém correções 1.4.1 de voz e radares offline RJ/MG/ES, câmera, dashcam, HUD e Vertical/Horizontal independentes. Sem WebView." Estrada-Play-Comunista-Vertical-1.4.2.apk Estrada-Play-Comunista-Horizontal-1.4.2.apk
      - name: Temporary artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-1.4.2
          path: |
            Estrada-Play-Comunista-Vertical-1.4.2.apk
            Estrada-Play-Comunista-Horizontal-1.4.2.apk
          retention-days: 1
          compression-level: 0
