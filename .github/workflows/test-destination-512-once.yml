name: One-shot 5.1.2 destination tests

on:
  push:
    branches:
      - agent/estrada-play-comunista
    paths:
      - .github/workflows/test-destination-512-once.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Destination resolver unit tests
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon --stacktrace testUniversalDebugUnitTest --tests com.estradaplay.comunista.DestinationResolverTest
