name: Migrate Estrada Play Patriota Full

permissions:
  contents: write

on:
  push:
    branches: [agent/estrada-play-patriota]
    paths:
      - '.github/workflows/migrate-estrada-play-patriota-full.yml'

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-patriota
          fetch-depth: 0

      - name: Convert active Android source fully to Patriota
        shell: bash
        run: |
          set -euo pipefail
          OLD=estrada-play-comunista-app
          NEW=estrada-play-patriota-app

          if [ ! -d "$OLD" ]; then
            echo "Old Android source not found; migration may already be complete."
            exit 1
          fi
          test ! -e "$NEW"
          git mv "$OLD" "$NEW"

          if [ -d "$NEW/app/src/main/java/com/estradaplay/comunista" ]; then
            mkdir -p "$NEW/app/src/main/java/com/estradaplay"
            git mv "$NEW/app/src/main/java/com/estradaplay/comunista" "$NEW/app/src/main/java/com/estradaplay/patriota"
          fi
          if [ -d "$NEW/app/src/test/java/com/estradaplay/comunista" ]; then
            mkdir -p "$NEW/app/src/test/java/com/estradaplay"
            git mv "$NEW/app/src/test/java/com/estradaplay/comunista" "$NEW/app/src/test/java/com/estradaplay/patriota"
          fi
          if [ -d "$NEW/app/src/androidTest/java/com/estradaplay/comunista" ]; then
            mkdir -p "$NEW/app/src/androidTest/java/com/estradaplay"
            git mv "$NEW/app/src/androidTest/java/com/estradaplay/comunista" "$NEW/app/src/androidTest/java/com/estradaplay/patriota"
          fi

          python3 - <<'PY'
          from pathlib import Path

          root = Path('estrada-play-patriota-app')
          text_suffixes = {
              '.java', '.kt', '.kts', '.xml', '.gradle', '.properties', '.pro', '.md', '.txt', '.json', '.yml', '.yaml', '.sh', '.py'
          }
          replacements = [
              ('Velocidade demais não é revolução. Reduza para o limite de " + limitKmh + ".',
               'Segurança na estrada é responsabilidade de todos. Reduza para o limite de " + limitKmh + ".'),
              ('CommunistCopilot', 'PatriotaCopilot'),
              ('communistCopilot', 'patriotaCopilot'),
              ('Communist', 'Patriota'),
              ('communist', 'patriota'),
              ('Comunista', 'Patriota'),
              ('comunista', 'patriota'),
              ('Camarada', 'Compatriota'),
              ('camarada', 'compatriota'),
              ('COMRADE', 'COMPATRIOT'),
              ('Comrade', 'Compatriot'),
              ('comrade', 'compatriot'),
              ('EpcBackdropView', 'EppBackdropView'),
              ('Epc', 'Epp'),
              ('EPC', 'EPP'),
              ('epc_', 'epp_'),
              ('epc-', 'epp-'),
          ]

          def convert(s: str) -> str:
              for a, b in replacements:
                  s = s.replace(a, b)
              return s

          for p in list(root.rglob('*')):
              if not p.is_file():
                  continue
              if p.suffix.lower() not in text_suffixes and p.name not in {'build.gradle', 'settings.gradle', 'gradle.properties'}:
                  continue
              try:
                  old = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = convert(old)
              if new != old:
                  p.write_text(new, encoding='utf-8')

          # Rename any remaining active-source file names carrying legacy ideological/acronym names.
          for p in sorted(root.rglob('*'), key=lambda x: len(x.parts), reverse=True):
              new_name = convert(p.name)
              if new_name != p.name:
                  target = p.with_name(new_name)
                  if target.exists():
                      raise RuntimeError(f'rename collision: {p} -> {target}')
                  p.rename(target)

          app = root / 'app/src/main/java/com/estradaplay/patriota/EstradaPlayApplication.java'
          if app.exists():
              s = app.read_text(encoding='utf-8')
              s = s.replace('        PatriotaBranding.register(this);\n', '')
              s = s.replace('        PatriotaBranding.install(this);\n', '')
              app.write_text(s, encoding='utf-8')

          branding = root / 'app/src/main/java/com/estradaplay/patriota/PatriotaBranding.java'
          if branding.exists():
              branding.unlink()

          readme = root / 'README-PATRIOTA.md'
          readme.write_text('''# Estrada Play Patriota\n\nAplicativo Android nativo da edição Patriota.\n\n- Pasta ativa: `estrada-play-patriota-app/`\n- Namespace: `com.estradaplay.patriota`\n- Package Universal: `com.estradaplay.patriota.universal`\n- Identidade: EPP — Estrada Play Patriota\n- Android nativo, sem WebView\n- Rádio/PTT preservado funcionalmente; somente identificadores de package/branding acompanham a edição Patriota\n''', encoding='utf-8')
          PY

          # Dedicated CI follows only the fully Patriota source tree.
          cat > .github/workflows/build-estrada-play-patriota.yml <<'YAML'
          name: Estrada Play Patriota Universal

          on:
            push:
              branches: [agent/estrada-play-patriota]
              paths:
                - 'estrada-play-patriota-app/**'
                - '.github/workflows/build-estrada-play-patriota.yml'
            workflow_dispatch:

          concurrency:
            group: estrada-play-patriota-universal
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-22.04
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - name: Verify full Patriota identity
                  shell: bash
                  run: |
                    set -euo pipefail
                    APP=estrada-play-patriota-app
                    J="$APP/app/src/main/java/com/estradaplay/patriota"
                    test ! -e estrada-play-comunista-app
                    grep -q "namespace 'com.estradaplay.patriota'" "$APP/app/build.gradle"
                    grep -q "applicationId 'com.estradaplay.patriota'" "$APP/app/build.gradle"
                    grep -q "appLabel: 'Estrada Play Patriota'" "$APP/app/build.gradle"
                    grep -q 'versionCode 240' "$APP/app/build.gradle"
                    grep -q "versionName '2.3.9'" "$APP/app/build.gradle"
                    test -f "$J/PatriotaCopilot.java"
                    test -f "$J/EppBackdropView.java"
                    test ! -e "$J/PatriotaBranding.java"
                    grep -q '^package com.estradaplay.patriota;' "$J/RoadRadioService.java"
                    grep -q 'android:process=":radio"' "$APP/app/src/main/AndroidManifest.xml"
                    if grep -R -I -n -E 'package com\.estradaplay\.comunista|Estrada Play Comunista|CommunistCopilot|Camarada|camarada|revolução' "$APP"; then
                      echo 'Legacy ideological identity detected in active Patriota app'; exit 1
                    fi
                    if grep -R -q 'android.webkit.WebView\|new WebView' "$APP/app/src/main/java"; then
                      echo 'WebView detected'; exit 1
                    fi

                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'

                - uses: android-actions/setup-android@v3

                - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '8.9'

                - name: Prepare development signing key
                  shell: bash
                  run: |
                    set -euo pipefail
                    APP=estrada-play-patriota-app
                    if [ -f "$APP/signing/estradaplay-dev.keystore.b64" ]; then
                      base64 -d "$APP/signing/estradaplay-dev.keystore.b64" > "$APP/signing/estradaplay-dev.keystore"
                    fi

                - name: Unit tests and Universal APK
                  shell: bash
                  run: |
                    set -euo pipefail
                    cd estrada-play-patriota-app
                    gradle --no-daemon testUniversalDebugUnitTest
                    gradle --no-daemon assembleUniversalDebug

                - name: Validate Patriota APK identity
                  shell: bash
                  run: |
                    set -euo pipefail
                    APK=estrada-play-patriota-app/app/build/outputs/apk/universal/debug/app-universal-debug.apk
                    test -f "$APK"
                    "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/patriota-badging.txt
                    grep -q "package: name='com.estradaplay.patriota.universal' versionCode='240' versionName='2.3.9'" /tmp/patriota-badging.txt
                    "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
                    cp "$APK" Estrada-Play-Patriota-Universal-2.3.9.apk
                    sha256sum Estrada-Play-Patriota-Universal-2.3.9.apk

                - uses: actions/upload-artifact@v4
                  with:
                    name: Estrada-Play-Patriota-Universal-2.3.9
                    path: Estrada-Play-Patriota-Universal-2.3.9.apk
                    retention-days: 7
                    compression-level: 0
          YAML

          # Active-source hard checks before committing the migration.
          test -d "$NEW"
          test ! -e "$OLD"
          test -d "$NEW/app/src/main/java/com/estradaplay/patriota"
          test ! -e "$NEW/app/src/main/java/com/estradaplay/comunista"
          test -f "$NEW/app/src/main/java/com/estradaplay/patriota/PatriotaCopilot.java"
          test -f "$NEW/app/src/main/java/com/estradaplay/patriota/EppBackdropView.java"
          test ! -e "$NEW/app/src/main/java/com/estradaplay/patriota/PatriotaBranding.java"
          if grep -R -I -n -E 'package com\.estradaplay\.comunista|Estrada Play Comunista|CommunistCopilot|Camarada|camarada|revolução' "$NEW"; then
            echo 'Legacy identity remains in active Patriota source'; exit 1
          fi

          git rm .github/workflows/migrate-estrada-play-patriota-full.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete full Estrada Play Patriota migration"
          git push origin HEAD:agent/estrada-play-patriota
