name: Finalize Rain MM Once

on:
  push:
    branches:
      - agent/estrada-play-comunista

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0
      - name: Fix assignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadWeatherMonitor.java')
          s=p.read_text(encoding='utf-8')
          old='            this.currentChance = currentChance;\n            this.currentTempC = currentTempC;'
          new='            this.currentChance = currentChance;\n            this.currentPrecipMm = currentPrecipMm;\n            this.currentTempC = currentTempC;'
          if old not in s: raise SystemExit('Forecast currentPrecipMm assignment pattern missing')
          s=s.replace(old,new,1)
          old2='            this.updatedAt = updatedAt;\n            this.currentPrecipMm = currentPrecipMm;\n            this.nextRainMm = nextRainMm;'
          new2='            this.updatedAt = updatedAt;\n            this.nextRainMm = nextRainMm;'
          if old2 in s: s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-weather-mm-assignment-once.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "Estrada Play Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize rain millimeter forecast state"
          git push origin HEAD:agent/estrada-play-comunista
