name: Migrate EstradaPlay 2.0.7 Library Recovery

permissions:
  contents: write

on:
  push:
    branches:
      - agent/native-apk-build
    paths:
      - '.github/workflows/migrate-estradaplay-207.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-apk-build

      - name: Apply migration
        run: python3 .github/scripts/migrate_207.py

      - name: Verify sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 207" estradaplay-app-v2/app/build.gradle
          grep -q "versionName '2.0.7'" estradaplay-app-v2/app/build.gradle
          grep -q 'LIBRARY_NONBLOCKING_V207' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/MainActivity.java
          grep -q 'LIBRARY_FAST_V207' estradaplay-app-v2/app/src/main/java/com/estradaplay/app/ApiClient.java
          grep -q 'DB_COMPAT_V207' api/bootstrap.php
          grep -q 'DRIVE_SYNC_V207' api/native_library_sync.php
          php -l api/bootstrap.php
          php -l api/library.php
          php -l api/native_app.php
          php -l api/native_auth.php
          php -l api/native_library_sync.php

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/migrate-estradaplay-207.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "EstradaPlay 2.0.7 library recovery and DB compatibility"
          git push origin HEAD:agent/native-apk-build
