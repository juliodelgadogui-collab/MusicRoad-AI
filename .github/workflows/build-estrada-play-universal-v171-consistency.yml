name: Estrada Play Universal 1.7.1 Visual Consistency
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - '.github/workflows/build-estrada-play-universal-v171-consistency.yml'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/VehicleCostActivity.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadReportActivity.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/HudActivity.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/DriveSettings.java'
      - 'estrada-play-comunista-app/app/build.gradle'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Verify 1.7.1 visual consistency
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          grep -q "versionName '1.7.1'" "$G"
          grep -q 'versionCode 171' "$G"
          grep -q 'Veículo e combustível' "$J/VehicleCostActivity.java"
          grep -q 'PERFIL ATIVO' "$J/VehicleCostActivity.java"
          grep -q 'CONTRIBUIÇÃO DA ESTRADA' "$J/RoadReportActivity.java"
          grep -q 'O QUE VOCÊ ENCONTROU' "$J/RoadReportActivity.java"
          grep -q 'HUD DE PARA-BRISA' "$J/HudActivity.java"
          grep -q 'LEITURA NORMAL NA TELA' "$J/HudActivity.java"
          grep -q 'hud_normal_default_v171' "$J/DriveSettings.java"
          grep -q 'getBoolean("hud_mirror",false)' "$J/DriveSettings.java"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore

      - name: Generate embedded safety voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          test "$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)" -ge 77

      - name: Build Universal APK
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleUniversalDebug

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          A=estrada-play-comunista-app/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$A"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$A" | tee /tmp/v171.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='171' versionName='1.7.1'" /tmp/v171.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$A" >/tmp/v171-cert.txt
          cp "$A" Estrada-Play-Comunista-Universal-1.7.1-Consistencia-Visual.apk
          sha256sum Estrada-Play-Comunista-Universal-1.7.1-Consistencia-Visual.apk | tee /tmp/v171-sha.txt

      - name: Publish Universal 1.7.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.7.1-visual-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Estrada Play Comunista Universal 1.7.1 - Consistência Visual" --notes "Completa o redesign da Universal: Veículo/Abastecimento em cartões com labels e métricas; Reportar ponto com seleção visual, GPS e confirmação; HUD abre em leitura normal na tela e só espelha quando o usuário pedir. Mantém player dedicado, Central de Bordo, Planejador, proteção offline, Rádio da Rodovia e servidor portátil. Sem WebView e sem imagens geradas." Estrada-Play-Comunista-Universal-1.7.1-Consistencia-Visual.apk

      - name: Temporary artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Universal-1.7.1-Consistencia-Visual
          path: Estrada-Play-Comunista-Universal-1.7.1-Consistencia-Visual.apk
          retention-days: 1
          compression-level: 0
