name: Cleanup Old Actions Runs

on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - '.github/workflows/cleanup-old-action-runs.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Delete old runs in small batches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          KEEP_RUN_ID: '33965586079'
        shell: bash
        run: |
          set -u
          deleted=0
          cycles=0

          while (( cycles < 60 )); do
            cycles=$((cycles + 1))
            echo "Cycle $cycles"

            json=""
            if ! json=$(gh api "/repos/$REPO/actions/runs?per_page=100" 2>&1); then
              echo "$json"
              echo "GitHub temporarily refused listing; cooling down"
              sleep 60
              continue
            fi

            mapfile -t ids < <(printf '%s' "$json" | jq -r '.workflow_runs[].id' | head -n 40)
            batch=0

            for id in "${ids[@]}"; do
              [[ "$id" == "$CURRENT_RUN_ID" ]] && continue
              [[ "$id" == "$KEEP_RUN_ID" ]] && continue
              (( batch >= 20 )) && break

              echo "Deleting $id"
              if gh api --method DELETE "/repos/$REPO/actions/runs/$id" >/dev/null 2>&1; then
                deleted=$((deleted + 1))
                batch=$((batch + 1))
              else
                echo "Could not delete $id on this cycle"
              fi
              sleep 1
            done

            echo "Deleted in cycle: $batch; total this run: $deleted"

            if (( batch == 0 )); then
              echo "Nothing else deletable in first page"
              break
            fi

            sleep 20
          done

          remaining=$(gh api "/repos/$REPO/actions/runs?per_page=1" --jq '.total_count' 2>/dev/null || echo unknown)
          echo "Cleanup finished. Deleted: $deleted. Remaining: $remaining"
