name: Cleanup Old Actions Runs

on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - '.github/workflows/cleanup-old-action-runs.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-old-actions-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Delete old workflow runs safely
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          KEEP_RUN_ID: '33965586079'
        shell: bash
        run: |
          set -u
          echo "Current cleanup run: $CURRENT_RUN_ID"
          echo "Preserving EPC 2.4.5 run: $KEEP_RUN_ID"

          deleted=0
          pass=0

          get_ids() {
            local attempt out
            for attempt in $(seq 1 20); do
              if out=$(gh api "/repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[].id' 2>/tmp/gh-get.err); then
                printf '%s\n' "$out"
                return 0
              fi
              echo "List attempt $attempt was rate-limited or failed; retrying" >&2
              cat /tmp/gh-get.err >&2 || true
              sleep $((attempt * 3))
            done
            return 1
          }

          delete_run() {
            local id="$1" attempt
            for attempt in $(seq 1 12); do
              if gh api --method DELETE "/repos/$REPO/actions/runs/$id" >/dev/null 2>/tmp/gh-del.err; then
                return 0
              fi
              echo "Delete $id attempt $attempt failed; backing off" >&2
              cat /tmp/gh-del.err >&2 || true
              sleep $((attempt * 2))
            done
            return 1
          }

          while true; do
            pass=$((pass + 1))
            echo "Cleanup pass $pass"

            ids_text=$(get_ids) || {
              echo "Could not list runs after retries" >&2
              exit 1
            }

            mapfile -t ids <<< "$ids_text"
            deletable=()
            for id in "${ids[@]}"; do
              [[ -z "$id" ]] && continue
              if [[ "$id" != "$CURRENT_RUN_ID" && "$id" != "$KEEP_RUN_ID" ]]; then
                deletable+=("$id")
              fi
            done

            if (( ${#deletable[@]} == 0 )); then
              break
            fi

            batch_count=0
            for id in "${deletable[@]}"; do
              echo "Deleting run $id"
              if delete_run "$id"; then
                deleted=$((deleted + 1))
              else
                echo "Giving up on run $id after retries" >&2
              fi

              batch_count=$((batch_count + 1))
              sleep 0.6
              if (( batch_count % 20 == 0 )); then
                echo "Cooling down after 20 deletions"
                sleep 8
              fi
            done

            if (( pass >= 30 )); then
              echo "Safety stop after 30 passes" >&2
              exit 1
            fi
          done

          remaining="unknown"
          for attempt in $(seq 1 10); do
            if remaining=$(gh api "/repos/$REPO/actions/runs?per_page=1" --jq '.total_count' 2>/dev/null); then
              break
            fi
            sleep $((attempt * 2))
          done

          echo "Deleted runs in this execution: $deleted"
          echo "Remaining runs reported by GitHub: $remaining"
