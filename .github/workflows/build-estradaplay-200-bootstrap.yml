name: Build EstradaPlay 2.0.0

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [agent/native-apk-build]
    paths:
      - '.github/scripts/apply_200_final.py'
      - '.github/workflows/build-estradaplay-200-bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: estradaplay-200-bootstrap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate final 2.0 source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d estradaplay-app/signing/estradaplay-dev.keystore.b64 > estradaplay-app/signing/estradaplay-dev.keystore

          python3 estradaplay-app/tools/apply_151.py
          python3 estradaplay-app/tools/apply_152_alert_fix.py
          python3 estradaplay-app/tools/apply_160_automotive.py
          python3 estradaplay-app/tools/apply_161_stability.py
          python3 estradaplay-app/tools/apply_170_responsive_ui.py
          python3 .github/scripts/apply_171_touch_fix.py
          python3 .github/scripts/apply_172_gps_radar_fix.py
          python3 .github/scripts/apply_173_touch_compat_fix.py
          python3 .github/scripts/apply_174b_direct_touch_musicroad_radars.py
          python3 .github/scripts/apply_175_touch_window_hardening.py
          python3 .github/scripts/apply_176_dual_orientation_native_touch.py
          python3 .github/scripts/apply_177_audit_fixes.py
          python3 .github/scripts/apply_178_stationary_speed_fix.py
          python3 .github/scripts/apply_200_final.py

          grep -q "versionName '2.0.0'" estradaplay-app/app/build.gradle
          grep -q 'versionCode 200' estradaplay-app/app/build.gradle
          grep -q 'AUTOMOTIVE_INPUT_V177' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'STATIONARY_SPEED_V178' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'stationaryConfirmed = true' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadSafetyService.java
          grep -q 'OSM_DIRECT_RADARS_V200' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadPackStore.java
          grep -q 'OSM_DIRECT_MAP_V200' estradaplay-app/app/src/main/java/com/estradaplay/app/OfflineRoadStore.java
          grep -q 'root.getWidth() > 0' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'openMain("music")' estradaplay-app/app/src/main/java/com/estradaplay/app/RoadMapActivity.java
          grep -q 'android:resizeableActivity="true"' estradaplay-app/app/src/main/AndroidManifest.xml
          if grep -q 'sensorLandscape' estradaplay-app/app/src/main/AndroidManifest.xml; then exit 1; fi
          if grep -R -q 'android.webkit.WebView\|new WebView' estradaplay-app/app/src/main/java; then exit 1; fi

          rm -rf estradaplay-app-v2
          mkdir -p estradaplay-app-v2/signing
          cp estradaplay-app/build.gradle estradaplay-app/gradle.properties estradaplay-app/settings.gradle estradaplay-app-v2/
          cp estradaplay-app/signing/estradaplay-dev.keystore.b64 estradaplay-app-v2/signing/
          cp -a estradaplay-app/app estradaplay-app-v2/
          rm -rf estradaplay-app-v2/app/build estradaplay-app-v2/.gradle
          cp estradaplay-app/signing/estradaplay-dev.keystore estradaplay-app-v2/signing/estradaplay-dev.keystore
          cat > estradaplay-app-v2/README.md <<'EOF'
          # EstradaPlay 2.0.0

          Código-fonte Android consolidado. Esta pasta é a fonte definitiva da série 2.x.
          O build deve compilar diretamente `estradaplay-app-v2/`; não aplicar scripts 1.5–1.7.

          Inclui:
          - horizontal + vertical nativos;
          - controles compatíveis com touchscreen/mouse/stylus/ENTER automotivo;
          - GPS com parada confirmada e velocidade 0 quando estacionado;
          - música offline e biblioteca;
          - radares MusicRoad com fallback direto OpenStreetMap;
          - mapa offline de servidor e fallback local direto OpenStreetMap;
          - cockpit responsivo usando a área real da janela.
          EOF

      - name: Build directly from clean v2 source
        working-directory: estradaplay-app-v2
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=estradaplay-app-v2/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/cert.txt
          grep -qi 'c2d88a15b134f435de9fb532699e93fcd46bc35900a086575fcb2bf7f2f66fdb' /tmp/cert.txt
          cp "$APK" EstradaPlay-2.0.0.apk
          sha256sum EstradaPlay-2.0.0.apk | tee /tmp/apk-sha.txt

      - name: Package optional server helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ep200 && mkdir -p /tmp/ep200/api
          for f in \
            api/radar_db.php api/radars.php api/road_hazard_db.php \
            api/road_pack.php api/road_safety_pack_helpers.php \
            api/road_state_pack.php api/road_corridor_pack.php \
            api/offline_state.php api/road_map_state.php \
            api/road_map_corridor.php api/road_map_helpers.php; do
            test -f "$f" && cp "$f" /tmp/ep200/api/
          done
          cat > /tmp/ep200/LEIA-PRIMEIRO.txt <<'EOF'
          EstradaPlay 2.0.0 — pacote opcional do servidor.
          O APK 2.0 possui fallback direto OpenStreetMap para radares e mapa local.
          Estes arquivos melhoram a cobertura usando a base MusicRoad e pacotes maiores do servidor.
          Não apague config.php, banco de dados, usuários, músicas ou metadados.
          EOF
          (cd /tmp/ep200 && zip -qr "$GITHUB_WORKSPACE/EstradaPlay-2.0.0-SERVIDOR-OPCIONAL.zip" .)
          unzip -t EstradaPlay-2.0.0-SERVIDOR-OPCIONAL.zip

      - name: Commit definitive v2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f estradaplay-app-v2/signing/estradaplay-dev.keystore
          rm -rf estradaplay-app-v2/app/build estradaplay-app-v2/.gradle
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A estradaplay-app-v2
          if ! git diff --cached --quiet; then
            git commit -m 'EstradaPlay 2.0.0: consolidate definitive Android source'
            git push origin HEAD:agent/native-apk-build
          fi
          echo "RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Try temporary Actions artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: EstradaPlay-2.0.0-APK
          path: EstradaPlay-2.0.0.apk
          retention-days: 1
          compression-level: 0

      - name: Publish 2.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estradaplay-2.0.0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --target "$RELEASE_TARGET" \
            --title 'EstradaPlay 2.0.0 · base consolidada' \
            --notes 'Versão 2 consolidada: toque automotivo validado no fluxo Mapa/Música/Início, horizontal + vertical, velocidade estacionado=0 com proteção contra valor GPS antigo, radares MusicRoad com fallback OpenStreetMap, mapa offline com fallback local OpenStreetMap, música offline e correção do posicionamento do botão Centralizar. O código definitivo fica em estradaplay-app-v2 e os próximos builds não dependem da cadeia 1.x.' \
            EstradaPlay-2.0.0.apk EstradaPlay-2.0.0-SERVIDOR-OPCIONAL.zip
