name: One-shot black map repair

on:
  push:
    branches:
      - agent/estrada-play-comunista
    paths:
      - .github/workflows/fix-black-map-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0
      - name: Repair MapLibre lifecycle and safe fallback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          activity = Path('estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java')
          s = activity.read_text(encoding='utf-8')
          old = '''                buildResponsiveUi();
                if (Double.isFinite(lastLat) && Double.isFinite(lastLon) && roadMap != null) {'''
          new = '''                buildResponsiveUi();
                // MAP_REBUILD_LIFECYCLE_V511: this resize callback normally runs after Activity.onResume().
                // The freshly-created MapView must receive its lifecycle again or MapLibre can stay black.
                if (roadMap != null) {
                    try { roadMap.onStartMap(); } catch (Throwable ignored) {}
                    try { roadMap.onResumeMap(); } catch (Throwable ignored) {}
                }
                if (Double.isFinite(lastLat) && Double.isFinite(lastLon) && roadMap != null) {'''
          if old not in s:
              raise SystemExit('RoadMapActivity resize block not found')
          s = s.replace(old, new, 1)
          activity.write_text(s, encoding='utf-8')

          cfg = Path('estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MapStyleConfigV400.java')
          s = cfg.read_text(encoding='utf-8')
          old = 'private static final String FALLBACK="https://tiles.openfreemap.org/styles/dark";'
          new = 'private static final String FALLBACK="https://tiles.openfreemap.org/styles/liberty";'
          if old not in s:
              raise SystemExit('MapStyleConfig fallback not found')
          s = s.replace(old, new, 1)
          old = 'return valid(v)?v:FALLBACK;'
          new = '''// OpenFreeMap dark is kept out of the automatic fallback path because a style/source failure
        // can look like a completely black map on some MapLibre/driver combinations.
        if(valid(v) && !"https://tiles.openfreemap.org/styles/dark".equalsIgnoreCase(v.trim())) return v;
        return FALLBACK;'''
          if old not in s:
              raise SystemExit('MapStyleConfig selection line not found')
          s = s.replace(old, new, 1)
          cfg.write_text(s, encoding='utf-8')

          view = Path('estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapView.java')
          s = view.read_text(encoding='utf-8')
          old = 'private static final String OPEN_STYLE = "https://tiles.openfreemap.org/styles/dark";'
          new = 'private static final String OPEN_STYLE = "https://tiles.openfreemap.org/styles/liberty";'
          if old not in s:
              raise SystemExit('RoadMapView open style not found')
          s = s.replace(old, new, 1)
          old = '''        ui.postDelayed(() -> {
            if (!mapReady) loadOfflineMap();
        }, 6500L);'''
          new = '''        ui.postDelayed(() -> {
            if (mapReady) return;
            // Do not replace a slow online basemap with the intentionally minimal offline style.
            // That style has no base tiles and can look like a black screen until local road data arrives.
            if (!online()) loadOfflineMap();
            else {
                fallback.setText("Mapa online demorando…\\nGPS e alertas continuam ativos");
                fallback.setVisibility(View.VISIBLE);
            }
        }, 12000L);'''
          if old not in s:
              raise SystemExit('RoadMapView timeout block not found')
          s = s.replace(old, new, 1)
          view.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java \
            estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MapStyleConfigV400.java \
            estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapView.java
          git commit -m 'fix: prevent black MapLibre road map'
          git push origin HEAD:agent/estrada-play-comunista
