name: Estrada Play Universal 2.1.0 Base Consolidada
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadSafetyService.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadHazardMatcher.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadHazardSelector.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadAlertCooldown.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadLimitPolicy.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadSafetyFormat.java'
      - 'estrada-play-comunista-app/app/src/test/**'
      - 'estrada-play-comunista-app/app/build.gradle'
      - 'tools/ci_build_epc_v210_base_consolidada.sh'
      # Reintroducing any legacy EPC generator must run this workflow and fail the architecture gate.
      - 'tools/patch_estrada_play_v208_navigation_real.py'
      - 'tools/fix_epc_v208_navigation_strings.py'
      - 'tools/ci_build_epc_v208_navigation_real.sh'
      - 'tools/patch_estrada_play_v209_context_inteligente.py'
      - 'tools/ci_build_epc_v209_context_inteligente.sh'
      - 'tools/migrate_epc_v210_base_consolidada.py'
      - '.github/workflows/build-estrada-play-universal-v208-navigation-real.yml'
      - '.github/workflows/build-estrada-play-universal-v209-contexto-inteligente.yml'
      - '.github/workflows/build-estrada-play-universal-v210-base-consolidada.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v210-base-consolidada
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Verify direct-source architecture
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          test -f "$J/RoadSafetyService.java"
          grep -q 'versionCode 210' "$APP/app/build.gradle"
          grep -q "versionName '2.1.0'" "$APP/app/build.gradle"
          grep -q 'BASE_CONSOLIDADA_V210' "$J/RoadSafetyService.java"
          forbidden=(
            tools/patch_estrada_play_v208_navigation_real.py
            tools/fix_epc_v208_navigation_strings.py
            tools/ci_build_epc_v208_navigation_real.sh
            tools/patch_estrada_play_v209_context_inteligente.py
            tools/ci_build_epc_v209_context_inteligente.sh
            tools/migrate_epc_v210_base_consolidada.py
            .github/workflows/build-estrada-play-universal-v208-navigation-real.yml
            .github/workflows/build-estrada-play-universal-v209-contexto-inteligente.yml
          )
          for legacy in "${forbidden[@]}"; do
            if [ -e "$legacy" ]; then
              echo "Legacy EPC generator returned: $legacy"
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Production signing readiness
        env:
          KEYSTORE_B64: ${{ secrets.ESTRADAPLAY_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo 'SIGNING_STATUS=production-ready' >> "$GITHUB_ENV"
          else
            echo 'SIGNING_STATUS=development-test' >> "$GITHUB_ENV"
          fi

      - name: Unit tests, build and validate 2.1.0
        run: bash tools/ci_build_epc_v210_base_consolidada.sh

      - name: Publish 2.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-2.1.0-base-consolidada-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Estrada Play Comunista Universal 2.1.0 - Base Consolidada" \
            --notes "Base interna consolidada e compilada diretamente do fonte versionado, sem gerador de patch no caminho de build. A cadeia geradora EPC 2.0.8/2.0.9 foi aposentada e o CI bloqueia sua reintrodução. RoadSafetyService coordena ciclo de vida e efeitos Android, enquanto geometria de alertas, seleção, cooldown, estado de limite e formatação ficam em políticas puras com testes JUnit obrigatórios. Navegação Real 2.0.8, Contexto Inteligente 2.0.9 e Segurança 2.0.7 preservados. Build nativo sem WebView. Signing: ${SIGNING_STATUS}." \
            Estrada-Play-Comunista-Universal-2.1.0-Base-Consolidada.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.1.0-Base-Consolidada
          path: Estrada-Play-Comunista-Universal-2.1.0-Base-Consolidada.apk
          retention-days: 3
          compression-level: 0
