name: Estrada Play Universal 2.0.8 Navegacao Real
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RouteEngine.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java'
      - 'estrada-play-comunista-app/app/build.gradle'
      - 'api/navigation_route.php'
      - 'tools/patch_estrada_play_v208_navigation_real.py'
      - 'tools/ci_build_epc_v208_navigation_real.sh'
      - '.github/workflows/build-estrada-play-universal-v208-navigation-real.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v208-navigation-real
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Generate 2.0.8 navigation source
        run: |
          python3 -m py_compile tools/patch_estrada_play_v208_navigation_real.py
          python3 tools/patch_estrada_play_v208_navigation_real.py

      - name: Verify 2.0.8 source scope
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          grep -q 'versionCode 208' "$APP/app/build.gradle"
          grep -q "versionName '2.0.8'" "$APP/app/build.gradle"
          grep -q 'NAVIGATION_REAL_V208' "$J/RouteEngine.java"
          grep -q 'NAVIGATION_REAL_ACTIVITY_V208' "$J/RoadMapActivity.java"
          grep -q 'route.match(lat, lon' "$J/RoadMapActivity.java"
          grep -q 'api/navigation_route.php' "$J/RouteEngine.java"
          php -l api/navigation_route.php
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Persist generated 2.0.8 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app/app/build.gradle \
                  estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/RoadMapActivity.java
          git commit -m "Generate Universal 2.0.8 Navegacao Real [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Production signing readiness
        env:
          KEYSTORE_B64: ${{ secrets.ESTRADAPLAY_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ESTRADAPLAY_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo 'SIGNING_STATUS=production-ready' >> "$GITHUB_ENV"
          else
            echo 'SIGNING_STATUS=development-test' >> "$GITHUB_ENV"
          fi

      - name: Build, lint and package 2.0.8
        run: bash tools/ci_build_epc_v208_navigation_real.sh

      - name: Publish 2.0.8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-2.0.8-navegacao-real-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" \
            --title "Estrada Play Comunista Universal 2.0.8 - Navegação Real" \
            --notes "Navegação real: sequência completa de manobras, progresso sobre a geometria da rota, map matching local com direção, distância real até a próxima manobra, chegada/distância/duração atualizadas, detecção persistente de saída da rota e recálculo automático. Rotas preferencialmente calculadas pelo servidor autenticado; fallback operacional durante migração. Segurança 2.0.7, biblioteca offline, proteção rodoviária, rádio, Estrada Viva e cockpit horizontal preservados. Sem WebView. Signing: ${SIGNING_STATUS}." \
            Estrada-Play-Comunista-Universal-2.0.8-Navegacao-Real.apk \
            Estrada-Play-Comunista-2.0.8-SERVIDOR-NAVEGACAO.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.0.8-Navegacao-Real
          path: |
            Estrada-Play-Comunista-Universal-2.0.8-Navegacao-Real.apk
            Estrada-Play-Comunista-2.0.8-SERVIDOR-NAVEGACAO.zip
          retention-days: 3
          compression-level: 0
