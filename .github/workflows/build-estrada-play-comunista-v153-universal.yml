name: Estrada Play Comunista 1.5.3 Universal
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'tools/patch_estrada_play_comunista_universal_v153.py'
      - '.github/workflows/build-estrada-play-comunista-v153-universal.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Apply 1.5.3 universal patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/patch_estrada_play_comunista_universal_v153.py
          python3 tools/patch_estrada_play_comunista_universal_v153.py

      - name: Verify universal architecture
        shell: bash
        run: |
          set -euo pipefail
          G=estrada-play-comunista-app/app/build.gradle
          J=estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista
          M=estrada-play-comunista-app/app/src/main/AndroidManifest.xml
          grep -q "versionName '1.5.3'" "$G"
          grep -q 'versionCode 153' "$G"
          grep -q 'universal {' "$G"
          grep -q "applicationIdSuffix '.universal'" "$G"
          grep -q "appOrientation: 'fullSensor'" "$G"
          grep -q "FIXED_LAYOUT.*universal" "$G"
          grep -q 'UNIVERSAL_ORIENTATION_V153' "$J/RoadMapActivity.java"
          grep -q 'usePortraitLayout()' "$J/RoadMapActivity.java"
          grep -q 'buildPortraitUi(width, height)' "$J/RoadMapActivity.java"
          grep -q 'buildLandscapeUi(width, height)' "$J/RoadMapActivity.java"
          grep -q 'UNIVERSAL_ORIENTATION_V153_REDIRECT' "$J/AutomotiveActivity.java"
          test "$(grep -c 'android:stopWithTask=\"true\"' "$M")" -ge 3
          grep -q 'return START_NOT_STICKY;' "$J/RoadSafetyService.java"
          grep -q 'cachedHazardCount' "$J/RoadPackStore.java"
          grep -q 'stability_152_single_voice' "$J/VoiceSettings.java"
          grep -q 'STABILITY_V152_ASYNC_ROAD_SCREEN' "$J/MainActivity.java"
          test -s estrada-play-comunista-app/UNIVERSAL-1.5.3.md
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estrada-play-comunista-app
          git commit -m "Generate Comunista 1.5.3 universal [skip ci]" || true
          git push origin HEAD:agent/estrada-play-comunista
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signer
        run: base64 -d estrada-play-comunista-app/signing/estradaplay-dev.keystore.b64 > estrada-play-comunista-app/signing/estradaplay-dev.keystore

      - name: Generate and validate embedded safety voice bank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check sherpa-onnx soundfile numpy
          MODEL=/tmp/vits-piper-pt_BR-faber-medium.tar.bz2
          curl -L --fail --retry 3 --retry-delay 2 -o "$MODEL" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-pt_BR-faber-medium.tar.bz2
          echo "7add3f923ad6bc25ca8a192805fd1a64d1b3893e4611c4a9719545a825039a83  $MODEL" | sha256sum -c -
          rm -rf /tmp/epc-voice && mkdir -p /tmp/epc-voice
          tar -xjf "$MODEL" -C /tmp/epc-voice
          python3 estrada-play-comunista-app/tools/generate_voice_bank.py --model-root /tmp/epc-voice --output estrada-play-comunista-app/app/src/main/res/raw --metadata-output estrada-play-comunista-app/app/src/main/assets/estradaplay_voice
          COUNT=$(find estrada-play-comunista-app/app/src/main/res/raw -maxdepth 1 -name 'ep_*.wav' | wc -l)
          test "$COUNT" -ge 77
          for f in ep_radar_frente.wav ep_limite_radar.wav ep_reduza.wav ep_dist_0500.wav ep_speed_060.wav ep_quebra_molas_frente.wav; do test -s "estrada-play-comunista-app/app/src/main/res/raw/$f"; done

      - name: Build universal APK
        working-directory: estrada-play-comunista-app
        run: gradle --no-daemon clean assembleUniversalDebug

      - name: Verify universal identity and signature
        shell: bash
        run: |
          set -euo pipefail
          U=estrada-play-comunista-app/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$U"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$U" | tee /tmp/v153-universal.txt
          grep -q "package: name='com.estradaplay.comunista.universal' versionCode='153' versionName='1.5.3'" /tmp/v153-universal.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$U" >/tmp/v153-universal-cert.txt
          cp "$U" Estrada-Play-Comunista-Universal-1.5.3.apk
          sha256sum Estrada-Play-Comunista-Universal-1.5.3.apk | tee /tmp/v153-universal-sha.txt

      - name: Publish 1.5.3 universal release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-1.5.3-universal-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Estrada Play Comunista 1.5.3 - Universal Vertical + Horizontal" --notes "APK único com rotação real entre vertical e horizontal. O flavor Universal usa fullSensor e package com.estradaplay.comunista.universal para coexistir com os APKs Vertical e Horizontal anteriores. O cockpit principal escolhe dinamicamente buildPortraitUi ou buildLandscapeUi conforme as dimensões atuais e reconstrói a interface em mudanças de orientação. Mantém integralmente a estabilização 1.5.2: serviços encerram com a tarefa, RoadSafetyService não é sticky, voz embarcada única por padrão, pensamentos só na tela por padrão, contagem de perigos cacheada e I/O pesado fora da UI. Mantém radares offline RJ/MG/ES, Inteligência Coletiva, câmera/dashcam, HUD, música e sem WebView. Por usar package próprio, a primeira instalação Universal não herda automaticamente dados privados dos packages .vertical/.horizontal." Estrada-Play-Comunista-Universal-1.5.3.apk

      - name: Temporary artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-Universal-1.5.3
          path: Estrada-Play-Comunista-Universal-1.5.3.apk
          retention-days: 1
          compression-level: 0
