name: Estrada Play Universal 2.0.2 Biblioteca Offline Segura
permissions:
  contents: write
on:
  push:
    branches: [agent/estrada-play-comunista]
    paths:
      - 'estrada-play-comunista-app/app/build.gradle'
      - 'estrada-play-comunista-app/app/src/main/AndroidManifest.xml'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/LibraryStore.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MusicPlayerActivity.java'
      - 'estrada-play-comunista-app/app/src/main/java/com/estradaplay/comunista/MusicStorageActivity.java'
      - 'tools/ci_build_epc_v202_library.sh'
      - '.github/workflows/build-estrada-play-universal-v202-biblioteca-segura.yml'
  workflow_dispatch:

concurrency:
  group: estrada-play-comunista-v202-biblioteca
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/estrada-play-comunista
          fetch-depth: 0

      - name: Verify 2.0.2 library architecture
        shell: bash
        run: |
          set -euo pipefail
          APP=estrada-play-comunista-app
          J="$APP/app/src/main/java/com/estradaplay/comunista"
          grep -q 'versionCode 202' "$APP/app/build.gradle"
          grep -q "versionName '2.0.2'" "$APP/app/build.gradle"
          grep -q 'reconcileOffline' "$J/LibraryStore.java"
          grep -q 'storageStats' "$J/LibraryStore.java"
          grep -q 'removeOrphanFiles' "$J/LibraryStore.java"
          grep -q 'removeAllOffline' "$J/LibraryStore.java"
          grep -q 'class MusicStorageActivity' "$J/MusicStorageActivity.java"
          grep -q 'MediaStore.createDeleteRequest' "$J/MusicStorageActivity.java"
          grep -q 'RECUPERAR MÚSICAS ANTIGAS' "$J/MusicStorageActivity.java"
          grep -q 'MusicStorageActivity' "$APP/app/src/main/AndroidManifest.xml"
          grep -q 'READ_MEDIA_AUDIO' "$APP/app/src/main/AndroidManifest.xml"
          if grep -R -q 'android.webkit.WebView\|new WebView' "$J"; then exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and validate APK
        run: bash tools/ci_build_epc_v202_library.sh

      - name: Publish 2.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="estrada-play-comunista-2.0.2-biblioteca-segura-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --target "$(git rev-parse HEAD)" \
            --title "Estrada Play Comunista Universal 2.0.2 - Biblioteca Offline Segura" \
            --notes "Corrige músicas já baixadas que não apareciam no player reconstruindo o índice a partir dos arquivos reais. Adiciona Central de Armazenamento e Limpeza, remoção de órfãos, exclusão total com confirmação, recuperação de cópias antigas via MediaStore e limpeza autorizada pelo Android. Downloads atuais continuam na área específica do app para serem removidos com a desinstalação. Mantém a Central Automotiva 2.0.1, Clima da Rota, voz completa e sem WebView." \
            Estrada-Play-Comunista-Universal-2.0.2-Biblioteca-Offline-Segura.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Estrada-Play-Comunista-2.0.2-Biblioteca-Offline-Segura
          path: Estrada-Play-Comunista-Universal-2.0.2-Biblioteca-Offline-Segura.apk
          retention-days: 3
          compression-level: 0
