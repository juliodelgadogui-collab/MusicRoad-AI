<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04060a">
  <title>MusicRoad</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 68% 28%,rgba(147,135,255,.19),transparent 26%),radial-gradient(circle at 28% 80%,rgba(55,225,189,.1),transparent 28%),#04060a;color:#f4f7ff;font-family:Inter,"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.launch{text-align:center}.logo{position:relative;width:88px;height:88px;margin:auto;display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);border-radius:28px;background:linear-gradient(145deg,#202b3c,#080d15);font-size:25px;font-weight:950;letter-spacing:-.09em;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.1)}.logo:after{content:"";position:absolute;inset:13px;border:1px solid rgba(114,243,214,.48);border-radius:17px}.brand{margin-top:20px;font-size:20px;font-weight:850;letter-spacing:-.03em}.edition{margin-top:4px;color:#72f3d6;font-size:8px;font-weight:900;letter-spacing:.2em}.status{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:24px;color:#8290a4;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#72f3d6;box-shadow:0 0 16px rgba(114,243,214,.75);animation:pulse 1.4s ease-in-out infinite}.line{width:150px;height:2px;margin:16px auto 0;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.08)}.line i{display:block;width:44%;height:100%;background:linear-gradient(90deg,#72f3d6,#9387ff);animation:load 1.3s ease-in-out infinite}@keyframes pulse{50%{opacity:.32;transform:scale(.7)}}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}@media(prefers-reduced-motion:reduce){.dot,.line i{animation:none}.line i{width:100%}}
  </style>
</head>
<body>
  <main class="launch"><div class="logo">MR</div><div class="brand">MusicRoad</div><div class="edition">PREMIUM DRIVE</div><div class="status" id="status"><span class="dot"></span><span>Preparando sua conta…</span></div><div class="line"><i></i></div></main>
  <script>
    (function(){const A=window.MusicRoadAndroid,st=document.getElementById('status');if(!A){st.textContent='Integração Android indisponível.';return}if(!A.isNetworkAvailable()){A.openOfflineCore();return}document.addEventListener('mr:device-auth',event=>{const d=event.detail||{};if(d.action!=='login')return;if(d.ok){st.textContent='Conta reconhecida. Abrindo MusicRoad…';setTimeout(()=>A.openOnlineApp(),180)}else{st.textContent='Abrindo sua sessão…';setTimeout(()=>A.openOnlineApp(),180)}});A.autoLoginDevice();setTimeout(()=>{try{A.openOnlineApp()}catch(_){}},6000)})();
  </script>
</body>
</html>
