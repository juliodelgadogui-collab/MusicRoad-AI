plugins {
    id 'com.android.application'
}

def musicRoadUrl = project.findProperty('MUSICROAD_URL') ?: 'https://SEU-DOMINIO.com/musicroad-ai/'

android {
    namespace 'com.musicroad.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.musicroad.ai'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '2.0.0'
        buildConfigField 'String', 'MUSICROAD_URL', '"' + musicRoadUrl.replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
