plugins {
    id 'com.android.application'
}

def estradaPlayUrl = project.findProperty('ESTRADAPLAY_URL') ?: 'https://musicroad1.gestao2.store/'
def estradaPlayDevKey = file('../signing/estradaplay-dev.keystore')

android {
    namespace 'com.estradaplay.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.estradaplay.app'
        minSdk 24
        targetSdk 35
        versionCode 209
        versionName '2.0.9'
        buildConfigField 'String', 'SERVER_URL', '"' + estradaPlayUrl.replace('"', '\\"') + '"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        debug {
            storeFile estradaPlayDevKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'org.maplibre.gl:android-sdk:13.4.1'
}
