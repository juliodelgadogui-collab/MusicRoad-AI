<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06090d"><style>*{box-sizing:border-box}body{margin:0;background:#06090d;color:#edf3f7;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh}.logo{width:76px;height:76px;border-radius:24px;background:#ff7a1a;color:#111;display:grid;place-items:center;font-weight:950;font-size:24px;box-shadow:0 16px 50px #ff7a1a33}.t{text-align:center;margin-top:18px;font-weight:800}.s{color:#7f909d;font-size:12px;margin-top:7px;text-align:center}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4bd590;margin-right:6px}</style></head><body><div><div class="logo">MR</div><div class="t">MusicRoad</div><div class="s" id="status"><span class="dot"></span>Preparando sua conta…</div></div><script>(function(){const A=window.MusicRoadAndroid,st=document.getElementById('status');if(!A){st.textContent='Integração Android indisponível.';return}if(!A.isNetworkAvailable()){A.openOfflineCore();return}document.addEventListener('mr:device-auth',e=>{const d=e.detail||{};if(d.action!=='login')return;if(d.ok){st.textContent='Conta reconhecida. Abrindo MusicRoad…';setTimeout(()=>A.openOnlineApp(),180)}else{st.textContent='Abrindo sua sessão…';setTimeout(()=>A.openOnlineApp(),180)}});A.autoLoginDevice();setTimeout(()=>{try{A.openOnlineApp()}catch(_){}},6000)})();</script></body></html>
